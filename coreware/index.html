    track.innerHTML = zoomShots.map(s => `<div class="mb-zoom-slide"><div class="mb-zoom-img" data-mb="zoom-toggle">${s.innerHTML}</div></div>`).join("");
    els.zoom.querySelector(".mb-zoom-dots").innerHTML = zoomShots.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("");
    els.zoom.querySelector(".mb-zoom-hint").textContent = ml("pinch");
    els.zoom.classList.remove("is-locked");
    els.zoom.setAttribute("aria-label", ml("zoom"));
    setZoomCount(i);
    els.zoom.classList.add("is-open");
    doc.documentElement.classList.add("mb-zoom-open");
    track.scrollTo({ left: i * track.clientWidth * (lang() === "ar" ? -1 : 1), top: 0, behavior: "auto" });
    if (!track._mb) {
      track._mb = 1;
      let raf = 0;
      track.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; const w = track.clientWidth || 1; setZoomCount(Math.round(Math.abs(track.scrollLeft) / w)); }); }, { passive: true });
    }
    setTimeout(() => { const x = els.zoom.querySelector(".mb-zoom-x"); x && x.focus({ preventScroll: true }); }, 50);
  }
  function setZoomCount(i) {
    i = Math.max(0, Math.min(zoomShots.length - 1, i));
    els.zoom.querySelector(".mb-zoom-count").textContent = `${i + 1} / ${zoomShots.length}`;
    Array.from(els.zoom.querySelectorAll(".mb-zoom-dots i")).forEach((d, k) => d.classList.toggle("on", k === i));
  }
  function toggleZoom(img) {
    const slide = img.closest(".mb-zoom-slide");
    const on = !slide.classList.contains("is-zoomed");
    slide.classList.toggle("is-zoomed", on);
    els.zoom.classList.toggle("is-locked", on);
    if (on) { slide.scrollTo({ left: (slide.scrollWidth - slide.clientWidth) / 2 * (lang() === "ar" ? -1 : 1), top: (slide.scrollHeight - slide.clientHeight) / 2, behavior: "auto" }); }
    else slide.scrollTo({ left: 0, top: 0, behavior: "auto" });
  }
  function closeZoom() {
    if (!els.zoom.classList.contains("is-open")) return;
    els.zoom.classList.remove("is-open", "is-locked");
    doc.documentElement.classList.remove("mb-zoom-open");
    els.zoom.querySelectorAll(".mb-zoom-slide.is-zoomed").forEach(s => s.classList.remove("is-zoomed"));
  }

  /* ================= size sheet ================= */
  function openSheet(o) {
    const p = product(o.id); if (!p) return;
    const color = (o.color && p.colors.includes(o.color)) ? o.color : (p.colors.find(c => colorStock(p, c)) || p.colors[0]);
    sheet = { id: p.id, color, size: p.sizeKey === "one" ? "ONE" : (o.size || null), src: o.src || "card", opener: o.opener || null };
    renderSheet();
    els.sheet.setAttribute("aria-label", `${ml("chooseSize")} — ${pname(p)}`);
    els.backdrop.classList.add("is-open");
    els.sheet.classList.add("is-open");
    doc.documentElement.classList.add("mb-sheet-open");
    setTimeout(() => { if (!sheet) return; const f = els.sheet.querySelector(".mb-pill.on") || els.sheet.querySelector(".mb-pill:not(.out)") || els.sheet.querySelector(".mb-sheet-foot .btn"); f && f.focus({ preventScroll: true }); }, 60);
  }
  function renderSheet() {
    if (!sheet) return;
    const p = product(sheet.id); const c = sheet.color; const s = sheet.size; const one = p.sizeKey === "one";
    const st = s ? stockOf(p, c, s) : null;
    const off = p.compare ? `<s>${money(p.compare)}</s>` : "";
    const stockLine = s === null ? "" : st > 0 ? `<span class="mb-stock ${st <= 3 ? "low" : "ok"}">${st <= 3 ? fmt(ts("onlyLeft"), { n: st }) : ts("inStock")}</span>` : `<span class="mb-stock out">${ts("soldOut")}</span>`;
    const swatches = p.colors.map(x => `<button type="button" class="mb-swatch ${x === c ? "on" : ""} ${colorStock(p, x) ? "" : "out"}" data-mb="sheet-color" data-value="${x}" style="background:${COLORS[x][0]}" aria-label="${esc(cname(x))}${colorStock(p, x) ? "" : " · " + ts("soldOut")}" aria-pressed="${x === c}"></button>`).join("");
    const pills = one ? "" : p.sizes.map(x => { const n = stockOf(p, c, x); return `<button type="button" class="mb-pill ${x === s ? "on" : ""} ${n ? "" : "out"}" data-mb="sheet-size" data-value="${x}" role="radio" aria-checked="${x === s}" ${n ? "" : 'aria-disabled="true"'}><span>${x}</span>${n && n <= 3 ? `<small>${fmt(ts("onlyLeft"), { n })}</small>` : ""}</button>`; }).join("");
    let cta;
    if (one ? !colorStock(p, c) : (s && st === 0)) cta = `<button type="button" class="btn ghost" data-action="notify" data-id="${p.id}" data-color="${c}" data-size="${s || "ONE"}"><span>${ts("notify")}</span>${ICON_BAG}</button>`;
    else if (!s) cta = `<button type="button" class="btn signal" disabled><span>${ts("selectSize")}</span><b>${money(p.price)}</b></button>`;
    else cta = `<button type="button" class="btn signal" data-mb="sheet-confirm"><span>${ts("addToCart")}${!one ? ` · ${s}` : ""}</span><b>${money(p.price)}</b></button>`;
    els.sheet.innerHTML = `
      <div class="mb-handle" data-mb="handle" aria-hidden="true"></div>
      <div class="mb-sheet-head">
        <div class="mb-thumb" aria-hidden="true">${fitArt(garment(p.garment, c, 0))}</div>
        <div class="mb-sheet-title"><div class="mb-sheet-cat">${ts("cats." + p.cat)} · ${ts("fits." + p.fit)}</div><div class="mb-sheet-name">${esc(pname(p))}</div><div class="mb-sheet-price">${money(p.price)}${off}</div></div>
        <button type="button" class="mb-sheet-x icon-btn" data-mb="sheet-close" aria-label="${ml("close")}">${ICON_X}</button>
      </div>
      <div class="mb-sheet-body">
        <div class="mb-label"><span>${ts("color")}: ${esc(cname(c))}</span>${one ? stockLine : ""}</div>
        <div class="mb-swatches">${swatches}</div>
        ${one ? `<div class="mb-label"><span>${ts("size")}: ${ml("oneSize")}</span></div>` : `<div class="mb-label"><span>${ts("size")}${s ? ": " + s : ""}</span>${stockLine}</div><div class="mb-pills" role="radiogroup" aria-label="${ts("size")}">${pills}</div><p class="mb-model">${fmt(ts("model"), { s: modelSize(p) })}</p>`}
      </div>
      <div class="mb-sheet-foot">${cta}</div>`;
  }
  function closeSheet(restoreFocus) {
    if (!sheet) return;
    const opener = sheet.opener;
    sheet = null;
    els.sheet.classList.remove("is-open", "is-dragging");
    els.sheet.style.removeProperty("--mb-drag");
    els.backdrop.classList.remove("is-open");
    doc.documentElement.classList.remove("mb-sheet-open");
    if (restoreFocus && opener && opener.isConnected) { try { opener.focus({ preventScroll: true }); } catch (e) {} }
  }
  function confirmSheet(btn) {
    if (!sheet) return;
    const { id, color, size, src } = sheet;
    const p = product(id);
    if (!p || !size || !stockOf(p, color, size)) return;
    vibrate();
    // fly source = the sheet thumbnail (rect read synchronously inside addToCart → flyToCart)
    addToCart(id, color, size, 1, btn);
    closeSheet(false);
    if (src === "pdp" && S.pdp) { S.pdp.color = color; S.pdp.size = size; rerenderKeepScroll(); }
  }

  /* keep the user's place on in-page PDP re-renders (the site scrolls to top on every render) */
  function rerenderKeepScroll() {
    const y = global.scrollY || doc.documentElement.scrollTop || 0;
    render();
    global.scrollTo({ top: y, behavior: "instant" });
  }

  /* ================= cards ================= */
  function enhanceCards(root) {
    const cards = root.querySelectorAll(".card:not([data-mb])");
    for (const card of cards) {
      card.dataset.mb = "1";
      const media = card.querySelector(".media"); if (!media) continue;
      const p = product(card.dataset.id); if (!p) continue;
      if (media.querySelector(".alt")) media.insertAdjacentHTML("beforeend", `<button type="button" class="mb-alt" data-mb="alt" aria-pressed="false" aria-label="${ml("view2")}">${ICON_SWAP}<span>${ml("view2")}</span></button>`);
      if (anyStock(p)) media.insertAdjacentHTML("beforeend", `<button type="button" class="mb-plus" data-mb="quick" data-id="${p.id}" aria-label="${ml("quickAdd")} — ${esc(pname(p))}">${ICON_PLUS}</button>`);
    }
  }

  /* ================= clicks (capture: runs before the site dispatcher) ================= */
  function setupClicks() {
    doc.addEventListener("click", e => {
      const el = e.target.closest ? e.target.closest("[data-mb],[data-action]") : null;
      if (!el) return;
      const mb = el.getAttribute("data-mb");
      if (mb) {
        if (mb === "handle") return;
        if (mb === "shot") { if (!isPhone()) return; e.preventDefault(); e.stopPropagation(); openZoom(+el.dataset.i || 0); return; }
        e.preventDefault(); e.stopPropagation();
        switch (mb) {
          case "quick": { const p = product(el.dataset.id); if (!p) return; openSheet({ id: p.id, src: "card", opener: el }); break; }
          case "alt": { const card = el.closest(".card"); const on = !card.classList.contains("is-alt"); card.classList.toggle("is-alt", on); el.setAttribute("aria-pressed", on); el.querySelector("span").textContent = ml(on ? "view1" : "view2"); break; }
          case "bar-add": {
            const p = barProduct || product(parseHash().id); if (!p) return;
            const one = p.sizeKey === "one";
            const c = (S.pdp && S.pdp.color) || p.colors[0];
            const s = one ? "ONE" : (S.pdp && S.pdp.size);
            if (s && stockOf(p, c, s)) { vibrate(); addToCart(p.id, c, s, 1, el); }
            else openSheet({ id: p.id, color: c, size: null, src: "pdp", opener: el });
            break;
          }
          case "sheet-close": closeSheet(true); break;
          case "sheet-size": { if (!sheet) return; sheet.size = el.dataset.value; renderSheet(); const n = els.sheet.querySelector(".mb-pill.on"); n && n.focus({ preventScroll: true }); break; }
          case "sheet-color": { if (!sheet) return; const p = product(sheet.id); sheet.color = el.dataset.value; if (sheet.size && sheet.size !== "ONE" && !stockOf(p, sheet.color, sheet.size)) { /* keep selection: shows notify state */ } renderSheet(); break; }
          case "sheet-confirm": confirmSheet(el); break;
          case "zoom-close": closeZoom(); break;
          case "zoom-toggle": toggleZoom(el); break;
        }
        return;
      }
      // site actions we wrap on phones
      const act = el.getAttribute("data-action");
      if (act === "notify" && sheet && els.sheet.contains(el)) { closeSheet(false); return; } // let the site open its modal
      if (!isPhone()) {
        if (isTouch() && (act === "quick-add" || act === "add-outfit" || (act === "add" && el.dataset.size))) vibrate();
        return;
      }
      if (act === "pdp-size" || act === "pdp-color") {
        e.preventDefault(); e.stopPropagation();
        if (act === "pdp-color") { S.pdp.color = el.dataset.value; S.pdp.size = null; }
        else S.pdp.size = el.dataset.value;
        rerenderKeepScroll();
        return;
      }
      if (act === "quick-add" || act === "add-outfit" || (act === "add" && el.dataset.size)) vibrate();
    }, true);

    // keyboard: Enter/Space on a gallery shot opens zoom; Escape closes our layers
    doc.addEventListener("keydown", e => {
      if (e.key === "Escape") { if (els.zoom.classList.contains("is-open")) { e.stopPropagation(); closeZoom(); } else if (sheet) { e.stopPropagation(); closeSheet(true); } return; }
      if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest('.shot[data-mb="shot"]') && isPhone()) { e.preventDefault(); openZoom(+e.target.closest(".shot").dataset.i || 0); }
    }, true);

    // governorate change on the PDP re-renders: keep the scroll position
    doc.addEventListener("change", e => {
      const el = e.target;
      if (!isPhone() || !el || el.dataset.action !== "gov" || parseHash().page !== "product") return;
      e.stopPropagation();
      S.gov = el.value; persist(); rerenderKeepScroll();
    }, true);
  }

  /* ================= press feedback (touch) ================= */
  const PRESS_SEL = ".card,.btn,.mb-pill,.mb-plus,.mb-alt,.mb-swatch,.chip,.dock a,.dock button,.sizes-grid button,.colors button,.wish,.icon-btn,.qty button";
  function setupPress() {
    let el = null, timer = 0, x0 = 0, y0 = 0;
    const clear = () => { clearTimeout(timer); timer = 0; if (el) { const e = el; el = null; setTimeout(() => e.classList.remove("mb-press"), 120); } };
    doc.addEventListener("touchstart", e => {
      if (!isTouch()) return;
      const t = e.target.closest ? e.target.closest(PRESS_SEL) : null;
      if (!t || t.disabled) return;
      clear();
      const p = e.touches[0]; x0 = p.clientX; y0 = p.clientY; el = t;
      timer = setTimeout(() => { if (el === t) t.classList.add("mb-press"); }, 40);
    }, { passive: true });
    doc.addEventListener("touchmove", e => {
      if (!el) return;
      const p = e.touches[0];
      if (Math.abs(p.clientX - x0) > 8 || Math.abs(p.clientY - y0) > 8) { clearTimeout(timer); el.classList.remove("mb-press"); el = null; }
    }, { passive: true });
    doc.addEventListener("touchend", clear, { passive: true });
    doc.addEventListener("touchcancel", clear, { passive: true });
  }

  /* ================= drag-to-close (sheet, cart drawer, modal box) ================= */
  function dragToClose(panel, o) {
    let y0 = 0, t0 = 0, dy = 0, armed = false, dragging = false, sc = null;
    panel.addEventListener("touchstart", e => {
      if (!o.isOpen() || !anyMobile()) { armed = false; return; }
      const p = e.touches[0]; y0 = p.clientY; t0 = performance.now(); dy = 0; dragging = false;
      sc = o.scrollerEl ? o.scrollerEl() : (o.scroller ? panel.querySelector(o.scroller) : null);
      const onHandle = !!(e.target.closest && e.target.closest(o.handle));
      armed = onHandle || !sc || !sc.contains(e.target) || sc.scrollTop <= 0;
    }, { passive: true });
    panel.addEventListener("touchmove", e => {
      if (!armed) return;
      dy = e.touches[0].clientY - y0;
      if (!dragging) {
        if (dy < 10) { if (dy < -6) armed = false; return; }   // scrolling up/inside: give up
        if (sc && sc.contains(e.target) && sc.scrollTop > 0) { armed = false; return; }
        dragging = true; panel.classList.add("is-dragging");
      }
      panel.style.setProperty("--mb-drag", Math.max(0, dy) + "px");
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    const end = () => {
      if (!dragging) { armed = false; return; }
      dragging = false; armed = false;
      const v = dy / Math.max(1, performance.now() - t0);
      panel.classList.remove("is-dragging");
      panel.style.removeProperty("--mb-drag");
      if (dy > 90 || v > 0.55) o.close();
    };
    panel.addEventListener("touchend", end, { passive: true });
    panel.addEventListener("touchcancel", end, { passive: true });
  }
  function setupDrag() {
    dragToClose(els.sheet, { handle: ".mb-handle,.mb-sheet-head", scroller: ".mb-sheet-body", isOpen: () => !!sheet, close: () => closeSheet(true) });
    const drawer = doc.getElementById("cartDrawer");
    if (drawer) {
      const head = drawer.querySelector(".head");
      if (head && !head.querySelector(".mb-handle")) head.insertAdjacentHTML("afterbegin", '<div class="mb-handle" aria-hidden="true"></div>');
      dragToClose(drawer, { handle: ".mb-handle,.head", scroller: ".body", isOpen: () => drawer.classList.contains("open"), close: () => closeAll() });
    }
    const modal = doc.getElementById("modal");
    const box = modal && modal.querySelector(".box");
    if (box) {
      if (!box.querySelector(".mb-handle")) box.insertAdjacentHTML("afterbegin", '<div class="mb-handle" aria-hidden="true"></div>');
      // the .box itself is the scroll container
      dragToClose(box, { handle: ".mb-handle,h3", scrollerEl: () => box, isOpen: () => modal.classList.contains("open"), close: () => closeAll() });
    }
  }

  /* ================= fly to the dock cart ================= */
  function dockCart() { const d = doc.querySelector(".dock [data-action='open-cart']"); return d && d.offsetWidth ? d : null; }
  function flyToDock(fromEl) {
    const target = dockCart() || doc.querySelector(".header [data-action='open-cart']");
    const src = fromEl && (
      (fromEl.closest(".mb-sheet") && els.sheet.querySelector(".mb-thumb svg")) ||
      (fromEl.closest(".card") && fromEl.closest(".card").querySelector(".media svg")) ||
      (fromEl.closest(".mb-bar") && currentShotSvg()) ||
      (fromEl.closest(".pdp") && currentShotSvg()) ||
      (fromEl.closest(".line") && fromEl.closest(".line").querySelector(".thumb svg")) ||
      (fromEl.closest(".hm-feat") && fromEl.closest(".hm-feat").querySelector("svg"))
    ) || currentShotSvg() || null;
    // re-query at the end: renderChrome() may have rebuilt the dock meanwhile
    const pulse = () => { const tg = dockCart() || doc.querySelector(".header [data-action='open-cart']"); if (global.Motion && Motion.pulse && tg) { Motion.pulse(tg, true); const b = tg.querySelector(".badge-count"); b && setTimeout(() => Motion.pulse(b), 40); const h = doc.getElementById("cartCount"); h && Motion.pulse(h); } };
    if (!target) return Promise.resolve();
    if (rmq.matches || !hasWAAPI || !src) { pulse(); return Promise.resolve(); }
    const r = src.getBoundingClientRect(), tr = target.getBoundingClientRect();
    if (!r.width || !tr.width) { pulse(); return Promise.resolve(); }
    const END = 30, s = END / Math.max(r.width, r.height);
    const ex = tr.left + tr.width / 2 - r.width * s / 2, ey = tr.top + tr.height / 2 - 6 - r.height * s / 2;
    const lift = Math.min(r.top, ey) - 60;
    const mid = s + (1 - s) * 0.4;
    const outer = doc.createElement("div");
    outer.className = "mb-fly";
    outer.style.cssText = "position:fixed;top:0;left:0;z-index:80;pointer-events:none;transform-origin:0 0;width:" + r.width + "px;height:" + r.height + "px;will-change:transform";
    const inner = doc.createElement("div");
    inner.className = "mo-fly";
    inner.style.cssText = "width:" + r.width + "px;height:" + r.height + "px;transform-origin:0 0;position:relative";
    inner.appendChild(src.cloneNode(true));
    outer.appendChild(inner); doc.body.appendChild(outer);
    const D = 650;
    const ax = outer.animate([{ transform: "translateX(" + r.left + "px)" }, { transform: "translateX(" + ex + "px)" }], { duration: D, easing: "cubic-bezier(.5,.05,.55,.95)", fill: "forwards" });
    const ay = inner.animate([
      { transform: "translateY(" + r.top + "px) scale(1)", opacity: 1, offset: 0, easing: "cubic-bezier(.2,.65,.35,1)" },
      { transform: "translateY(" + lift + "px) scale(" + mid.toFixed(4) + ")", opacity: 1, offset: 0.45, easing: "cubic-bezier(.6,0,.9,.5)" },
      { transform: "translateY(" + ey + "px) scale(" + s.toFixed(4) + ")", opacity: 0.9, offset: 1 }
    ], { duration: D, fill: "forwards" });
    return new Promise(resolve => {
      let done = false;
      const fin = () => { if (done) return; done = true; outer.remove(); pulse(); resolve(); };
      Promise.all([ax.finished, ay.finished]).then(fin, fin);
      setTimeout(fin, D + 150);
    });
  }
  function setupFly() {
    if (!global.Motion || !Motion.flyToCart || Motion.flyToCart._mb) return;
    const orig = Motion.flyToCart;
    const patched = function (fromEl) { return (isPhone() && dockCart()) ? flyToDock(fromEl) : orig.call(Motion, fromEl); };
    patched._mb = 1;
    Motion.flyToCart = patched;
  }

  /* ================= misc: route changes, viewport changes, search results ================= */
  function setupMisc() {
    global.addEventListener("hashchange", () => { closeSheet(false); closeZoom(); });
    const onMQ = () => MB.pageEnter(doc.getElementById("app"));
    try { mqLayout.addEventListener("change", onMQ); mqTouch.addEventListener("change", onMQ); } catch (e) {}
    if ("MutationObserver" in global) {
      const sr = doc.getElementById("searchResults");
      if (sr) new MutationObserver(() => { if (isTouch()) enhanceCards(sr); }).observe(sr, { childList: true });
      // fallback when the integrator did not add the pageEnter hook: enhance after any #app re-render
      const app = doc.getElementById("app");
      if (app) { let raf = 0; new MutationObserver(() => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; MB.pageEnter(app); }); }).observe(app, { childList: true }); }
      // the site's renderChrome() re-renders the dock on every render; nothing to do, the bar sits below it
    }
    // keep the cart drawer handle after the site re-renders its body (head is untouched, so this is a safety net)
  }

  // self-boot when the integrator only included the script (hooks are still recommended)
  const boot = () => { try { MB.init(); } catch (e) { /* site not ready */ } };
  if (doc.readyState === "loading") doc.addEventListener("DOMContentLoaded", boot); else setTimeout(boot, 0);

  global.MBCommerce = MB;
})(window);

</script>
<script>
/* ===== MOBILE HOME (agent) ===== */
/* ============================================================
   COREWARE — mobile-home.js  (agent: mobile/home)
   window.MBHome = { pageEnter(root, page), footer(), destroy() }
   Phone-only DOM helpers for what CSS cannot do:
     - trust strip: clones the items once so the 48px line loops seamlessly
     - snap strips: dots (fits, stores, reviews) / progress bar (best sellers)
       that track scroll position with transform only
     - the top-right "View all" link becomes a 44px pill at the end of the
       strip (or under the grid)
     - reviews: wraps the three review cards in a snap strip
     - footer: the link columns become <details> accordions, newsletter first,
       social links become a row (re-applied whenever renderChrome() rewrites it)
   Idempotent: every transform is guarded by a data-mb-* marker and undone
   when the viewport grows past 979px. No libraries. Only transform/opacity
   change at runtime.
   ============================================================ */
(function (global) {
  "use strict";
  if (global.MBHome) return;
  const doc = document;
  const mq = global.matchMedia ? matchMedia("(max-width:979px)") : { matches: false, addEventListener() {} };
  const isPhone = () => mq.matches;
  let liveRoot = null, livePage = "", scrollHandlers = [], footerObs = null;

  /* ---------- helpers ---------- */
  function rafScroll(el, fn) {
    let ticking = false;
    const h = () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; fn(); }); };
    el.addEventListener("scroll", h, { passive: true });
    scrollHandlers.push([el, h]);
    fn();
  }
  const rtl = el => getComputedStyle(el).direction === "rtl";
  const absLeft = el => Math.abs(el.scrollLeft);

  /* ---------- strips: dots / bar ---------- */
  function dots(strip, items) {
    if (strip.dataset.mbNav) return;
    strip.dataset.mbNav = "dots";
    const nav = doc.createElement("div");
    nav.className = "mb-nav"; nav.setAttribute("aria-hidden", "true");
    nav.innerHTML = items.map(() => "<i></i>").join("");
    strip.insertAdjacentElement("afterend", nav);
    const ds = [...nav.children];
    let cur = -1;
    rafScroll(strip, () => {
      const first = items[0]; if (!first) return;
      const step = first.getBoundingClientRect().width + (parseFloat(getComputedStyle(strip).columnGap) || 12);
      const max = strip.scrollWidth - strip.clientWidth;
      let i = Math.round(absLeft(strip) / step);
      if (absLeft(strip) >= max - 2) i = items.length - 1;
      i = Math.max(0, Math.min(items.length - 1, i));
      if (i === cur) return; cur = i;
      ds.forEach((d, k) => d.classList.toggle("on", k === i));
    });
  }
  function bar(strip) {
    if (strip.dataset.mbNav) return;
    strip.dataset.mbNav = "bar";
    const nav = doc.createElement("div");
    nav.className = "mb-nav mb-bar"; nav.setAttribute("aria-hidden", "true");
    nav.innerHTML = "<b></b><s></s>";

      thumb.style.transform = `translateX(${rtl(strip) ? -pos : pos}%) scaleX(${frac})`;
    });
  }

  /* ---------- the "View all" link -> pill at the end of the strip / under the grid ---------- */
  function movePill(section, strip, { asItem }) {
    if (!section || section.querySelector(".mb-end, .mb-more")) return;
    const link = section.querySelector(".hm-head .hm-link, .hm-head-tools .hm-link");
    if (!link) return;
    const a = link.cloneNode(true);
    a.className = "mb-pill" + (asItem ? "" : " mb-more");
    a.removeAttribute("id");
    if (asItem) {
      const li = doc.createElement(strip.tagName === "UL" || strip.tagName === "OL" ? "li" : "div");
      li.className = "mb-end"; li.appendChild(a);
      strip.appendChild(li);
    } else {
      strip.insertAdjacentElement("afterend", a);
    }
  }

  /* ---------- trust marquee ---------- */
  function trust(root) {
    const el = root.querySelector(".hm-trust");
    if (!el || el.dataset.mbMarquee) return;

    items.forEach(li => { const c = li.cloneNode(true); c.setAttribute("aria-hidden", "true"); c.removeAttribute("role"); c.dataset.mbClone = "1"; ul.appendChild(c); });

    requestAnimationFrame(() => { const w = ul.scrollWidth / 2; el.style.setProperty("--mb-marquee-dur", Math.max(14, Math.round(w / 45)) + "s"); });
  }

  /* ---------- reviews: wrap the review cards in a snap strip ---------- */
  function reviews(root) {
    const box = root.querySelector(".hm-reviews");
    if (!box || box.querySelector(".mb-rev-strip")) return;
    const cards = [...box.querySelectorAll(":scope > .review")];
    if (!cards.length) return;
    const ul = doc.createElement("ul"); ul.className = "mb-rev-strip"; ul.setAttribute("role", "list");
    cards.forEach(c => { const li = doc.createElement("li"); li.appendChild(c); ul.appendChild(li); });
    box.appendChild(ul);
    return ul;
  }
  function unwrapReviews(root) {
    const ul = root.querySelector(".hm-reviews > .mb-rev-strip"); if (!ul) return;
    const box = ul.parentElement;
    [...ul.querySelectorAll(":scope > li > .review")].forEach(c => box.appendChild(c));
    ul.remove();
  }

  function footer() {
    const grid = doc.getElementById("footerGrid"), bottom = doc.getElementById("footerBottom");
    if (!grid) return;

    if (!grid.querySelector(".mb-fdet")) {

      const [brand, shop, help, company] = cols;
      // newsletter block out of the company column
      const newsH = company.querySelector("h4:last-of-type"), form = company.querySelector("form.news");
      const news = doc.createElement("div"); news.className = "mb-fnews";
      if (newsH) news.appendChild(newsH);
      if (form) news.appendChild(form);
      const det = (col) => {
        const d = doc.createElement("details"); d.className = "mb-fdet";
        const s = doc.createElement("summary");
        const h = col.querySelector("h4"); if (h) s.appendChild(h); else s.textContent = col.textContent.trim().slice(0, 24);
        const body = doc.createElement("div");
        [...col.children].forEach(ch => body.appendChild(ch));
        d.appendChild(s); d.appendChild(body); return d;

      const frag = doc.createDocumentFragment();
      frag.appendChild(news);
      frag.appendChild(det(shop)); frag.appendChild(det(help)); frag.appendChild(det(company));
      brand.className = "mb-fbrand"; frag.appendChild(brand);
      grid.dataset.mb = "1";
      grid.innerHTML = ""; grid.appendChild(frag);
    }
    if (bottom && !bottom.querySelector(".mb-social")) {
      const social = bottom.querySelector("span:last-child");
      if (social && social.querySelector("a")) {
        const nav = doc.createElement("nav"); nav.className = "mb-social"; nav.setAttribute("aria-label", "Social");
        bottom.__mbOrig = social.outerHTML;           // capture BEFORE the anchors move
        [...social.querySelectorAll("a")].forEach(a => nav.appendChild(a));
        social.replaceWith(nav);
      }
      bottom.dataset.mb = "1";
    }
  }
  function restoreFooter() {
    const grid = doc.getElementById("footerGrid"), bottom = doc.getElementById("footerBottom");
    // only undo our own transform; a fresh render (no .mb-fdet) is left alone so a stale copy never overwrites it
    if (grid && grid.querySelector(".mb-fdet") && grid.__mbOrig != null) { delete grid.dataset.mb; grid.innerHTML = grid.__mbOrig; }
    if (bottom) { delete bottom.dataset.mb; const n = bottom.querySelector(".mb-social"); if (n && bottom.__mbOrig) n.outerHTML = bottom.__mbOrig; }
  }
  function watchFooter() {
    if (footerObs || !("MutationObserver" in global)) return;
    const f = doc.querySelector("footer"); if (!f) return;
    // renderChrome() rewrites #footerGrid / #footerBottom innerHTML on every render and cart change

      for (const m of muts) {
        const t = m.target;
        if ((t.id === "footerGrid" && !t.querySelector(".mb-fdet")) || (t.id === "footerBottom" && !t.querySelector(".mb-social"))) { footer(); return; }
      }

    footerObs.observe(f, { childList: true, subtree: true });
  }

  /* ---------- page ---------- */
  function teardown() {
    scrollHandlers.forEach(([el, h]) => el.removeEventListener("scroll", h));
    scrollHandlers = [];
  }

    trust(root);

    const fits = root.querySelector(".hm-fits");
    if (fits) { movePill(fits.closest("section"), fits, { asItem: true }); dots(fits, [...fits.querySelectorAll(":scope > .hm-fit")]); }
    // new in: pill under the grid
    const grid = root.querySelector(".hm-grid");
    if (grid) movePill(grid.closest("section"), grid, { asItem: false });
    // lookbook: pill under the mosaic
    const look = root.querySelector(".hm-look");
    if (look) movePill(look.closest("section"), look, { asItem: false });
    // best sellers: pill in the track + progress bar
    const track = root.querySelector(".hm-track");
    if (track) { movePill(track.closest("section"), track, { asItem: true }); bar(track); }
    // outfit pieces: nothing to add (4 pieces + pinned summary)
    // reviews: strip + dots
    const rev = reviews(root) || root.querySelector(".mb-rev-strip");
    if (rev) dots(rev, [...rev.children]);
    // stores: pill in the strip + dots
    const stores = root.querySelector(".hm-stores");

  function undoHome(root) {
    unwrapReviews(root);
    root.querySelectorAll(".mb-nav, .mb-end, .mb-more").forEach(n => n.remove());
    root.querySelectorAll("[data-mb-nav]").forEach(n => delete n.dataset.mbNav);
    const tr = root.querySelector(".hm-trust[data-mb-marquee]");
    if (tr) { tr.querySelectorAll("[data-mb-clone]").forEach(n => n.remove()); delete tr.dataset.mbMarquee; }
  }

  const MBHome = {
    version: "1.0",
    pageEnter(root, page) {

      if (!root) return;
      teardown();

  if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);

  global.MBHome = MBHome;
})(window);

function isDark(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000<128}

const _GM={
  hx(h){h=h.slice(1);if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]},
  mix(a,b,t){const A=_GM.hx(a),B=_GM.hx(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")},
  blue(h){const [r,g,b]=_GM.hx(h);return b>r+18&&b>=g}
};

/* Inner art only (defs + drawing, no <svg> wrapper and no background):
   use this in heroArt()/composites instead of regex-stripping garment(). */
function garmentArt(type,color,variant=0){
  return garment(type,color,variant,"transparent").replace(/^<svg[^>]*>|<\/svg>$/g,"");
}



/* ============================================================
   COMPONENTS
   ============================================================ */
const fitArt=(svg)=>svg.replace('preserveAspectRatio="xMidYMid slice"','preserveAspectRatio="xMidYMid meet"');
function stars(r,n){const full=Math.round(r);return `<div class="stars" aria-label="${r} out of 5">${"★".repeat(full)}${"☆".repeat(5-full)}<small>${r.toFixed(1)} (${n})</small></div>`}
function priceHTML(p,big){const off=p.compare?Math.round(100-(p.price/p.compare)*100):0;return `<div class="price${big?' big':''}">${money(p.price)}${p.compare?`<s>${money(p.compare)}</s><span class="off">−${off}%</span>`:""}</div>`}
function badges(p){const b=[];if(!anyStock(p))b.push(`<span class="pill out">${t("soldOut")}</span>`);else{if(p.compare)b.push(`<span class="pill sale">${t("sale")}</span>`);if(p.tags.includes("new"))b.push(`<span class="pill new">${t("new")}</span>`);if(lowAny(p))b.push(`<span class="pill low">${t("lowStock")}</span>`)}return b.join("")}
function card(p){
  const c0=p.colors.find(c=>colorStock(p,c))||p.colors[0];
  const wished=S.wish.includes(p.id);
  const alt=`${pname(p)} — ${cname(c0)}`;
  return `<article class="card" data-id="${p.id}">
    <div class="media"><a href="#/product/${p.id}" aria-label="${esc(alt)}">${fitArt(garment(p.garment,c0,0))}<span class="alt">${fitArt(garment(p.garment,c0,1,"#ECE9E2"))}</span></a>
      <div class="badges">${badges(p)}</div>
      <button class="wish ${wished?"on":""}" data-action="wish" data-id="${p.id}" aria-label="${t("wishlist")}" aria-pressed="${wished}"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg></button>
      ${anyStock(p)?`<div class="quick"><div class="sizes">${p.sizes.map(s=>{const st=stockOf(p,c0,s);return `<button data-action="quick-add" data-id="${p.id}" data-color="${c0}" data-size="${s}" class="${st?"":"out"}" ${st?"":"disabled"} aria-label="${s}">${s}</button>`}).join("")}</div></div>`:""}
    </div>
    <div class="info">
      <a class="name" href="#/product/${p.id}">${esc(pname(p))}</a>

function initHero(root) {
  var el = !root ? document.querySelector(".hx-hero")
    : (root.matches && root.matches(".hx-hero")) ? root : root.querySelector(".hx-hero");
  if (!el) return null;
  if (typeof el.__hxDestroy === "function") el.__hxDestroy();
  /* heroes from a previous SPA render (now detached) must drop their window listeners */
  initHero._live = initHero._live || new Set();
  initHero._live.forEach(function (h) { if (!h.isConnected && typeof h.__hxDestroy === "function") h.__hxDestroy(); });
  initHero._live.add(el);

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine = window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches;
  var stage = el.querySelector(".hx-stage");
  var ringIn = el.querySelector(".hx-ring-in");
  var slots = Array.prototype.slice.call(el.querySelectorAll(".hx-slot"));

  el.classList.add("is-reset");            // transitions off while we snap back to the start state
  el.classList.remove("is-in", "is-done");
  void el.offsetWidth;                     // flush the reset
  el.classList.remove("is-reset");
  rafStart = requestAnimationFrame(function () {
    rafStart = requestAnimationFrame(function () {
      el.classList.add("is-in");
      timers.push(setTimeout(function () { el.classList.add("is-done"); }, reduce ? 260 : 1600));
    });
  });

  /* --- pointer tilt (fine pointers only, max ±6deg, lerped) --- */
  if (fine && !reduce && stage) {
    var tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
    var tick = function () {
      cx += (tx - cx) * 0.085; cy += (ty - cy) * 0.085;
      stage.style.transform = "rotateX(" + cy.toFixed(3) + "deg) rotateY(" + cx.toFixed(3) + "deg)";
      if (ringIn) ringIn.style.transform = "translate3d(" + (-cx * 2.4).toFixed(2) + "px," + (cy * 2.4).toFixed(2) + "px,0)";
      if (Math.abs(tx - cx) > 0.015 || Math.abs(ty - cy) > 0.015) raf = requestAnimationFrame(tick); else raf = 0;
    };
    var kick = function () { if (!raf) raf = requestAnimationFrame(tick); };
    on(el, "pointermove", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") return;
      var r = el.getBoundingClientRect();
      var nx = (e.clientX - r.left) / r.width - 0.5, ny = (e.clientY - r.top) / r.height - 0.5;
      tx = Math.max(-6, Math.min(6, nx * 12)); ty = Math.max(-6, Math.min(6, -ny * 12));
      kick();
    }, { passive: true });
    on(el, "pointerleave", function () { tx = 0; ty = 0; kick(); });
    offs.push(function () { if (raf) cancelAnimationFrame(raf); stage.style.transform = ""; if (ringIn) ringIn.style.transform = ""; });
  }

  /* --- scroll parallax on the card slots (transform only, rAF-throttled) --- */
  if (!reduce && slots.length) {
    var depth = [0.07, 0.12, 0.18], praf = 0;
    var update = function () {
      praf = 0;
      var r = el.getBoundingClientRect();
      var y = Math.max(0, -r.top);
      if (y > r.height) return;
      for (var i = 0; i < slots.length; i++) slots[i].style.transform = "translate3d(0," + (-y * (depth[i] || 0.1)).toFixed(1) + "px,0)";
    };
    on(window, "scroll", function () { if (!praf) praf = requestAnimationFrame(update); }, { passive: true });
    offs.push(function () { if (praf) cancelAnimationFrame(praf); slots.forEach(function (s) { s.style.transform = ""; }); });
  }

    offs.forEach(function (f) { f(); });
    timers.forEach(clearTimeout);
    if (rafStart) cancelAnimationFrame(rafStart);

  };
  return el.__hxDestroy;
}

/* home-namespace translator: dot paths, falls back to EN, then the key */
function ht(k){
  const get=(d)=>k.split(".").reduce((o,p)=>o&&o[p],d);
  const lang=(typeof S!=="undefined"&&S.lang)||"en";
  return get(HOME_I18N[lang]) ?? get(HOME_I18N.en) ?? k;
}

/* ---------- small helpers ---------- */
const HM={
  // Fixed drop date: 14 days from the first visit, persisted so it does not reset on reload.
  dropAt(){
    if(HM._at)return HM._at;
    let v=0; try{v=+(localStorage.getItem("cw:hm:dropAt")||0)}catch(e){}
    if(!v||v<Date.now()){v=Date.now()+14*864e5; try{localStorage.setItem("cw:hm:dropAt",String(v))}catch(e){}}
    return HM._at=v;
  },
  // garment() art without its own background rect/gradient, so it sits on our surfaces.
  art(type,color,variant=0){
    return garment(type,color,variant,"transparent").replace(/preserveAspectRatio="[^"]*"/,'preserveAspectRatio="xMidYMid meet"');
  },
  // first in-stock color (preferring `pref`) and first in-stock size
  variant(p,pref){
    const colors=pref&&colorStock(p,pref)?[pref,...p.colors]:p.colors;
    const color=colors.find(c=>colorStock(p,c))||p.colors[0];
    const prefSizes=["M","32","43","L","30","42","S","34","44"];
    const size=prefSizes.find(s=>p.sizes.includes(s)&&stockOf(p,color,s)>0)||p.sizes.find(s=>stockOf(p,color,s)>0)||p.sizes[0];
    return {color,size};
  },
  by(id){return PRODUCTS.find(p=>p.id===id)},
  fmt(s,o){return s.replace(/\{(\w+)\}/g,(_,k)=>o[k])},
  pad(n){return String(Math.max(0,n)).padStart(2,"0")},
  pieces(n){return `${n} ${n===1?ht("piece1"):(n===2&&S.lang==="ar")?ht("piece2"):ht("pieces")}`},
  idx(n,key){return `<span class="hm-idx">${HM.pad(n)} <span class="hm-idx-sep" aria-hidden="true">/</span> ${ht("idx."+key)}</span>`},
  head(n,key,id,title,sub,link,linkText){
    return `<header class="hm-head">${HM.idx(n,key)}<h2 class="hm-display" id="${id}">${title}</h2>${sub?`<p class="hm-sub">${sub}</p>`:""}${link?`<a class="hm-link" href="${link}">${linkText||ht("viewAll")}<span aria-hidden="true">→</span></a>`:""}</header>`;

  grid(list){return `<div class="grid hm-grid">${list.map(p=>card(p).replace('<article class="card"','<article class="card" data-mo="item"')).join("")}</div>`},
  arrow(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`}
};

/* ---------- widgets: countdown + carousel. Idempotent; clears its own timer.
   Call initHomeWidgets(appEl) after rendering home, initHomeWidgets(null) on other pages. ---------- */
function initHomeWidgets(root){
  if(initHomeWidgets._timer){clearInterval(initHomeWidgets._timer);initHomeWidgets._timer=null}
  if(!root)return;
  const cd=root.querySelector("[data-hm-countdown]");
  if(cd){
    const at=+cd.dataset.hmCountdown;
    const el={d:cd.querySelector("[data-hm-d]"),h:cd.querySelector("[data-hm-h]"),m:cd.querySelector("[data-hm-m]"),s:cd.querySelector("[data-hm-s]")};
    const tick=()=>{
      if(!document.contains(cd)){clearInterval(initHomeWidgets._timer);initHomeWidgets._timer=null;return}
      let ms=Math.max(0,at-Date.now());
      const d=Math.floor(ms/864e5); ms-=d*864e5; const h=Math.floor(ms/36e5); ms-=h*36e5; const m=Math.floor(ms/6e4); const s=Math.floor((ms-m*6e4)/1e3);
      el.d.textContent=HM.pad(d); el.h.textContent=HM.pad(h); el.m.textContent=HM.pad(m); el.s.textContent=HM.pad(s);
    };
    tick(); initHomeWidgets._timer=setInterval(tick,1000);
  }
  root.querySelectorAll("[data-hm-carousel]").forEach(c=>{
    if(c.dataset.hmBound)return; c.dataset.hmBound="1";
    const track=c.querySelector(".hm-track"); if(!track)return;
    const rtl=()=>getComputedStyle(track).direction==="rtl";
    const step=()=>{const s=track.querySelector(".hm-slide");return s?s.getBoundingClientRect().width+(parseFloat(getComputedStyle(track).columnGap)||14):320};
    const go=dir=>track.scrollBy({left:dir*step()*(rtl()?-1:1),behavior:"smooth"});
    const prev=c.querySelectorAll('[data-hm="prev"]'), next=c.querySelectorAll('[data-hm="next"]');
    prev.forEach(b=>b.addEventListener("click",()=>go(-1)));
    next.forEach(b=>b.addEventListener("click",()=>go(1)));
    const edges=()=>{const max=track.scrollWidth-track.clientWidth-1; const x=Math.abs(track.scrollLeft); prev.forEach(b=>b.classList.toggle("is-end",x<=1)); next.forEach(b=>b.classList.toggle("is-end",x>=max))};
    track.addEventListener("scroll",edges,{passive:true}); edges();
    track.addEventListener("keydown",e=>{
      if(e.key==="ArrowRight"){e.preventDefault();go(rtl()?-1:1)}
      else if(e.key==="ArrowLeft"){e.preventDefault();go(rtl()?1:-1)}
      else if(e.key==="Home"){e.preventDefault();track.scrollTo({left:0,behavior:"smooth"})}
      else if(e.key==="End"){e.preventDefault();track.scrollTo({left:(rtl()?-1:1)*track.scrollWidth,behavior:"smooth"})}
    });
  });
}

PAGES.cart = ()=>`<div class="wrap section tight"><h1 style="font-size:36px;margin-bottom:18px">${t("cart")}</h1>${S.cart.length?`<div class="checkout"><div id="cartPageBody">${cartLines()}</div><div class="summary">${cartSummary()}<a class="btn signal block" href="#/checkout" style="margin-top:14px">${t("checkout")}</a></div></div>`:`<div class="empty">${t("cartEmpty")}<br><br><a class="btn" href="#/shop">${t("continueShop")}</a></div>`}</div>`;

function cartLines(){return S.cart.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.id);return `<div class="line"><a class="thumb" href="#/product/${l.id}">${fitArt(garment(p.garment,l.color,0))}</a><div><a href="#/product/${l.id}" style="font-weight:600">${pname(p)}</a><div class="meta">${cname(l.color)} · ${t("size")} ${l.size}</div><div class="qty" aria-label="${t("qty")}"><button data-action="qty" data-i="${i}" data-d="-1" aria-label="−">−</button><span>${l.qty}</span><button data-action="qty" data-i="${i}" data-d="1" aria-label="+" ${l.qty>=stockOf(p,l.color,l.size)?"disabled":""}>+</button></div></div><div style="text-align:end"><div style="font-weight:600">${money(l.price*l.qty)}</div><button data-action="remove" data-i="${i}" style="font-size:13px;color:var(--mute);text-decoration:underline;margin-top:8px">${t("remove")}</button></div></div>`}).join("")}
function cartSummary(withShip=true){const sub=cartTotal(),d=discount(sub),fee=shipFee(sub-d),cod=S.checkout.pay==="cod"?COD_FEE:0;const left=FREE_SHIP-(sub-d);
  return `<div class="tot"><span>${t("subtotal")}</span><span>${money(sub)}</span></div>${d?`<div class="tot" style="color:var(--ok)"><span>${t("discount")} (CORE10)</span><span>−${money(d)}</span></div>`:""}${withShip?`<div class="tot"><span>${t("shippingLbl")} · ${S.lang==="ar"?gov()[2]:gov()[1]}</span><span>${fee?money(fee):"0"}</span></div>`:""}${withShip&&cod?`<div class="tot"><span>${t("codLbl")}</span><span>${money(cod)}</span></div>`:""}
  <div class="progress"><i style="width:${Math.min(100,(sub-d)/FREE_SHIP*100)}%"></i></div><div style="font-size:13px;color:${left<=0?"var(--ok)":"var(--mute)"};margin-bottom:6px">${left<=0?"✓ "+t("freeUnlocked"):fmt(t("addMore"),{n:left.toLocaleString()})}</div>
  <form class="news" data-form="promo" style="margin:10px 0"><input placeholder="${t("promo")} (CORE10)" aria-label="${t("promo")}" value="${S.promo||""}"><button class="btn ghost sm">${t("apply")}</button></form>
  <div class="tot big"><span>${t("total")}</span><span>${money(sub-d+(withShip?fee+cod:0))}</span></div>`}

PAGES.checkout = ()=>{
  if(!S.cart.length)return PAGES.cart();
  const C=S.checkout, d=C.data; const step=C.step;
  const stepsHTML=`<div class="steps">${t("steps").map((x,i)=>`<span class="${i===step?"on":i<step?"done":""}">${i<step?"✓ ":""}${x}</span>`).join("")}</div>`;
  let body="";
  if(step===0)body=`<h2>${t("steps")[0]}</h2><form data-form="co-contact" novalidate style="margin-top:14px"><div class="field"><label>${t("fName")}</label><input name="name" required value="${esc(d.name||S.user?.name||"")}" autocomplete="name"><span class="err">${t("required")}</span></div><div class="field"><label>${t("fPhone")}</label><input name="phone" required inputmode="tel" pattern="^01[0-9]{9}$" value="${esc(d.phone||S.user?.phone||"")}" autocomplete="tel"><span class="err">${t("phoneErr")}</span></div><div class="field"><label>${t("fEmail")}</label><input name="email" type="email" value="${esc(d.email||"")}" autocomplete="email"></div><button class="btn block">${t("next")}</button></form>`;
  if(step===1)body=`<h2>${t("steps")[1]}</h2><form data-form="co-delivery" novalidate style="margin-top:14px"><div class="two"><div class="field"><label>${t("fGov")}</label><select name="gov">${GOV.map(x=>`<option value="${x[0]}" ${x[0]===S.gov?"selected":""}>${S.lang==="ar"?x[2]:x[1]} · ${x[3]} EGP · ${S.lang==="ar"?x[5]:x[4]}</option>`).join("")}</select></div><div class="field"><label>${t("fCity")}</label><input name="city" required value="${esc(d.city||"")}"><span class="err">${t("required")}</span></div></div><div class="field"><label>${t("fAddr")}</label><input name="addr" required value="${esc(d.addr||"")}" autocomplete="street-address"><span class="err">${t("required")}</span></div><div class="field"><label>${t("fNotes")}</label><input name="notes" value="${esc(d.notes||"")}"></div><div style="display:flex;gap:8px"><button type="button" class="btn ghost" data-action="co-back">${t("back")}</button><button class="btn" style="flex:1">${t("next")}</button></div></form>`;
  if(step===2)body=`<h2>${t("steps")[2]}</h2><div style="margin-top:14px">${Object.entries(t("payOpts")).map(([k,v])=>`<label class="radio ${C.pay===k?"on":""}"><input type="radio" name="pay" value="${k}" ${C.pay===k?"checked":""} data-action="co-pay"><div><div style="font-weight:600">${v}</div><div class="d">${t("payDesc."+k)}</div></div><span class="f">${k==="cod"?"+ EGP 25":"—"}</span></label>`).join("")}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" data-action="co-back">${t("back")}</button><button class="btn" style="flex:1" data-action="co-next">${t("next")}</button></div>`;
  if(step===3)body=`<h2>${t("steps")[3]}</h2><div class="note" style="margin:14px 0"><b>${esc(d.name)}</b> · ${esc(d.phone)}<br>${esc(d.addr)}, ${esc(d.city)}, ${S.lang==="ar"?gov()[2]:gov()[1]}<br>${t("payOpts."+C.pay)} · ${fmt(t("eta"),{d:S.lang==="ar"?gov()[5]:gov()[4]})}</div>${cartLines()}<div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" data-action="co-back">${t("back")}</button><button class="btn signal" style="flex:1" data-action="place-order">${t("placeOrder")}</button></div>`;
  return `<div class="wrap section tight"><h1 style="font-size:32px;margin-bottom:14px">${t("checkout")}</h1>${stepsHTML}<div class="checkout"><div>${body}</div><div class="summary">${cartSummary(true)}</div></div></div>`;
};

PAGES.policies = (params)=>{const tab=params.tab||"shipping";const texts={
  shipping:{en:["Orders are confirmed by phone or WhatsApp within 2 hours (10 AM to 10 PM). Delivery is 1–2 working days in Cairo and Giza, 2–4 days in the Delta and Canal governorates, 3–6 days in Upper Egypt, the Red Sea and Sinai.","Shipping is EGP 60 to 110 depending on governorate and free over EGP 1,800. Cash on delivery adds EGP 25. If you refuse a COD order at the door without a defect, the shipping fee is charged on your next order."],ar:["يتم تأكيد الطلب هاتفياً أو عبر واتساب خلال ساعتين (10 ص – 10 م). التوصيل خلال 1–2 يوم عمل في القاهرة والجيزة، 2–4 أيام في الدلتا والقناة، 3–6 أيام في الصعيد والبحر الأحمر وسيناء.","الشحن من 60 إلى 110 جنيه حسب المحافظة ومجاني فوق 1,800 جنيه. الدفع عند الاستلام يضيف 25 جنيه. في حالة رفض طلب الدفع عند الاستلام بدون عيب، تُحتسب رسوم الشحن على الطلب التالي."]},
  returns:{en:["Return or exchange within 14 days of delivery. Items must be unworn, unwashed, with tags and original packaging; shoes in their box.","Exchange is free in any store. For a home pickup, the courier fee is EGP 60 unless the item is defective or wrong, in which case pickup is free and we refund the original shipping.","Refunds are issued within 5 working days to the original payment method. COD orders are refunded to Vodafone Cash or InstaPay. Socks and underwear cannot be returned."],ar:["الإرجاع أو الاستبدال خلال 14 يوم من الاستلام. يجب أن تكون القطعة غير مستعملة وغير مغسولة ومعها التيكت والتغليف الأصلي؛ الأحذية في علبتها.","الاستبدال مجاني في أي فرع. للاستلام من المنزل، رسوم المندوب 60 جنيه إلا إذا كانت القطعة معيبة أو خاطئة فيكون الاستلام مجانياً ونرد الشحن الأصلي.","يُرد المبلغ خلال 5 أيام عمل بنفس طريقة الدفع. طلبات الدفع عند الاستلام تُرد على فودافون كاش أو إنستاباي. الشرابات والملابس الداخلية لا تُرجع."]},
  privacy:{en:["We store your name, phone, address and order history to deliver and support your orders. We never sell your data. Marketing messages are opt-in and you can unsubscribe from any message.","Payments are processed by Paymob and Fawry; we do not store card numbers."],ar:["نحتفظ باسمك ورقمك وعنوانك وسجل طلباتك لتوصيل الطلبات ودعمها. لا نبيع بياناتك أبداً. الرسائل التسويقية اختيارية ويمكنك إلغاء الاشتراك من أي رسالة.","تتم معالجة المدفوعات عبر Paymob وفوري؛ لا نحتفظ بأرقام البطاقات."]},
  terms:{en:["Prices are in Egyptian pounds and include VAT. Promotions cannot be combined. We may cancel orders we cannot confirm by phone within 48 hours.","Coreware is a registered trademark. Product colours may vary slightly from screen to garment."],ar:["الأسعار بالجنيه المصري وتشمل ضريبة القيمة المضافة. لا يمكن الجمع بين العروض. قد نلغي الطلبات التي لا نستطيع تأكيدها هاتفياً خلال 48 ساعة.","كورويير علامة تجارية مسجّلة. قد تختلف ألوان المنتجات قليلاً بين الشاشة والقطعة."]}};

function parseHash(){const h=location.hash||"#/";const [path,qs]=h.slice(1).split("?");const params={};if(qs)qs.split("&").forEach(kv=>{const [k,v]=kv.split("=");params[decodeURIComponent(k)]=decodeURIComponent(v||"")});const parts=path.split("/").filter(Boolean);return {page:parts[0]||"home",id:parts[1],params}}
let lastPage="";
function render(){
  const {page,id,params}=parseHash();
  if(page==="shop"&&lastPage!=="shop"&&!Object.keys(params).length)S.filters={cat:[],fit:[],size:[],price:null,stock:false,sale:false,sort:"featured",q:""};
  if(page==="shop"&&Object.keys(params).length)S.filters={cat:[],fit:[],size:[],price:null,stock:false,sale:false,sort:"featured",q:""};
  if(page==="product"&&lastPage!=="product"){S.pdp={color:null,size:null}}
  if(page==="product"&&id&&PRODUCTS.find(p=>p.id===id)){S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,8);store.set("recent",S.recent)}
  const fn=PAGES[page]||PAGES.notfound;
  const app=document.getElementById("app");
  app.innerHTML=fn(params,id);
  Motion.pageEnter(app);
  if(window.MBCommerce)MBCommerce.pageEnter(app,page);
  if(page==="home")initHero(app);
  if(page==="home"&&window.MBHero)MBHero.init(app);
  initHomeWidgets(page==="home"?app:null);
  renderChrome();
  if(window.MBHome)MBHome.pageEnter(app,page);
  if(lastPage!==page||page!=="shop")window.scrollTo({top:0,behavior:"instant"});
  const titles={home:"",shop:t("shop"),product:id&&PRODUCTS.find(p=>p.id===id)?pname(PRODUCTS.find(p=>p.id===id)):"",cart:t("cart"),checkout:t("checkout"),stores:t("storesPage"),faq:t("faqTitle"),contact:t("contactTitle"),about:t("aboutTitle"),track:t("trackTitle"),wishlist:t("wishlist"),account:t("account"),admin:t("adminTitle"),"size-guide":t("sizeTitle"),policies:t("policyTitle"),drops:t("dropTitle")};
  document.title=(titles[page]?titles[page]+" — ":"")+"Coreware";
  lastPage=page;
}

    case "close-filters": document.getElementById("filters").classList.remove("open"); document.body.style.overflow=""; break;

    case "pdp-size": if(a.getAttribute("aria-disabled")==="true"){S.pdp.size=d.value;render();return} S.pdp.size=d.value; render(); break;
    case "notify": {S.notify.push({id:d.id,color:d.color,size:d.size,at:Date.now()}); persist(); openModal(`<h3>${t("notify")}</h3><p style="color:var(--mute)">${PRODUCTS.find(p=>p.id===d.id)&&pname(PRODUCTS.find(p=>p.id===d.id))} · ${cname(d.color)} · ${d.size}</p><form data-form="notify"><div class="field"><label>${t("fPhone")}</label><input name="phone" required inputmode="tel" value="${S.user?.phone||""}"></div><button class="btn block">${t("notify")}</button></form>`); break;}
    case "open-size-guide": {const ch=SIZE_CHARTS[d.kind]; openModal(`<h3>${t("sizeTitle")}</h3><p style="color:var(--mute);font-size:14px">${t("sizeSub")}</p><table class="table"><tr>${(S.lang==="ar"?ch.colsAr:ch.cols).map(h=>`<th>${h}</th>`).join("")}</tr>${ch.rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table><p style="font-size:14px;margin-top:12px"><b>${t("howTo")}:</b> ${t("howToText")}</p>`); break;}
    case "qty": {const l=S.cart[+d.i]; const p=PRODUCTS.find(x=>x.id===l.id); l.qty=Math.max(0,Math.min(stockOf(p,l.color,l.size),l.qty+ +d.d)); if(!l.qty)S.cart.splice(+d.i,1); persist(); renderCartDrawer(); if(/#\/(cart|checkout)/.test(location.hash))render(); else renderChrome(); break;}
    case "remove": S.cart.splice(+d.i,1); persist(); renderCartDrawer(); if(/#\/(cart|checkout)/.test(location.hash))render(); else renderChrome(); break;
    case "co-back": S.checkout.step=Math.max(0,S.checkout.step-1); render(); break;
    case "co-next": S.checkout.step++; render(); break;
    case "co-pay": S.checkout.pay=a.value; render(); break;
    case "place-order": {const C=S.checkout,dd=C.data; const sub=cartTotal(),dc=discount(sub),fee=shipFee(sub-dc),cod=C.pay==="cod"?COD_FEE:0; const g=gov(); const no=String(Math.floor(100000+Math.random()*900000));
      // decrement stock
      S.cart.forEach(l=>{const p=PRODUCTS.find(x=>x.id===l.id);p.stock[l.color][l.size]=Math.max(0,p.stock[l.color][l.size]-l.qty)});
      S.orders.push({no,name:dd.name,phone:dd.phone,email:dd.email,addr:dd.addr,city:dd.city,gov:g[1],govAr:g[2],eta:g[4],etaAr:g[5],pay:C.pay,lines:S.cart,total:sub-dc+fee+cod,at:Date.now(),stage:0});
      S.cart=[]; S.promo=null; S.checkout={step:0,data:{},pay:"cod"}; persist(); location.hash="#/thanks/"+no; break;}
    case "add-outfit": {const lines=d.items.split(",").map(x=>x.split(":"));let n=0;
      lines.forEach(([id,c,s])=>{const p=PRODUCTS.find(x=>x.id===id); if(!p||!stockOf(p,c,s))return; n++;
        const l=S.cart.find(x=>x.id===id&&x.color===c&&x.size===s);
        if(l)l.qty=Math.min(stockOf(p,c,s),l.qty+1); else S.cart.push({id,color:c,size:s,qty:1,price:p.price})});
      persist(); toast("✓ "+t("added")+" · "+n); updateCounts(); renderChrome(); Motion.flyToCart(a).then(()=>openPanel("cartDrawer")); break;}

    case "logout": S.user=null; persist(); render(); break;
    case "clear-filters": S.filters={cat:[],fit:[],size:[],price:null,stock:false,sale:false,sort:"featured",q:""}; location.hash="#/shop"; render(); break;
  }
});

  if(el.dataset.action==="gov"){S.gov=el.value;persist();render();return}

    case "co-contact": Object.assign(S.checkout.data,fd); S.checkout.step=1; render(); break;
    case "co-delivery": Object.assign(S.checkout.data,fd); S.gov=fd.gov; persist(); S.checkout.step=2; render(); break;
    case "track": location.hash=`#/track?no=${encodeURIComponent(fd.no.trim().replace("#",""))}&phone=${encodeURIComponent(fd.phone.trim())}`; break;

/* ===== MOBILE HERO + CHROME (agent) ===== */
/* ============================================================
   COREWARE — MOBILE HERO + CHROME  (agent: mobile/hero)
   window.MBHero   = { init(root), destroy() }   call after initHero(app) on home
   window.MBChrome = { init(), destroy() }       call once at boot (idempotent)
   window.MB       = { badgePop() }
   Vanilla, no deps. Phones only: everything no-ops above 979px and
   re-arms itself when the viewport crosses the breakpoint.
   Only transform / opacity / custom-props are written per frame.
   ============================================================ */
(function (win, doc) {
  "use strict";
  if (!win || !doc) return;

  var mq = win.matchMedia ? win.matchMedia("(max-width:979px)") : null;
  var isPhone = function () { return !!(mq && mq.matches); };
  var reduced = function () { return !!(win.matchMedia && win.matchMedia("(prefers-reduced-motion: reduce)").matches); };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var onMQ = function (fn) {
    if (!mq) return function () {};
    if (mq.addEventListener) { mq.addEventListener("change", fn); return function () { mq.removeEventListener("change", fn); }; }
    mq.addListener(fn); return function () { mq.removeListener(fn); };
  };

  /* ============================================================
     MBHero
     ============================================================ */
  var MB_LEAD = {
    en: "Heavyweight cotton. Baggy denim. Made in Egypt.",
    ar: "قطن ثقيل، جينز واسع، صناعة مصرية."
  };
  var hero = null;        // live instance
  var heroRoot = null;    // last root passed to init (for MQ re-arm)
  var heroMQOff = null;

  function resolveHero(root) {
    if (!root) return doc.querySelector(".hx-hero");
    if (root.matches && root.matches(".hx-hero")) return root;
    return root.querySelector ? root.querySelector(".hx-hero") : null;
  }

  function heroInit(root) {
    heroRoot = root || null;
    if (hero) hero.destroy();
    if (!heroMQOff) heroMQOff = onMQ(function () { heroInit(heroRoot); });
    if (!isPhone()) return null;
    var el = resolveHero(root);
    if (!el || !el.isConnected) return null;

    var wrap = el.querySelector(".hx-wrap");
    var copy = el.querySelector(".hx-copy");
    var title = el.querySelector(".hx-title");
    var lead = el.querySelector(".hx-lead");
