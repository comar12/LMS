<style>
:root{
  --ink:#111111; --ink-2:#2A2A2A; --mute:#6B6B6B; --line:#E4E1DB; --paper:#F5F3EE; --white:#FFFFFF;
  --signal:#FF4F1F; --signal-ink:#FFFFFF; --ok:#1F8A4C; --warn:#C7791A; --bad:#C62828;
  --radius:4px; --radius-lg:12px; --shadow:0 10px 30px rgba(17,17,17,.12);
  --font-head:"Space Grotesk","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif;
  --header-h:64px; --dock-h:64px; --gutter:16px; --max:1320px;
}
html[dir="rtl"]{--font-head:"IBM Plex Sans Arabic","Space Grotesk",system-ui,sans-serif;--font-body:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
h1{font-size:clamp(34px,5vw,64px)} h2{font-size:clamp(26px,3.2vw,40px)} h3{font-size:20px} h4{font-size:16px}
p{margin:0 0 12px}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter)}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);z-index:100}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--radius);font-weight:600;font-size:15px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;transition:transform .12s,background .15s,color .15s;white-space:nowrap}
.btn:hover{background:var(--ink-2)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink)} .btn.ghost:hover{background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink);border-color:#fff} .btn.light:hover{background:var(--paper)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)} .btn.signal:hover{filter:brightness(.92)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;position:relative}
.icon-btn:hover{background:var(--paper)}
.badge-count{position:absolute;top:4px;inset-inline-end:2px;background:var(--signal);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* announcement */
.announce{background:var(--ink);color:#fff;font-size:13px;font-weight:500;text-align:center;padding:9px var(--gutter);letter-spacing:.02em}
.announce b{color:var(--signal)}

/* header */
.header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.header .bar{height:var(--header-h);display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:22px;letter-spacing:-.03em;margin-inline-end:18px}
.logo .mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.logo .mark i{width:13px;height:13px;border:3.5px solid var(--signal);border-radius:50%}
.nav{display:none;gap:4px;flex:1}
.nav a{padding:10px 12px;border-radius:var(--radius);font-weight:500;font-size:15px}
.nav a:hover,.nav a.active{background:var(--paper)}
.nav a.sale{color:var(--signal);font-weight:600}
.tools{display:flex;align-items:center;gap:2px;margin-inline-start:auto}
.lang{font-weight:600;font-size:14px;padding:0 10px;height:40px;border-radius:20px;border:1.5px solid var(--line)}
.lang:hover{border-color:var(--ink)}
.bar{min-width:0} .icon-btn,.menu-btn,.lang{flex:none}
@media(min-width:980px){.nav{display:flex}.menu-btn{display:none}}
@media(max-width:979px){.tools a.icon-btn[href="#/wishlist"],.tools a.icon-btn[href="#/account"]{display:none}.logo{margin-inline-end:auto;font-size:19px}.lang{padding:0 9px;font-size:13px;height:36px}}

/* search overlay */
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:60;display:none}
.overlay.open{display:block}
.search-panel{position:fixed;top:0;left:0;right:0;width:100%;background:#fff;z-index:61;transform:translateY(-100%);transition:transform .25s;padding:18px var(--gutter) 24px;max-height:85vh;overflow:auto;visibility:hidden}
.search-panel.open{transform:none;visibility:visible}
.search-row{display:flex;gap:10px;align-items:center;max-width:var(--max);margin:0 auto;min-width:0}
.search-row input{flex:1;min-width:0;height:52px;border:1.5px solid var(--ink);border-radius:var(--radius);padding:0 16px;font-size:18px}
.search-results{max-width:var(--max);margin:16px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.search-results{grid-template-columns:repeat(4,1fr)}}
.search-hint{max-width:var(--max);margin:10px auto 0;color:var(--mute);font-size:14px}

/* drawers */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:#fff;z-index:61;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer{visibility:hidden} .drawer.open{transform:none!important;visibility:visible}
.drawer.left{inset-inline-end:auto;inset-inline-start:0;transform:translateX(-100%)}
html[dir="rtl"] .drawer.left{transform:translateX(100%)}
.drawer .head{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gutter);border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:var(--gutter)}
.drawer .foot{padding:var(--gutter);border-top:1px solid var(--line);background:#fff}
.menu-list a{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);font-size:18px;font-weight:600;font-family:var(--font-head)}
.menu-list .sub a{font-size:15px;font-weight:400;font-family:var(--font-body);padding:10px 16px;border:0;color:var(--ink-2)}

/* cart lines */
.line{display:grid;grid-template-columns:84px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .thumb{width:84px;aspect-ratio:4/5;background:var(--paper);border-radius:var(--radius);overflow:hidden}
.line .meta{font-size:14px;color:var(--mute)}
.qty{display:inline-flex;border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:8px}
.qty button{width:36px;height:36px;font-size:18px} .qty span{min-width:34px;display:grid;place-items:center;font-weight:600}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* hero */
.hero{position:relative;background:var(--ink);color:#fff;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1fr;min-height:560px}
@media(min-width:900px){.hero .grid{grid-template-columns:1.05fr 1fr;min-height:640px}}
.hero .copy{padding:56px var(--gutter);display:flex;flex-direction:column;justify-content:center;gap:20px;position:relative;z-index:2}
.hero .eyebrow{color:var(--signal);font-weight:600;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.hero h1{max-width:12ch}
.hero p.lead{font-size:18px;color:#CFCBC3;max-width:46ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .art{position:relative;background:#1A1A1A;display:grid;place-items:center;overflow:hidden}
.hero .art svg{width:min(92%,560px);filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.hero .art .ring{position:absolute;width:140%;aspect-ratio:1;border:1px solid rgba(255,255,255,.08);border-radius:50%}
.hero .art .ring.r2{width:95%;border-color:rgba(255,79,31,.35)}
.hero .stamp{position:absolute;bottom:18px;inset-inline-end:18px;font-family:var(--font-head);font-size:12px;letter-spacing:.2em;color:#8E8A83;text-transform:uppercase}

/* trust strip */
.trust{display:grid;grid-template-columns:repeat(2,1fr);border-bottom:1px solid var(--line)}
@media(min-width:760px){.trust{grid-template-columns:repeat(4,1fr)}}
.trust div{padding:16px var(--gutter);display:flex;gap:12px;align-items:center;font-size:14px;font-weight:500;border-inline-end:1px solid var(--line)}
.trust div:last-child{border:0}
.trust svg{width:22px;height:22px;flex:none;stroke:var(--signal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sections */
.section{padding:56px 0}
.section.tight{padding:36px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.sec-head p{color:var(--mute);margin:6px 0 0}
.sec-head a{font-weight:600;border-bottom:2px solid var(--ink);white-space:nowrap}
.grid{display:grid;gap:18px 14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid.three{grid-template-columns:repeat(2,1fr)} @media(min-width:900px){.grid.three{grid-template-columns:repeat(3,1fr)}}

/* product card */
.card{position:relative;display:flex;flex-direction:column;gap:8px}
.card .media{position:relative;aspect-ratio:4/5;background:var(--paper);border-radius:var(--radius-lg);overflow:hidden}
.card .media svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .25s}
.card .media svg.alt{opacity:0}
.card:hover .media svg.alt{opacity:1}
.card .badges{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:3px;background:#fff;color:var(--ink)}
.pill.sale{background:var(--signal);color:#fff} .pill.low{background:#FFF1E8;color:#B33A0F} .pill.out{background:var(--ink);color:#fff} .pill.new{background:var(--ink);color:#fff}
.wish{position:absolute;top:8px;inset-inline-end:8px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.wish svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2}
.wish.on svg{fill:var(--signal);stroke:var(--signal)}
.quick{position:absolute;inset-inline:8px;bottom:8px;z-index:3;background:rgba(255,255,255,.96);border-radius:var(--radius);padding:8px;opacity:0;transform:translateY(6px);transition:.2s;display:none}
@media(hover:hover){.quick{display:block}.card:hover .quick,.card:focus-within .quick{opacity:1;transform:none}}
.quick .sizes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.quick .sizes button{min-width:40px;height:40px;border:1.5px solid var(--line);border-radius:3px;font-size:13px;font-weight:600;padding:0 6px}
.quick .sizes button:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.quick .sizes button.out{color:#B5B5B5;text-decoration:line-through;cursor:not-allowed}
.quick .sizes button.out:hover{background:none;color:#B5B5B5;border-color:var(--line)}
.card .info{display:flex;flex-direction:column;gap:3px;padding:0 2px}
.card .name{font-weight:600;font-size:15px;line-height:1.3}
.card .sub{color:var(--mute);font-size:13px}
.price{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:baseline}
.price s{color:var(--mute);font-weight:400;font-size:13px}
.price .off{color:var(--signal);font-size:12px;font-weight:700}
.swatches{display:flex;gap:6px;margin-top:2px}
.swatches i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.stars{color:var(--signal);font-size:12px;letter-spacing:1px}
.stars small{color:var(--mute);letter-spacing:0;margin-inline-start:4px;font-size:12px}

/* fit tiles */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:4/5;border-radius:var(--radius-lg);overflow:hidden;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:end;padding:18px}
.tile svg{position:absolute;inset:0;width:100%;height:100%;opacity:.9;transition:transform .4s}
.tile:hover svg{transform:scale(1.04)}
.tile .t{position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.tile .t h3{font-size:22px} .tile .t span{font-size:13px;opacity:.85}

/* split banner */
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.split{grid-template-columns:1fr 1fr}}
.banner{position:relative;min-height:340px;border-radius:var(--radius-lg);overflow:hidden;background:var(--paper);display:flex;align-items:end;padding:24px}
.banner.dark{background:var(--ink);color:#fff}
.banner .t{position:relative;z-index:1;max-width:30ch}
.banner .t h3{font-size:30px;margin-bottom:8px}
.banner svg.bg{position:absolute;inset:auto -10% -20% auto;width:70%;opacity:.95}

/* reviews */
.reviews{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.reviews{grid-template-columns:repeat(3,1fr)}}
.review{border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px}
.review .who{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:10px}
.review .tag{display:inline-block;font-size:11px;background:var(--paper);padding:3px 7px;border-radius:3px;margin-top:8px}

/* stores */
.stores{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.stores{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.stores{grid-template-columns:repeat(3,1fr)}}
.store{border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:6px}
.store h3{font-size:18px} .store .meta{font-size:14px;color:var(--mute)}
.store .open{color:var(--ok);font-weight:600;font-size:13px}
.store .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* shop page */
.shop{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:980px){.shop{grid-template-columns:250px 1fr}}
.filters{position:sticky;top:calc(var(--header-h) + 12px);align-self:start;display:none}
@media(min-width:980px){.filters{display:block}}
.filters.open{display:block;position:fixed;inset:0;z-index:62;background:#fff;overflow:auto;padding:var(--gutter);top:0}
.fgroup{border-bottom:1px solid var(--line);padding:14px 0}
.fgroup summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.fgroup summary::after{content:"+";font-weight:400} .fgroup[open] summary::after{content:"–"}
.fgroup label{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;cursor:pointer}
.fgroup input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:20px;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;font-size:13px;font-weight:500}
.chip.on,.chip:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.toolbar select{height:44px;border:1.5px solid var(--line);border-radius:var(--radius);padding:0 12px;background:#fff}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:14px}
.crumbs a:hover{color:var(--ink)}
.empty{padding:60px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--radius-lg)}

/* product page */
.pdp{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:980px){.pdp{grid-template-columns:1.15fr 1fr;gap:48px}}
.gallery{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.gallery .shot{aspect-ratio:4/5;background:var(--paper);border-radius:var(--radius-lg);overflow:hidden;position:relative}
.gallery .shot:first-child{grid-column:1/-1}
.gallery .shot svg{position:absolute;inset:0;width:100%;height:100%}
.buy{position:sticky;top:calc(var(--header-h) + 16px);align-self:start;display:flex;flex-direction:column;gap:16px}
.buy .top .cat{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.buy h1{font-size:clamp(26px,3vw,36px);margin:4px 0 6px}
.buy .price{font-size:22px}
.opt-label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
.opt-label button{color:var(--mute);font-weight:500;text-decoration:underline}
.colors{display:flex;gap:10px}
.colors button{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.sizes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sizes-grid button{height:48px;border:1.5px solid var(--line);border-radius:var(--radius);font-weight:600;position:relative}
.sizes-grid button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.sizes-grid button.out{color:#B5B5B5;background:repeating-linear-gradient(135deg,transparent 0 6px,#F1F0ED 6px 7px)}
.sizes-grid button.out::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:1.5px;background:#B5B5B5;transform:rotate(-20deg)}
.sizes-grid button small{display:block;font-size:10px;font-weight:500;color:var(--warn);line-height:1}
.model{font-size:13px;color:var(--mute)}
.stock{font-size:14px;font-weight:600}
.stock.low{color:var(--warn)} .stock.out{color:var(--bad)} .stock.ok{color:var(--ok)}
.deliver{border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px}
.deliver .row{display:flex;gap:10px;align-items:center}
.deliver select{height:44px;flex:1;border:1.5px solid var(--line);border-radius:var(--radius);padding:0 10px;background:#fff}
.deliver .eta{font-size:14px;margin-top:10px;display:flex;flex-direction:column;gap:4px}
.deliver .eta b{color:var(--ok)}
.pay-row{display:flex;gap:6px;flex-wrap:wrap}
.pay{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:4px 7px;color:var(--ink-2);letter-spacing:.02em}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{cursor:pointer;padding:16px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.acc summary::after{content:"+"} .acc details[open] summary::after{content:"–"}
.acc .c{padding:0 0 16px;color:var(--ink-2);font-size:15px}
.acc table{width:100%;border-collapse:collapse;font-size:14px} .acc td,.acc th{border:1px solid var(--line);padding:8px;text-align:start}
.rating-sum{display:flex;align-items:center;gap:14px}
.rating-sum .big{font-family:var(--font-head);font-size:44px;font-weight:700}
.bars{flex:1;display:grid;gap:4px;font-size:12px}
.bars div{display:grid;grid-template-columns:14px 1fr 28px;gap:8px;align-items:center}
.bars i{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.bars i b{display:block;height:100%;background:var(--ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{height:48px;border:1.5px solid var(--line);border-radius:var(--radius);padding:0 14px;background:#fff}
.field textarea{height:auto;padding:12px 14px;min-height:120px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:0}
.field .err{color:var(--bad);font-size:13px;display:none}
.field.invalid input{border-color:var(--bad)} .field.invalid .err{display:block}
.two{display:grid;gap:0 14px;grid-template-columns:1fr} @media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
.radio{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.radio.on{border-color:var(--ink);background:var(--paper)}
.radio input{accent-color:var(--ink);width:18px;height:18px}
.radio .d{font-size:13px;color:var(--mute)}
.radio .f{margin-inline-start:auto;font-weight:600;white-space:nowrap}

/* checkout */
.checkout{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:980px){.checkout{grid-template-columns:1fr 400px}}
.steps{display:flex;gap:6px;margin-bottom:22px;font-size:13px;font-weight:600;flex-wrap:wrap}
.steps span{padding:6px 10px;border-radius:20px;background:var(--paper);color:var(--mute)}
.steps span.on{background:var(--ink);color:#fff} .steps span.done{color:var(--ok)}
.summary{border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;position:sticky;top:calc(var(--header-h) + 16px)}
.summary .tot{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.summary .tot.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}

/* tracking */
.timeline{display:grid;gap:0;margin-top:18px}
.timeline div{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:18px;position:relative}
.timeline div::before{content:"";position:absolute;inset-inline-start:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.timeline div:last-child::before{display:none}
.timeline i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.timeline div.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.timeline div.now i{border-color:var(--signal);color:var(--signal)}
.timeline small{color:var(--mute);display:block}

/* misc */
.note{background:var(--paper);border-radius:var(--radius-lg);padding:16px 18px;font-size:14px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line)}
.table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)} @media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.kpi b{font-family:var(--font-head);font-size:28px;display:block} .kpi span{font-size:13px;color:var(--mute)}
.prose{max-width:72ch} .prose h2{margin:28px 0 10px;font-size:24px} .prose h3{margin:20px 0 6px}
.prose ul{padding-inline-start:20px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tabs button{padding:12px 14px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{border-color:var(--ink)}
.toast{position:fixed;bottom:calc(var(--dock-h) + 14px);inset-inline-start:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:70;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
html[dir="rtl"] .toast{transform:translate(50%,20px)}
.toast.show{opacity:1;transform:translate(-50%,0)} html[dir="rtl"] .toast.show{transform:translate(50%,0)}
@media(min-width:980px){.toast{bottom:24px}}
.modal{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:var(--radius-lg);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative;box-shadow:var(--shadow)}
.modal .x{position:absolute;top:10px;inset-inline-end:10px}
.marquee{overflow:hidden;background:var(--signal);color:#fff;font-family:var(--font-head);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:10px 0;white-space:nowrap}
.marquee span{display:inline-block;padding-inline-end:48px;animation:slide 28s linear infinite}
html[dir="rtl"] .marquee span{animation-name:slide-rtl}
@keyframes slide{to{transform:translateX(-50%)}} @keyframes slide-rtl{to{transform:translateX(50%)}}
@media(prefers-reduced-motion:reduce){.marquee span{animation:none}}

/* footer */
footer{background:var(--paper);margin-top:40px;padding:48px 0 calc(var(--dock-h) + 24px);border-top:1px solid var(--line)}
@media(min-width:980px){footer{padding-bottom:32px}}
.fgrid{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.fgrid>div{min-width:0}
@media(min-width:600px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.fgrid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.fgrid h4{margin-bottom:10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.fgrid a{display:block;padding:5px 0;font-size:14px;color:var(--ink-2)}
.fgrid a:hover{color:var(--signal)}
.news{display:flex;gap:8px;margin-top:10px}
.news{min-width:0} .news input{flex:1 1 0;width:0;height:48px;border:1.5px solid var(--line);border-radius:var(--radius);padding:0 12px;background:#fff;min-width:0}
.fbottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px;font-size:13px;color:var(--mute);align-items:center}

/* mobile dock */
.dock{position:fixed;bottom:0;inset-inline:0;height:var(--dock-h);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:55;padding-bottom:env(safe-area-inset-bottom)}
.dock a,.dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute);position:relative}
.dock a.active{color:var(--ink)}
.dock svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:980px){.dock{display:none}}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>

const stockOf=(p,c,s)=>p.stock[c]?.[s]??0;
const anyStock=(p)=>p.colors.some(c=>p.sizes.some(s=>stockOf(p,c,s)>0));

const lowAny=(p)=>!anyStock(p)?false:p.colors.every(c=>p.sizes.every(s=>stockOf(p,c,s)<=3));

function isDark(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000<128}

function heroArt(){
  return `<svg viewBox="0 0 520 520" aria-hidden="true"><g transform="translate(60,40) scale(1.55)">${garment("jeans","indigo",0,"transparent").replace(/<svg[^>]*>|<\/svg>|<defs>[\s\S]*?<\/defs>|<rect width="260"[^>]*\/>/g,"")}</g><g transform="translate(250,-20) scale(1.1)" opacity=".92">${garment("hoodie","signal",0,"transparent").replace(/<svg[^>]*>|<\/svg>|<defs>[\s\S]*?<\/defs>|<rect width="260"[^>]*\/>/g,"")}</g></svg>`;
}

function stars(r,n){const full=Math.round(r);return `<div class="stars" aria-label="${r} out of 5">${"★".repeat(full)}${"☆".repeat(5-full)}<small>${r.toFixed(1)} (${n})</small></div>`}
function priceHTML(p,big){const off=p.compare?Math.round(100-(p.price/p.compare)*100):0;return `<div class="price${big?' big':''}">${money(p.price)}${p.compare?`<s>${money(p.compare)}</s><span class="off">−${off}%</span>`:""}</div>`}
function badges(p){const b=[];if(!anyStock(p))b.push(`<span class="pill out">${t("soldOut")}</span>`);else{if(p.compare)b.push(`<span class="pill sale">${t("sale")}</span>`);if(p.tags.includes("new"))b.push(`<span class="pill new">${t("new")}</span>`);if(lowAny(p))b.push(`<span class="pill low">${t("lowStock")}</span>`)}return b.join("")}
function card(p){
  const c0=p.colors.find(c=>colorStock(p,c))||p.colors[0];
  const wished=S.wish.includes(p.id);
  const alt=`${pname(p)} — ${cname(c0)}`;
  return `<article class="card" data-id="${p.id}">
    <div class="media"><a href="#/product/${p.id}" aria-label="${esc(alt)}">${garment(p.garment,c0,0)}<span class="alt">${garment(p.garment,c0,1,"#ECE9E2")}</span></a>
      <div class="badges">${badges(p)}</div>
      <button class="wish ${wished?"on":""}" data-action="wish" data-id="${p.id}" aria-label="${t("wishlist")}" aria-pressed="${wished}"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg></button>
      ${anyStock(p)?`<div class="quick"><div class="sizes">${p.sizes.map(s=>{const st=stockOf(p,c0,s);return `<button data-action="quick-add" data-id="${p.id}" data-color="${c0}" data-size="${s}" class="${st?"":"out"}" ${st?"":"disabled"} aria-label="${s}">${s}</button>`}).join("")}</div></div>`:""}
    </div>
    <div class="info">
      <a class="name" href="#/product/${p.id}">${esc(pname(p))}</a>
      <div class="sub">${t("fits."+p.fit)} · ${t("cats."+p.cat)}</div>
      ${priceHTML(p)}
      <div class="swatches" aria-hidden="true">${p.colors.map(c=>`<i style="background:${COLORS[c][0]}"></i>`).join("")}</div>
    </div></article>`;
}
function grid(list,cls=""){return `<div class="grid ${cls}">${list.map(card).join("")}</div>`}
function sectionHead(title,sub,link,linkText){return `<div class="sec-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div>${link?`<a href="${link}">${linkText||t("viewAll")} →</a>`:""}</div>`}
function crumbs(parts){return `<nav class="crumbs" aria-label="Breadcrumb"><a href="#/">${t("breadcrumbHome")}</a>${parts.map(p=>` / ${p[1]?`<a href="${p[1]}">${p[0]}</a>`:p[0]}`).join("")}</nav>`}

function storeCard(s){return `<div class="store"><h3>${S.lang==="ar"?s.nameAr:s.name}</h3><div class="meta">${S.lang==="ar"?s.addrAr:s.addr}</div><div class="meta">${t("hours")}</div><div class="open">● ${t("openNow")}</div><div class="acts"><a class="btn ghost sm" href="${s.map}" target="_blank" rel="noopener">${t("directions")}</a><a class="btn ghost sm" href="tel:+2${s.phone}">${t("call")} ${s.phone}</a></div></div>`}
function newsletterBlock(){return `<section class="section"><div class="wrap"><div class="note" style="display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:center;min-width:0"><div><h3>${t("newsTitle")}</h3><p style="margin:4px 0 0;color:var(--mute)">${t("newsSub")}</p></div><form class="news" data-form="news"><input type="email" required placeholder="you@example.com" aria-label="Email"><button class="btn">${t("subscribe")}</button></form></div></div></section>`}

PAGES.shop = (params)=>{
  const F=S.filters;
  // apply URL params once
  if(params.cat)F.cat=[params.cat]; if(params.fit)F.fit=[params.fit]; if(params.tag==="new")F.sort="new"; if(params.sort)F.sort=params.sort; if(params.sale)F.sale=true; if(params.q!==undefined)F.q=params.q;
  let list=PRODUCTS.slice();
  if(F.cat.length)list=list.filter(p=>F.cat.includes(p.cat));
  if(F.fit.length)list=list.filter(p=>F.fit.includes(p.fit));
  if(F.size.length)list=list.filter(p=>F.size.some(s=>p.sizes.includes(s)&&p.colors.some(c=>stockOf(p,c,s)>0)));
  if(F.price)list=list.filter(p=>p.price>=F.price[0]&&p.price<F.price[1]);
  if(F.stock)list=list.filter(anyStock);
  if(F.sale)list=list.filter(p=>p.compare);
  if(F.q){const q=F.q.toLowerCase();list=list.filter(p=>[p.name,p.nameAr,p.cat,p.fit,...p.colors,...p.sizes].join(" ").toLowerCase().includes(q))}
  const sorters={featured:(a,b)=>(anyStock(b)-anyStock(a))||(a.order-b.order),new:(a,b)=>(b.tags.includes("new")-a.tags.includes("new"))||(a.order-b.order),priceAsc:(a,b)=>a.price-b.price,priceDesc:(a,b)=>b.price-a.price,rating:(a,b)=>b.rating-a.rating};
  list.sort(sorters[F.sort]||sorters.featured);
  // sold-out always last
  list.sort((a,b)=>anyStock(b)-anyStock(a));
  const cats=["denim","tees","hoodies","sweatpants","shirts","shorts","trousers","jackets","shoes","accessories"];
  const fits=["baggy","superbaggy","balloon","flared","boxy","oversized","regular"];
  const sizes=[...SIZES.tops,...SIZES.denim,...SIZES.shoes];
  const prices=[[0,800],[800,1200],[1200,2000],[2000,99999]];
  const title=F.cat.length===1?t("cats."+F.cat[0]):F.sale?t("sale"):F.q?`“${esc(F.q)}”`:t("shop");
  const active=F.cat.length+F.fit.length+F.size.length+(F.price?1:0)+(F.stock?1:0)+(F.sale?1:0);
  return `<div class="wrap section tight">${crumbs([[t("shop"),"#/shop"],...(F.cat.length===1?[[title]]:[])])}
  <h1 style="font-size:clamp(28px,4vw,44px);margin-bottom:18px">${title}</h1>
  <div class="shop">
    <aside class="filters" id="filters" aria-label="${t("filters")}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><strong>${t("filters")}</strong>${active?`<button class="chip" data-action="clear-filters">${t("clearAll")}</button>`:""}<button class="icon-btn menu-btn" data-action="close-filters" aria-label="Close">✕</button></div>
      <details class="fgroup" open><summary>${t("fCat")}</summary>${cats.map(c=>`<label><input type="checkbox" data-filter="cat" value="${c}" ${F.cat.includes(c)?"checked":""}> ${t("cats."+c)} <span style="margin-inline-start:auto;color:var(--mute);font-size:12px">${PRODUCTS.filter(p=>p.cat===c).length}</span></label>`).join("")}</details>
      <details class="fgroup" open><summary>${t("fFit")}</summary><div class="chips" style="padding-top:8px">${fits.map(f=>`<button class="chip ${F.fit.includes(f)?"on":""}" data-filter="fit" data-value="${f}">${t("fits."+f)}</button>`).join("")}</div></details>
      <details class="fgroup"><summary>${t("fSize")}</summary><div class="chips" style="padding-top:8px">${sizes.map(s=>`<button class="chip ${F.size.includes(s)?"on":""}" data-filter="size" data-value="${s}">${s}</button>`).join("")}</div></details>
      <details class="fgroup"><summary>${t("fPrice")}</summary>${prices.map(r=>`<label><input type="radio" name="price" data-filter="price" value="${r.join("-")}" ${F.price&&F.price[0]===r[0]?"checked":""}> ${r[1]>50000?`${t("over")} ${money(r[0])}`:r[0]===0?`${t("under")} ${money(r[1])}`:`${money(r[0])} – ${money(r[1])}`}</label>`).join("")}</details>
      <details class="fgroup" open><summary>${t("fStock")}</summary><label><input type="checkbox" data-filter="stock" ${F.stock?"checked":""}> ${t("inStockOnly")}</label><label><input type="checkbox" data-filter="sale" ${F.sale?"checked":""}> ${t("onSale")}</label></details>
      <div style="padding-top:14px" class="menu-btn"><button class="btn block" data-action="close-filters">${list.length} ${t("results")}</button></div>
    </aside>
    <div>
      <div class="toolbar"><div><button class="btn ghost sm menu-btn" data-action="open-filters">${t("filters")}${active?` (${active})`:""}</button> <span style="color:var(--mute);font-size:14px">${list.length} ${t("results")}</span></div>
        <label><span class="sr">${t("sort")}</span><select data-filter="sort">${Object.entries(t("sortOpts")).map(([k,v])=>`<option value="${k}" ${F.sort===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
      ${list.length?grid(list,"three"):`<div class="empty">${t("noResults")}</div>`}
    </div>
  </div></div>`;
};

PAGES.product = (params,id)=>{
  const p=PRODUCTS.find(x=>x.id===id); if(!p)return PAGES.notfound();
  if(!S.pdp.color||!p.colors.includes(S.pdp.color))S.pdp.color=p.colors.find(c=>colorStock(p,c))||p.colors[0];
  const c=S.pdp.color, s=S.pdp.size;
  const st=s?stockOf(p,c,s):null;
  const g=gov(); const sub=cartTotal()+p.price; const fee=sub>=FREE_SHIP?0:g[3];
  const modelSize=p.sizeKey==="tops"?"L":p.sizeKey==="denim"?"32":p.sizeKey==="shoes"?"43":"ONE";
  const rel=PRODUCTS.filter(x=>x.id!==p.id&&(x.cat!==p.cat)).sort((a,b)=>(b.tags.includes("best")-a.tags.includes("best"))).slice(0,4);
  const revs=REVIEWS.filter(r=>r.p===p.id);
  const dist=[5,4,3,2,1].map(k=>[k,Math.round(p.reviews*(k===5?.72:k===4?.2:k===3?.05:k===2?.02:.01))]);
  const chart=SIZE_CHARTS[p.sizeKey];
  const colorSoldOut=!colorStock(p,c);
  return `<div class="wrap section tight">${crumbs([[t("shop"),"#/shop"],[t("cats."+p.cat),"#/shop?cat="+p.cat],[pname(p)]])}
  <div class="pdp">
    <div class="gallery">
      <div class="shot">${garment(p.garment,c,0)}</div>
      <div class="shot">${garment(p.garment,c,1,"#ECE9E2")}</div>
      <div class="shot">${garment(p.garment,c,0,"#E3E0D8")}</div>
    </div>
    <div class="buy">
      <div class="top"><div class="cat">${t("cats."+p.cat)} · ${t("fits."+p.fit)}</div><h1>${esc(pname(p))}</h1>${stars(p.rating,p.reviews)}<div style="margin-top:8px">${priceHTML(p,true)}</div><div style="display:flex;gap:6px;margin-top:8px">${badges(p)}</div></div>
      <div><div class="opt-label"><span>${t("color")}: ${cname(c)}</span></div><div class="colors">${p.colors.map(x=>`<button data-action="pdp-color" data-value="${x}" class="${x===c?"on":""}" style="background:${COLORS[x][0]}" aria-label="${cname(x)}" aria-pressed="${x===c}" title="${cname(x)}${colorStock(p,x)?"":" · "+t("soldOut")}"></button>`).join("")}</div></div>
      ${p.sizeKey!=="one"?`<div><div class="opt-label"><span>${t("size")}${s?": "+s:""}</span><button data-action="open-size-guide" data-kind="${p.sizeKey}">${t("sizeGuide")}</button></div>
        <div class="sizes-grid" role="radiogroup" aria-label="${t("size")}">${p.sizes.map(x=>{const n=stockOf(p,c,x);return `<button role="radio" aria-checked="${x===s}" data-action="pdp-size" data-value="${x}" class="${x===s?"on":""} ${n?"":"out"}" ${n?"":"aria-disabled='true'"}>${x}${n&&n<=3?`<small>${fmt(t("onlyLeft"),{n})}</small>`:""}</button>`}).join("")}</div>
        <p class="model" style="margin:8px 0 0">${fmt(t("model"),{s:modelSize})}</p></div>`:""}
      ${s!==null&&s!==undefined?(st>0?`<div class="stock ${st<=3?"low":"ok"}">${st<=3?fmt(t("onlyLeft"),{n:st}):t("inStock")} · ${t("size")} ${s}</div>`:`<div class="stock out">${t("soldOut")} · ${t("size")} ${s}</div>`):""}
      ${(p.sizeKey==="one"?colorSoldOut:(s&&st===0))?`<button class="btn ghost block" data-action="notify" data-id="${p.id}" data-color="${c}" data-size="${s||"ONE"}">${t("notify")}</button>`:
        `<button class="btn signal block" data-action="add" data-id="${p.id}" data-color="${c}" data-size="${p.sizeKey==="one"?"ONE":(s||"")}" ${p.sizeKey!=="one"&&!s?"":""}>${p.sizeKey!=="one"&&!s?t("selectSize"):t("addToCart")}</button>`}
      <div class="deliver"><div class="row"><span style="font-size:14px;font-weight:600;white-space:nowrap">${t("deliverTo")}</span><select data-action="gov" aria-label="${t("fGov")}">${GOV.map(x=>`<option value="${x[0]}" ${x[0]===S.gov?"selected":""}>${S.lang==="ar"?x[2]:x[1]}</option>`).join("")}</select></div>
        <div class="eta"><span>🚚 ${fmt(t("eta"),{d:S.lang==="ar"?g[5]:g[4]})}</span><span>${fee?fmt(t("fee"),{f:fee}):`<b>${t("freeShip")}</b>`} · ${t("codFee")}</span></div></div>
      <div><div style="font-size:12px;color:var(--mute);margin-bottom:6px">${t("payWith")}</div><div class="pay-row">${["COD","VISA","Mastercard","Meeza","Fawry","ValU","Vodafone Cash","Apple Pay"].map(x=>`<span class="pay">${x}</span>`).join("")}</div></div>
      <div class="acc">
        <details open><summary>${t("details")}</summary><div class="c">${S.lang==="ar"?p.fabricAr:p.fabric}</div></details>
        ${chart?`<details><summary>${t("sizeGuide")} (cm)</summary><div class="c"><table><tr>${(S.lang==="ar"?chart.colsAr:chart.cols).map(h=>`<th>${h}</th>`).join("")}</tr>${chart.rows.filter(r=>p.sizes.includes(r[0])).map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table></div></details>`:""}
        <details><summary>${t("shipping")}</summary><div class="c">${t("shipText")}</div></details>
        <details><summary>${t("care")}</summary><div class="c">${t("careText")}</div></details>
      </div>
    </div>
  </div>
  <section class="section" id="reviews"><div class="wrap" style="padding:0">${sectionHead(t("reviews"),"")}
    <div style="display:grid;gap:24px;grid-template-columns:1fr;max-width:880px"><div class="rating-sum"><div class="big">${p.rating.toFixed(1)}</div><div class="bars">${dist.map(([k,n])=>`<div><span>${k}</span><i><b style="width:${Math.round(n/p.reviews*100)}%"></b></i><span>${n}</span></div>`).join("")}</div></div>
    <div class="reviews">${(revs.length?revs:REVIEWS.slice(0,3)).map(reviewCard).join("")}</div><div><button class="btn ghost sm" data-action="toast" data-msg="${t("writeReview")} — demo">${t("writeReview")}</button></div></div></div></section>
  <section class="section tight"><div class="wrap" style="padding:0">${sectionHead(t("youMayLike"),"")}${grid(rel)}</div></section>
  ${S.recent.filter(x=>x!==p.id).length?`<section class="section tight"><div class="wrap" style="padding:0">${sectionHead(t("recent"),"")}${grid(S.recent.filter(x=>x!==p.id).map(x=>PRODUCTS.find(q=>q.id===x)).filter(Boolean).slice(0,4))}</div></section>`:""}
  </div>`;
};

PAGES.cart = ()=>`<div class="wrap section tight"><h1 style="font-size:36px;margin-bottom:18px">${t("cart")}</h1>${S.cart.length?`<div class="checkout"><div id="cartPageBody">${cartLines()}</div><div class="summary">${cartSummary()}<a class="btn signal block" href="#/checkout" style="margin-top:14px">${t("checkout")}</a></div></div>`:`<div class="empty">${t("cartEmpty")}<br><br><a class="btn" href="#/shop">${t("continueShop")}</a></div>`}</div>`;

function cartLines(){return S.cart.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.id);return `<div class="line"><a class="thumb" href="#/product/${l.id}">${garment(p.garment,l.color,0)}</a><div><a href="#/product/${l.id}" style="font-weight:600">${pname(p)}</a><div class="meta">${cname(l.color)} · ${t("size")} ${l.size}</div><div class="qty" aria-label="${t("qty")}"><button data-action="qty" data-i="${i}" data-d="-1" aria-label="−">−</button><span>${l.qty}</span><button data-action="qty" data-i="${i}" data-d="1" aria-label="+" ${l.qty>=stockOf(p,l.color,l.size)?"disabled":""}>+</button></div></div><div style="text-align:end"><div style="font-weight:600">${money(l.price*l.qty)}</div><button data-action="remove" data-i="${i}" style="font-size:13px;color:var(--mute);text-decoration:underline;margin-top:8px">${t("remove")}</button></div></div>`}).join("")}
function cartSummary(withShip=true){const sub=cartTotal(),d=discount(sub),fee=shipFee(sub-d),cod=S.checkout.pay==="cod"?COD_FEE:0;const left=FREE_SHIP-(sub-d);
  return `<div class="tot"><span>${t("subtotal")}</span><span>${money(sub)}</span></div>${d?`<div class="tot" style="color:var(--ok)"><span>${t("discount")} (CORE10)</span><span>−${money(d)}</span></div>`:""}${withShip?`<div class="tot"><span>${t("shippingLbl")} · ${S.lang==="ar"?gov()[2]:gov()[1]}</span><span>${fee?money(fee):"0"}</span></div>`:""}${withShip&&cod?`<div class="tot"><span>${t("codLbl")}</span><span>${money(cod)}</span></div>`:""}
  <div class="progress"><i style="width:${Math.min(100,(sub-d)/FREE_SHIP*100)}%"></i></div><div style="font-size:13px;color:${left<=0?"var(--ok)":"var(--mute)"};margin-bottom:6px">${left<=0?"✓ "+t("freeUnlocked"):fmt(t("addMore"),{n:left.toLocaleString()})}</div>
  <form class="news" data-form="promo" style="margin:10px 0"><input placeholder="${t("promo")} (CORE10)" aria-label="${t("promo")}" value="${S.promo||""}"><button class="btn ghost sm">${t("apply")}</button></form>
  <div class="tot big"><span>${t("total")}</span><span>${money(sub-d+(withShip?fee+cod:0))}</span></div>`}

PAGES.checkout = ()=>{
  if(!S.cart.length)return PAGES.cart();
  const C=S.checkout, d=C.data; const step=C.step;
  const stepsHTML=`<div class="steps">${t("steps").map((x,i)=>`<span class="${i===step?"on":i<step?"done":""}">${i<step?"✓ ":""}${x}</span>`).join("")}</div>`;
  let body="";
  if(step===0)body=`<h2>${t("steps")[0]}</h2><form data-form="co-contact" novalidate style="margin-top:14px"><div class="field"><label>${t("fName")}</label><input name="name" required value="${esc(d.name||S.user?.name||"")}" autocomplete="name"><span class="err">${t("required")}</span></div><div class="field"><label>${t("fPhone")}</label><input name="phone" required inputmode="tel" pattern="^01[0-9]{9}$" value="${esc(d.phone||S.user?.phone||"")}" autocomplete="tel"><span class="err">${t("phoneErr")}</span></div><div class="field"><label>${t("fEmail")}</label><input name="email" type="email" value="${esc(d.email||"")}" autocomplete="email"></div><button class="btn block">${t("next")}</button></form>`;
  if(step===1)body=`<h2>${t("steps")[1]}</h2><form data-form="co-delivery" novalidate style="margin-top:14px"><div class="two"><div class="field"><label>${t("fGov")}</label><select name="gov">${GOV.map(x=>`<option value="${x[0]}" ${x[0]===S.gov?"selected":""}>${S.lang==="ar"?x[2]:x[1]} · ${x[3]} EGP · ${S.lang==="ar"?x[5]:x[4]}</option>`).join("")}</select></div><div class="field"><label>${t("fCity")}</label><input name="city" required value="${esc(d.city||"")}"><span class="err">${t("required")}</span></div></div><div class="field"><label>${t("fAddr")}</label><input name="addr" required value="${esc(d.addr||"")}" autocomplete="street-address"><span class="err">${t("required")}</span></div><div class="field"><label>${t("fNotes")}</label><input name="notes" value="${esc(d.notes||"")}"></div><div style="display:flex;gap:8px"><button type="button" class="btn ghost" data-action="co-back">${t("back")}</button><button class="btn" style="flex:1">${t("next")}</button></div></form>`;
  if(step===2)body=`<h2>${t("steps")[2]}</h2><div style="margin-top:14px">${Object.entries(t("payOpts")).map(([k,v])=>`<label class="radio ${C.pay===k?"on":""}"><input type="radio" name="pay" value="${k}" ${C.pay===k?"checked":""} data-action="co-pay"><div><div style="font-weight:600">${v}</div><div class="d">${t("payDesc."+k)}</div></div><span class="f">${k==="cod"?"+ EGP 25":"—"}</span></label>`).join("")}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" data-action="co-back">${t("back")}</button><button class="btn" style="flex:1" data-action="co-next">${t("next")}</button></div>`;
  if(step===3)body=`<h2>${t("steps")[3]}</h2><div class="note" style="margin:14px 0"><b>${esc(d.name)}</b> · ${esc(d.phone)}<br>${esc(d.addr)}, ${esc(d.city)}, ${S.lang==="ar"?gov()[2]:gov()[1]}<br>${t("payOpts."+C.pay)} · ${fmt(t("eta"),{d:S.lang==="ar"?gov()[5]:gov()[4]})}</div>${cartLines()}<div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" data-action="co-back">${t("back")}</button><button class="btn signal" style="flex:1" data-action="place-order">${t("placeOrder")}</button></div>`;
  return `<div class="wrap section tight"><h1 style="font-size:32px;margin-bottom:14px">${t("checkout")}</h1>${stepsHTML}<div class="checkout"><div>${body}</div><div class="summary">${cartSummary(true)}</div></div></div>`;
};

PAGES.thanks = (params,id)=>{const o=S.orders.find(x=>x.no===id);if(!o)return PAGES.notfound();return `<div class="wrap section" style="max-width:720px"><h1 style="font-size:40px">${fmt(t("thanks"),{n:esc(o.name.split(" ")[0])})}</h1><p style="font-size:18px;margin:10px 0">${t("orderNo")} <b>#${o.no}</b> · ${money(o.total)}</p><p style="color:var(--mute)">${fmt(t("orderMsg"),{d:S.lang==="ar"?o.etaAr:o.eta})}</p><div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><a class="btn" href="#/track?no=${o.no}&phone=${o.phone}">${t("track")}</a><a class="btn ghost" href="#/shop">${t("continueShop")}</a></div></div>`};

PAGES.track = (params)=>{
  const no=params.no||"", ph=params.phone||"";
  const o=no&&S.orders.find(x=>x.no===no&&x.phone===ph);
  const tl=o?`<div class="note" style="margin-top:18px"><b>#${o.no}</b> · ${money(o.total)} · ${t("payOpts."+o.pay)}<br>${esc(o.addr)}, ${esc(o.city)}</div><div class="timeline">${t("statuses").map((s,i)=>`<div class="${i<o.stage?"done":i===o.stage?"now":""}"><i>${i<o.stage?"✓":i+1}</i><div>${s}<small>${i<=o.stage?new Date(o.at+i*36e5*7).toLocaleString(S.lang==="ar"?"ar-EG":"en-EG",{dateStyle:"medium",timeStyle:"short"}):"—"}</small></div></div>`).join("")}</div>`:(no?`<div class="empty" style="margin-top:18px">${t("trackNone")}</div>`:"");
  return `<div class="wrap section" style="max-width:640px"><h1 style="font-size:36px">${t("trackTitle")}</h1><p style="color:var(--mute)">${t("trackSub")}</p><form data-form="track" class="two"><div class="field"><label>${t("orderNo")}</label><input name="no" value="${esc(no)}" required></div><div class="field"><label>${t("fPhone")}</label><input name="phone" value="${esc(ph)}" required inputmode="tel"></div><div><button class="btn">${t("trackBtn")}</button></div></form>${tl}</div>`;
};

PAGES.stores = ()=>`<div class="wrap section tight"><h1 style="font-size:40px;margin-bottom:6px">${t("storesPage")}</h1><p style="color:var(--mute);margin-bottom:22px">${t("storesSub")}</p><div class="stores">${STORES.map(storeCard).join("")}</div></div>`;

PAGES["size-guide"] = (params)=>{const kind=params.tab||"tops";const ch=SIZE_CHARTS[kind];return `<div class="wrap section tight" style="max-width:880px"><h1 style="font-size:40px">${t("sizeTitle")}</h1><p style="color:var(--mute)">${t("sizeSub")}</p><div class="tabs">${Object.entries(t("sizeTabs")).map(([k,v])=>`<button class="${k===kind?"on":""}" data-action="nav" data-href="#/size-guide?tab=${k}">${v}</button>`).join("")}</div><div class="acc"><table style="width:100%;border-collapse:collapse;font-size:15px"><tr>${(S.lang==="ar"?ch.colsAr:ch.cols).map(h=>`<th style="text-align:start;padding:10px 8px;border-bottom:2px solid var(--ink)">${h}</th>`).join("")}</tr>${ch.rows.map(r=>`<tr>${r.map(v=>`<td style="padding:10px 8px;border-bottom:1px solid var(--line)">${v}</td>`).join("")}</tr>`).join("")}</table></div><h3 style="margin:24px 0 8px">${t("howTo")}</h3><p>${t("howToText")}</p><p class="note">${fmt(t("model"),{s:kind==="denim"?"32":kind==="shoes"?"43":"L"})}</p></div>`};

const NAV = [["new","#/shop?tag=new"],["drops","#/drops"],["denim","#/shop?cat=denim"],["tops","#/shop?cat=tees"],["bottoms","#/shop?cat=sweatpants"],["outer","#/shop?cat=jackets"],["shoes","#/shop?cat=shoes"],["acc","#/shop?cat=accessories"],["sale","#/shop?sale=1"],["stores","#/stores"]];
function renderChrome(){
  document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.getElementById("langLabel").textContent=S.lang==="ar"?"English":"العربية";
  document.getElementById("langLabel2").textContent=S.lang==="ar"?"English":"العربية";

  document.getElementById("menuList").innerHTML=NAV.map(([k,h])=>`<a href="${h}" data-action="close-all">${t("nav."+k)} <span>→</span></a>`).join("")+`<div class="sub" style="padding-top:8px"><a href="#/size-guide" data-action="close-all">${t("sizeGuide")}</a><a href="#/track" data-action="close-all">${t("track")}</a><a href="#/faq" data-action="close-all">${t("faqTitle")}</a><a href="#/contact" data-action="close-all">${t("contactTitle")}</a></div>`;
  document.getElementById("searchInput").placeholder=t("searchHint");
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  const L=t("footLinks");
  document.getElementById("footerGrid").innerHTML=`<div><a class="logo" href="#/"><span class="mark"><i></i></span>COREWARE</a><p style="color:var(--mute);font-size:14px;margin-top:10px;max-width:34ch">${t("heroLead")}</p><p style="font-size:13px;margin-top:8px"><b>${t("paymentsLbl")}:</b></p><div class="pay-row">${["COD","VISA","MC","Meeza","Fawry","ValU","VF Cash","Apple Pay"].map(x=>`<span class="pay">${x}</span>`).join("")}</div></div>
  <div><h4>${t("footShop")}</h4>${NAV.slice(0,9).map(([k,h])=>`<a href="${h}">${t("nav."+k)}</a>`).join("")}</div>
  <div><h4>${t("footHelp")}</h4><a href="#/faq">${L.faq}</a><a href="#/size-guide">${L.size}</a><a href="#/policies?tab=returns">${L.ship}</a><a href="#/track">${L.track}</a><a href="#/contact">${L.contact}</a></div>
  <div><h4>${t("footCompany")}</h4><a href="#/about">${L.about}</a><a href="#/stores">${L.stores}</a><a href="#/contact">${L.careers}</a><a href="#/policies">${L.policies}</a><a href="#/admin">${L.admin}</a><h4 style="margin-top:16px">${t("newsTitle")}</h4><form class="news" data-form="news"><input type="email" required placeholder="you@example.com" aria-label="Email"><button class="btn sm">${t("subscribe")}</button></form></div>`;
  document.getElementById("footerBottom").innerHTML=`<span>${t("rights")}</span><span><a href="https://instagram.com/coreware.eg" target="_blank" rel="noopener">Instagram</a> · <a href="https://tiktok.com/@coreware.eg" target="_blank" rel="noopener">TikTok</a> · <a href="https://wa.me/201000000000" target="_blank" rel="noopener">WhatsApp</a></span>`;
  const path=location.hash.split("?")[0]||"#/";
  document.getElementById("dock").innerHTML=[["#/",t("home"),"<path d='M3 11 12 4l9 7v9H3z'/>"],["#/shop",t("shop"),"<path d='M4 7h16M4 12h16M4 17h10'/>"],["search",t("search"),"<circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/>"],["cart",t("cart"),"<path d='M6 7h12l1 13H5z'/><path d='M9 7a3 3 0 0 1 6 0'/>"],["#/account",t("account"),"<circle cx='12' cy='8' r='4'/><path d='M4 21a8 8 0 0 1 16 0'/>"]].map(([h,l,i])=>h.startsWith("#")?`<a href="${h}" class="${path===h?"active":""}"><svg viewBox="0 0 24 24">${i}</svg>${l}</a>`:`<button data-action="open-${h}"><svg viewBox="0 0 24 24">${i}</svg>${l}${h==="cart"&&cartCount()?`<span class="badge-count">${cartCount()}</span>`:""}</button>`).join("");

function updateCounts(){const c=document.getElementById("cartCount"),w=document.getElementById("wishCount");c.hidden=!cartCount();c.textContent=cartCount();w.hidden=!S.wish.length;w.textContent=S.wish.length;document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===location.hash))}
function renderCartDrawer(){document.getElementById("cartBody").innerHTML=S.cart.length?cartLines():`<div class="empty">${t("cartEmpty")}</div>`;document.getElementById("cartFoot").innerHTML=S.cart.length?`${cartSummary(false)}<a class="btn signal block" href="#/checkout" data-action="close-all" style="margin-top:12px">${t("checkout")}</a>`:`<a class="btn block" href="#/shop" data-action="close-all">${t("continueShop")}</a>`}

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){const h=location.hash||"#/";const [path,qs]=h.slice(1).split("?");const params={};if(qs)qs.split("&").forEach(kv=>{const [k,v]=kv.split("=");params[decodeURIComponent(k)]=decodeURIComponent(v||"")});const parts=path.split("/").filter(Boolean);return {page:parts[0]||"home",id:parts[1],params}}
let lastPage="";
function render(){
  const {page,id,params}=parseHash();
  if(page==="shop"&&lastPage!=="shop"&&!Object.keys(params).length)S.filters={cat:[],fit:[],size:[],price:null,stock:false,sale:false,sort:"featured",q:""};
  if(page==="shop"&&Object.keys(params).length)S.filters={cat:[],fit:[],size:[],price:null,stock:false,sale:false,sort:"featured",q:""};
  if(page==="product"&&lastPage!=="product"){S.pdp={color:null,size:null}}
  if(page==="product"&&id&&PRODUCTS.find(p=>p.id===id)){S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,8);store.set("recent",S.recent)}
  const fn=PAGES[page]||PAGES.notfound;
  const app=document.getElementById("app");
  app.innerHTML=fn(params,id);
  renderChrome();
  if(lastPage!==page||page!=="shop")window.scrollTo({top:0,behavior:"instant"});
  const titles={home:"",shop:t("shop"),product:id&&PRODUCTS.find(p=>p.id===id)?pname(PRODUCTS.find(p=>p.id===id)):"",cart:t("cart"),checkout:t("checkout"),stores:t("storesPage"),faq:t("faqTitle"),contact:t("contactTitle"),about:t("aboutTitle"),track:t("trackTitle"),wishlist:t("wishlist"),account:t("account"),admin:t("adminTitle"),"size-guide":t("sizeTitle"),policies:t("policyTitle"),drops:t("dropTitle")};
  document.title=(titles[page]?titles[page]+" — ":"")+"Coreware";
  lastPage=page;
}
window.addEventListener("hashchange",render);

/* ============================================================
   ACTIONS
   ============================================================ */
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200)}
function openPanel(id){closeAll();document.getElementById("overlay").classList.add("open");document.getElementById(id).classList.add("open");if(id==="searchPanel")setTimeout(()=>document.getElementById("searchInput").focus(),50);if(id==="cartDrawer")renderCartDrawer();document.body.style.overflow="hidden"}
function closeAll(){["overlay","searchPanel","cartDrawer","menuDrawer","modal"].forEach(i=>document.getElementById(i).classList.remove("open"));document.getElementById("filters")?.classList.remove("open");document.body.style.overflow=""}
function openModal(html){closeAll();document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.add("open");document.body.style.overflow="hidden"}
function addToCart(id,color,size,qty=1){const p=PRODUCTS.find(x=>x.id===id);const avail=stockOf(p,color,size);if(!avail){toast(t("soldOut"));return}const line=S.cart.find(l=>l.id===id&&l.color===color&&l.size===size);if(line){line.qty=Math.min(avail,line.qty+qty)}else S.cart.push({id,color,size,qty,price:p.price});store.set("cart",S.cart);toast(`✓ ${t("added")} · ${pname(p)} ${size!=="ONE"?size:""}`);updateCounts();renderChrome();if(location.hash.startsWith("#/cart"))render();openPanel("cartDrawer")}
function persist(){store.set("cart",S.cart);store.set("wish",S.wish);store.set("notify",S.notify);store.set("orders",S.orders);store.set("user",S.user);store.set("news",S.news);store.set("gov",S.gov);store.set("promo",S.promo);store.set("lang",S.lang)}

document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip[data-filter]");
  if(chip){const f=chip.dataset.filter,v=chip.dataset.value;const arr=S.filters[f];const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);render();return}
  const a=e.target.closest("[data-action]"); if(!a)return;
  const act=a.dataset.action, d=a.dataset;
  switch(act){
    case "toggle-lang": S.lang=S.lang==="ar"?"en":"ar"; persist(); render(); closeAll(); break;
    case "open-search": openPanel("searchPanel"); break;
    case "open-cart": openPanel("cartDrawer"); break;
    case "open-menu": openPanel("menuDrawer"); break;
    case "close-all": closeAll(); break;
    case "close-modal": closeAll(); break;
    case "open-filters": document.getElementById("filters").classList.add("open"); document.body.style.overflow="hidden"; break;
    case "close-filters": document.getElementById("filters").classList.remove("open"); document.body.style.overflow=""; break;
    case "nav": location.hash=d.href; break;
    case "toast": toast(d.msg); break;
    case "wish": {const i=S.wish.indexOf(d.id); if(i>=0){S.wish.splice(i,1);toast(t("wishRemoved"))}else{S.wish.push(d.id);toast("♥ "+t("wishAdded"))} persist(); a.classList.toggle("on"); a.setAttribute("aria-pressed",S.wish.includes(d.id)); updateCounts(); if(location.hash.startsWith("#/wishlist"))render(); break;}
    case "quick-add": e.preventDefault(); addToCart(d.id,d.color,d.size); break;
    case "add": if(!d.size){toast(t("selectSize"));document.querySelector(".sizes-grid")?.scrollIntoView({behavior:"smooth",block:"center"});return} addToCart(d.id,d.color,d.size); break;
    case "pdp-color": S.pdp.color=d.value; S.pdp.size=null; render(); break;
    case "pdp-size": if(a.getAttribute("aria-disabled")==="true"){S.pdp.size=d.value;render();return} S.pdp.size=d.value; render(); break;
    case "notify": {S.notify.push({id:d.id,color:d.color,size:d.size,at:Date.now()}); persist(); openModal(`<h3>${t("notify")}</h3><p style="color:var(--mute)">${PRODUCTS.find(p=>p.id===d.id)&&pname(PRODUCTS.find(p=>p.id===d.id))} · ${cname(d.color)} · ${d.size}</p><form data-form="notify"><div class="field"><label>${t("fPhone")}</label><input name="phone" required inputmode="tel" value="${S.user?.phone||""}"></div><button class="btn block">${t("notify")}</button></form>`); break;}
    case "open-size-guide": {const ch=SIZE_CHARTS[d.kind]; openModal(`<h3>${t("sizeTitle")}</h3><p style="color:var(--mute);font-size:14px">${t("sizeSub")}</p><table class="table"><tr>${(S.lang==="ar"?ch.colsAr:ch.cols).map(h=>`<th>${h}</th>`).join("")}</tr>${ch.rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table><p style="font-size:14px;margin-top:12px"><b>${t("howTo")}:</b> ${t("howToText")}</p>`); break;}
    case "qty": {const l=S.cart[+d.i]; const p=PRODUCTS.find(x=>x.id===l.id); l.qty=Math.max(0,Math.min(stockOf(p,l.color,l.size),l.qty+ +d.d)); if(!l.qty)S.cart.splice(+d.i,1); persist(); renderCartDrawer(); if(/#\/(cart|checkout)/.test(location.hash))render(); else renderChrome(); break;}
    case "remove": S.cart.splice(+d.i,1); persist(); renderCartDrawer(); if(/#\/(cart|checkout)/.test(location.hash))render(); else renderChrome(); break;
    case "co-back": S.checkout.step=Math.max(0,S.checkout.step-1); render(); break;
    case "co-next": S.checkout.step++; render(); break;
    case "co-pay": S.checkout.pay=a.value; render(); break;
    case "place-order": {const C=S.checkout,dd=C.data; const sub=cartTotal(),dc=discount(sub),fee=shipFee(sub-dc),cod=C.pay==="cod"?COD_FEE:0; const g=gov(); const no=String(Math.floor(100000+Math.random()*900000));
      // decrement stock
      S.cart.forEach(l=>{const p=PRODUCTS.find(x=>x.id===l.id);p.stock[l.color][l.size]=Math.max(0,p.stock[l.color][l.size]-l.qty)});
      S.orders.push({no,name:dd.name,phone:dd.phone,email:dd.email,addr:dd.addr,city:dd.city,gov:g[1],govAr:g[2],eta:g[4],etaAr:g[5],pay:C.pay,lines:S.cart,total:sub-dc+fee+cod,at:Date.now(),stage:0});
      S.cart=[]; S.promo=null; S.checkout={step:0,data:{},pay:"cod"}; persist(); location.hash="#/thanks/"+no; break;}
    case "advance": {const o=S.orders.find(x=>x.no===d.no); if(o)o.stage=Math.min(4,o.stage+1); persist(); render(); break;}
    case "logout": S.user=null; persist(); render(); break;
    case "clear-filters": S.filters={cat:[],fit:[],size:[],price:null,stock:false,sale:false,sort:"featured",q:""}; location.hash="#/shop"; render(); break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.action==="gov"){S.gov=el.value;persist();render();return}
  if(el.dataset.filter){const f=el.dataset.filter;const F=S.filters;
    if(f==="cat"){const i=F.cat.indexOf(el.value);el.checked?(i<0&&F.cat.push(el.value)):(i>=0&&F.cat.splice(i,1))}
    else if(f==="price"){const [a,b]=el.value.split("-").map(Number);F.price=[a,b]}
    else if(f==="stock")F.stock=el.checked; else if(f==="sale")F.sale=el.checked; else if(f==="sort")F.sort=el.value;
    render();}
});
document.addEventListener("submit",e=>{
  const f=e.target; if(!f.dataset.form)return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());
  // simple validation
  let ok=true; f.querySelectorAll(".field").forEach(fl=>{const inp=fl.querySelector("input,textarea,select");if(!inp)return;const bad=(inp.required&&!inp.value.trim())||(inp.pattern&&inp.value&&!new RegExp(inp.pattern).test(inp.value));fl.classList.toggle("invalid",!!bad);if(bad)ok=false});
  if(!ok)return;
  switch(f.dataset.form){
    case "news": if(!S.news.includes(fd.email))S.news.push(fd.email); persist(); f.reset(); toast("✓ "+t("subscribed")); break;
    case "promo": {const code=(f.querySelector("input").value||"").trim().toUpperCase(); if(code==="CORE10"){S.promo=code;toast("✓ "+t("promoOk"))}else if(code===""){S.promo=null}else{toast(t("promoBad"))} persist(); renderCartDrawer(); if(/#\/(cart|checkout)/.test(location.hash))render(); break;}
    case "co-contact": Object.assign(S.checkout.data,fd); S.checkout.step=1; render(); break;
    case "co-delivery": Object.assign(S.checkout.data,fd); S.gov=fd.gov; persist(); S.checkout.step=2; render(); break;
    case "track": location.hash=`#/track?no=${encodeURIComponent(fd.no.trim().replace("#",""))}&phone=${encodeURIComponent(fd.phone.trim())}`; break;
    case "contact": f.reset(); toast("✓ "+t("sent")); break;
    case "login": S.user={name:fd.name,phone:fd.phone}; persist(); render(); break;
    case "notify": {const last=S.notify[S.notify.length-1]; if(last)last.phone=fd.phone; persist(); closeAll(); toast("✓ "+t("notifyOk")); break;}
  }
});
// search
document.getElementById("searchInput").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase(); const res=document.getElementById("searchResults"), hint=document.getElementById("searchHint");
  if(q.length<2){res.innerHTML="";hint.textContent=t("searchHint");return}
  const list=PRODUCTS.filter(p=>[p.name,p.nameAr,p.cat,p.fit,t("cats."+p.cat),t("fits."+p.fit),...p.colors.map(cname),...p.sizes].join(" ").toLowerCase().includes(q)).slice(0,8);
  hint.innerHTML=list.length?`${list.length} ${t("results")} · <a href="#/shop?q=${encodeURIComponent(q)}" data-action="close-all" style="text-decoration:underline">${t("viewAll")}</a>`:t("searchNone");
  res.innerHTML=list.map(card).join("");
});
document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter"){location.hash="#/shop?q="+encodeURIComponent(e.target.value.trim());closeAll()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
// close panels on navigation
window.addEventListener("hashchange",()=>{closeAll()});

/* boot */
render();
</script>
</body>
</html>
