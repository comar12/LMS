const els = {};

/* ---------- Clipboard ---------- */
function cleanCopy(text) {
  return String(text || '')
    .replace(/\r\n?/g, '\n')
    .replace(/ /g, ' ')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function legacyCopy(text) {
  const active = document.activeElement;
  const selection = document.getSelection();
  const ranges = [];
  if (selection) for (let i = 0; i < selection.rangeCount; i++) ranges.push(selection.getRangeAt(i));
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.setAttribute('aria-hidden', 'true');
  ta.tabIndex = -1;
  ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;padding:0;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(ta);
  let ok = false;
  try {
    ta.focus({ preventScroll: true });
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  ta.remove();
  try {
    if (selection) {
      selection.removeAllRanges();
      ranges.forEach((r) => selection.addRange(r));
    }
  } catch (e) {
    /* ignore */
  }
  if (active && typeof active.focus === 'function' && active !== document.body) active.focus({ preventScroll: true });
  return ok;
}

async function writeClipboard(text) {
  const api = navigator.clipboard;
  if (api && typeof api.writeText === 'function' && window.isSecureContext) {
    try {
      await api.writeText(text);
      return true;
    } catch (e) {
      /* fall back below */
    }
  }
  return legacyCopy(text);
}

/** Copy plain text. Shows "Copied" on the button, or a selectable fallback if the browser blocks it. */
async function copyText(text, opts = {}) {
  const clean = cleanCopy(text);
  if (!clean) {
    toast(opts.emptyMessage || 'There is nothing to copy yet.', { type: 'warn' });
    return false;
  }
  const ok = await writeClipboard(clean);
  if (ok) {
    if (opts.button) flashCopied(opts.button);
    else toast(`${opts.label || 'Text'} copied`);
    announce(`${opts.label || 'Text'} copied to clipboard.`);
    if (opts.afterCopy) opts.afterCopy();
    return true;
  }
  showCopyFallback(clean, opts.label);
  return false;
}

function flashCopied(btn) {
  const label = btn.querySelector('.btn__label');
  const svg = btn.querySelector('svg');
  if (!btn._orig) btn._orig = { label: label ? label.textContent : '', icon: svg ? svg.querySelector('use').getAttribute('href') : '' };
  clearTimeout(btn._copyTimer);
  btn.classList.add('is-copied');
  if (label) label.textContent = 'Copied';
  if (svg) setIcon(svg, 'check');
  btn._copyTimer = setTimeout(() => {
    btn.classList.remove('is-copied');
    if (label) label.textContent = btn._orig.label;
    if (svg) setUseHref(svg.querySelector('use'), btn._orig.icon);
  }, 1800);
}

function showCopyFallback(text, label) {
  const ta = h('textarea', { class: 'textarea copy-fallback', readonly: true, 'aria-label': 'Text to copy', value: text });
  const selectBtn = h('button', { type: 'button', class: 'btn btn--primary', onclick: () => { ta.focus(); ta.select(); } }, icon('copy'), 'Select all');
  const m = openModal({
    title: 'Copy manually',
    size: 'md',
    body: [
      h('p', { class: 'notice', role: 'alert' }, icon('info'), h('span', { class: 'notice__body' }, `Your browser blocked automatic copying${label ? ' of ' + label : ''}. The text is selected below. Press Ctrl+C (or Cmd+C on a Mac) to copy it.`)),
      h('div', { style: 'margin-top:12px' }, ta),
    ],
    footer: [h('button', { type: 'button', class: 'btn', onclick: () => m.close() }, 'Done'), selectBtn],
    initialFocus: ta,
  });
  setTimeout(() => ta.select(), 30);
}

function copyButton(getText, opts = {}) {
  const { label = 'Copy', srLabel, primary = false, size = 'sm', fk, emptyMessage } = opts;
  const btn = h(
    'button',
    {
      type: 'button',
      class: `btn copy-btn${size === 'sm' ? ' btn--sm' : ''}${size === 'lg' ? ' btn--lg' : ''}${primary ? ' btn--primary' : ''}`,
      'aria-label': srLabel || label,
      'data-fk': fk,
    },
    icon('copy'),
    h('span', { class: 'btn__label', text: label })
  );
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const text = typeof getText === 'function' ? getText() : getText;
    copyText(text, { button: btn, label: srLabel || label, emptyMessage });
  });
  return btn;
}

/* ---------- Announcements & toasts ---------- */
function announce(msg) {
  const el = els.announcer;
  if (!el) return;
  el.textContent = '';
  setTimeout(() => {
    el.textContent = msg;
  }, 40);
}

function toast(msg, opts = {}) {
  const { type = 'ok', duration = 2600, action } = opts;
  const region = els.toasts;
  if (!region) return;
  const el = h('div', { class: `toast toast--${type}` }, icon(type === 'error' ? 'alert' : type === 'warn' ? 'info' : 'check'), h('span', null, msg));
  const remove = () => {
    if (!el.isConnected) return;
    el.classList.add('is-leaving');
    setTimeout(() => el.remove(), 220);
  };
  if (action) {
    el.appendChild(
      h('button', { type: 'button', onclick: () => { action.fn(); remove(); } }, action.label)
    );
  }
  region.appendChild(el);
  while (region.children.length > 3) region.firstElementChild.remove();
  setTimeout(remove, action ? Math.max(duration, 6000) : duration);
}

/* ---------- Inert management (modals, overlay panel, mobile navigation) ---------- */
const modalStack = [];
const mqDock = window.matchMedia('(min-width: 1360px)');
const mqNarrow = window.matchMedia('(max-width: 1023px)');

function isPanelOverlay() {
  return !!state.ui.openId && !mqDock.matches;
}

function syncInert() {
  const modal = modalStack.length > 0;
  const navOpen = els.app && els.app.classList.contains('nav-open') && mqNarrow.matches;
  const overlay = isPanelOverlay();
  const setInert = (el, on) => {
    if (!el) return;
    if (on) el.setAttribute('inert', '');
    else el.removeAttribute('inert');
  };
  setInert(els.app, modal);
  if (modal) return;
  setInert(els.sidebar, overlay && !navOpen);
  setInert(els.workspace, overlay || navOpen);
  setInert(els.panel, navOpen);
  if (els.panel) {
    if (overlay) {
      els.panel.setAttribute('role', 'dialog');
      els.panel.setAttribute('aria-modal', 'true');
    } else {
      els.panel.setAttribute('role', 'region');
      els.panel.removeAttribute('aria-modal');
    }
  }
}

function trapTab(e, container) {
  const items = focusableIn(container);
  if (!items.length) {
    e.preventDefault();
    return;
  }
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !container.contains(document.activeElement))) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

/* ---------- Modals ---------- */
function openModal({ title, body, footer, size = 'md', onClose, initialFocus, backdropClose = true }) {
  const previous = document.activeElement;
  const titleId = uid('modal-title');
  const closeBtn = h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close dialog' }, icon('x'));
  const dialog = h(
    'div',
    { class: `modal modal--${size}`, role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId, tabindex: '-1' },
    h('div', { class: 'modal__head' }, h('h2', { class: 'modal__title', id: titleId, text: title }), closeBtn),
    h('div', { class: 'modal__body' }, body),
    footer ? h('div', { class: 'modal__foot' }, footer) : null
  );
  const backdrop = h('div', { class: 'modal-backdrop' }, dialog);
  let closed = false;
  const api = {
    el: dialog,
    close(result) {
      if (closed) return;
      closed = true;
      backdrop.remove();
      const i = modalStack.indexOf(api);
      if (i >= 0) modalStack.splice(i, 1);
      syncInert();
      if (onClose) onClose(result);
      if (previous && previous.isConnected && typeof previous.focus === 'function') previous.focus({ preventScroll: true });
    },
  };
  closeBtn.addEventListener('click', () => api.close());
  if (backdropClose) backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) api.close(); });
  dialog.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      api.close();
    } else if (e.key === 'Tab') trapTab(e, dialog);
  });
  els.modalRoot.appendChild(backdrop);
  // Text-only dialogs need a focusable scroll area so keyboard users can scroll them.
  const bodyEl = dialog.querySelector('.modal__body');
  if (bodyEl && !focusableIn(bodyEl).length) {
    bodyEl.setAttribute('tabindex', '0');
    bodyEl.setAttribute('role', 'document');
  }
  modalStack.push(api);
  syncInert();
  requestAnimationFrame(() => {
    let target = typeof initialFocus === 'string' ? dialog.querySelector(initialFocus) : initialFocus;
    if (!target) target = focusableIn(dialog.querySelector('.modal__body'))[0] || closeBtn;
    (target || dialog).focus({ preventScroll: true });
  });
  return api;
}

function confirmDialog({ title, message, confirmLabel = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    let result = false;
    const cancel = h('button', { type: 'button', class: 'btn' }, 'Cancel');
    const ok = h('button', { type: 'button', class: `btn ${danger ? 'btn--danger' : 'btn--primary'}` }, confirmLabel);
    const m = openModal({
      title,
      size: 'sm',
      body: h('p', { class: 'prose' }, message),
      footer: [cancel, ok],
      initialFocus: danger ? cancel : ok,
      onClose: () => resolve(result),
    });
    cancel.addEventListener('click', () => m.close());
    ok.addEventListener('click', () => {
      result = true;
      m.close();
    });
  });
}

function promptDialog({ title, label, value = '', hint, confirmLabel = 'Save', maxLength = 80 }) {
  return new Promise((resolve) => {
    let result = null;
    const inputId = uid('prompt');
    const input = h('input', { class: 'input', id: inputId, type: 'text', value, maxlength: String(maxLength), autocomplete: 'off' });
    const warn = h('div');
    const err = h('p', { class: 'field__error', hidden: true }, 'Enter a name.');
    const update = () => {
      warn.replaceChildren();
      const note = piiNote(input.value);
      if (note) warn.appendChild(note);
    };
    input.addEventListener('input', () => {
      err.hidden = true;
      update();
    });
    const cancel = h('button', { type: 'button', class: 'btn' }, 'Cancel');
    const ok = h('button', { type: 'button', class: 'btn btn--primary' }, confirmLabel);
    const submit = () => {
      const v = input.value.trim();
      if (!v) {
        err.hidden = false;
        input.focus();
        return;
      }
      result = v;
      m.close();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });
    const m = openModal({
      title,
      size: 'sm',
      body: h('div', { class: 'field' }, h('label', { class: 'field__label', for: inputId }, label), input, hint ? h('p', { class: 'field__hint' }, hint) : null, err, warn),
      footer: [cancel, ok],
      initialFocus: input,
      onClose: () => resolve(result),
    });
    cancel.addEventListener('click', () => m.close());
    ok.addEventListener('click', submit);
    setTimeout(() => input.select(), 30);
  });
}

/* ---------- Combobox (ARIA 1.2 pattern) ---------- */
function combobox({ id, label, placeholder, getItems, onSelect }) {
  const listId = id + '-list';
  const input = h('input', {
    class: 'input combo__input',
    id,
    type: 'text',
    role: 'combobox',
    'aria-autocomplete': 'list',
    'aria-expanded': 'false',
    'aria-controls': listId,
    autocomplete: 'off',
    spellcheck: 'false',
    placeholder,
    'data-fk': 'combo:' + id,
  });
  const list = h('ul', { class: 'combo__list', id: listId, role: 'listbox', 'aria-label': label, hidden: true });
  let items = [];
  let active = -1;
  let open = false;

  const optId = (i) => `${id}-opt-${i}`;
  function renderList() {
    list.replaceChildren();
    if (!items.length) {
      list.appendChild(h('li', { class: 'combo__empty', role: 'presentation' }, 'No matches'));
      return;
    }
    items.forEach((it, i) => {
      list.appendChild(
        h(
          'li',
          {
            class: 'combo__opt',
            id: optId(i),
            role: 'option',
            'aria-selected': i === active ? 'true' : 'false',
            'aria-disabled': it.disabled ? 'true' : null,
            dataset: { i: String(i) },
          },
          it.dotCat ? h('span', { class: `chip__dot cat-${it.dotCat}`, style: 'color:var(--cc)' }) : null,
          h('span', { class: 'combo__opt-title' }, it.title),
          it.sub ? h('span', { class: 'combo__opt-sub' }, it.sub) : null
        )
      );
    });
  }
  function setActive(i) {
    active = i;
    $$('[role="option"]', list).forEach((li, idx) => li.setAttribute('aria-selected', idx === active ? 'true' : 'false'));
    if (active >= 0) {
      input.setAttribute('aria-activedescendant', optId(active));
      const li = document.getElementById(optId(active));
      if (li) li.scrollIntoView({ block: 'nearest' });
    } else input.removeAttribute('aria-activedescendant');
  }
  function refresh() {
    items = getItems(input.value).slice(0, 60);
    active = items.findIndex((it) => !it.disabled);
    renderList();
    setActive(active);
  }
  function show() {
    if (open) return;
    open = true;
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }
  function hide() {
    open = false;
    list.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function choose(i) {
    const it = items[i];
    if (!it || it.disabled) return;
    input.value = '';
    hide();
    onSelect(it.id);
  }
  input.addEventListener('focus', () => {
    refresh();
    show();
  });
  input.addEventListener('input', () => {
    refresh();
    show();
  });
  input.addEventListener('blur', () => setTimeout(hide, 120));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!open) {
        refresh();
        show();
        return;
      }
      let i = active;
      do i = Math.min(items.length - 1, i + 1); while (items[i] && items[i].disabled && i < items.length - 1);
      setActive(i);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      let i = active;
      do i = Math.max(0, i - 1); while (items[i] && items[i].disabled && i > 0);
      setActive(i);
    } else if (e.key === 'Enter') {
      if (open && active >= 0) {
        e.preventDefault();
        choose(active);
      }
    } else if (e.key === 'Escape') {
      if (open) {
        e.preventDefault();
        e.stopPropagation();
        hide();
      }
    }
  });
  list.addEventListener('mousedown', (e) => e.preventDefault());
  list.addEventListener('click', (e) => {
    const li = e.target.closest('[role="option"]');
    if (li) choose(Number(li.dataset.i));
  });
  return h('div', { class: 'combo' }, h('label', { class: 'sr-only', for: id }, label), icon('search', 'combo__icon'), input, list);
}

function stepper({ id, label, value, min, max, onChange }) {
  const input = h('input', { type: 'number', id, inputmode: 'numeric', min: String(min), max: String(max), value: String(value), 'data-fk': 'step:' + id, 'aria-label': label });
  let current = value;
  const commit = (v) => {
    const n = clampInt(v, min, max, current);
    input.value = String(n);
    if (n !== current) {
      current = n;
      onChange(n);
    }
  };
  input.addEventListener('change', () => commit(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      commit(input.value);
    }
  });
  return h(
    'div',
    { class: 'stepper' },
    h('button', { type: 'button', 'aria-label': `Decrease ${label}`, 'data-fk': `step-dec:${id}`, disabled: value <= min, onclick: () => commit(current - 1) }, icon('chev-left', 'icon--sm')),
    input,
    h('button', { type: 'button', 'aria-label': `Increase ${label}`, 'data-fk': `step-inc:${id}`, disabled: value >= max, onclick: () => commit(current + 1) }, icon('chev-right', 'icon--sm'))
  );
}

/* Simple disclosure menu */
function menuButton({ label, iconName = 'more', items, fk }) {
  const menuId = uid('menu');
  const btn = h('button', { type: 'button', class: 'btn btn--sm', 'aria-haspopup': 'true', 'aria-expanded': 'false', 'aria-controls': menuId, 'data-fk': fk }, icon(iconName), h('span', { class: 'btn__label' }, label));
  const menu = h('div', { class: 'menu', id: menuId, hidden: true });
  const wrap = h('div', { class: 'menu-wrap' }, btn, menu);
  const close = (focusBtn) => {
    menu.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', outside, true);
    if (focusBtn) btn.focus();
  };
  const outside = (e) => {
    if (!wrap.contains(e.target)) close(false);
  };
  items.forEach((it) => {
    const b = h('button', { type: 'button', class: 'menu__item' }, it.icon ? icon(it.icon) : null, it.label);
    b.addEventListener('click', () => {
      close(true);
      it.onSelect(btn);
    });
    menu.appendChild(b);
  });
  btn.addEventListener('click', () => {
    if (!menu.hidden) return close(false);
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('mousedown', outside, true);
    const first = menu.querySelector('.menu__item');
    if (first) first.focus();
  });
  menu.addEventListener('keydown', (e) => {
    const list = $$('.menu__item', menu);
    const i = list.indexOf(document.activeElement);
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      close(true);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      list[(i + 1) % list.length].focus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      list[(i - 1 + list.length) % list.length].focus();
    } else if (e.key === 'Tab') close(false);
  });
  return wrap;
}

function renderLibrary(main) {
  const view = state.ui.view;

  let base = content.opps;
  if (cat) base = base.filter((o) => o.cat === cat.id);
  if (view === 'favorites') base = base.filter((o) => state.favorites.has(o.id));
  const scopeCount = base.length;
  if (state.prefs.kpi) base = base.filter((o) => (o.kpi || []).includes(state.prefs.kpi));
  const search = q ? searchList(base, q) : { results: base.map((item) => ({ item, score: 0 })), partial: false, tokens: [] };

  if (state.prefs.sort === 'az') items = items.slice().sort((a, b) => a.title.localeCompare(b.title));
  else if (state.prefs.sort === 'category') items = items.slice().sort((a, b) => catOrder(a.cat) - catOrder(b.cat));

    eyebrow = [h('span', { class: `group__icon cat-${cat.id}`, style: 'width:22px;height:22px;border-radius:6px' }, icon(CAT_ICON[cat.id], 'icon--sm')), 'Category'];

    title = 'Favorites';

  }
  main.append(pageHead({ eyebrow, title, sub }), libraryToolbar());

  if (cat && (cat.id === 'hold' || cat.id === 'sales')) main.append(refCard(cat.id));

  if (q) {
    const meta = h('p', { class: 'result-meta', role: 'status' });
    if (items.length) {
      meta.append(h('strong', null, plural(items.length, 'result')), ` for “${q}”`, search.partial ? ' (partial matches)' : '');
    } else {
      meta.append(`No results for “${q}”`);

    if (view !== 'all') {
      meta.append(' · ', h('button', { type: 'button', class: 'btn btn--ghost btn--sm', style: 'display:inline-flex;vertical-align:middle', onclick: () => navigate('all') }, 'Search all opportunities'));
    }
    main.append(meta);
  }

  if (!items.length) {
    if (view === 'favorites' && !scopeCount) {
      main.append(emptyState({ iconName: 'star', title: 'No favorites yet', text: 'Star the opportunities you coach most often and they will appear here.', action: h('a', { class: 'btn', href: '#/all' }, 'Browse all opportunities') }));
    } else {
      main.append(
        emptyState({
          iconName: 'search',
          title: 'Nothing matches yet',
          text: q ? 'Try a different word, such as "silence", "probing", "tone", "transfer", or "billing". You can also clear the KPI filter.' : 'No opportunities match the current KPI filter.',
          action: h('button', { type: 'button', class: 'btn', onclick: () => { state.ui.query = ''; state.prefs.kpi = ''; persist('prefs'); refresh(); } }, 'Clear search and filters'),
        })
      );
    }

  }

  if (view === 'all' && !q && state.prefs.sort === 'relevance') {
    for (const c of CATS) {
      const list = items.filter((o) => o.cat === c.id);
      if (!list.length) continue;
      main.append(
        h(
          'section',
          { class: `group cat-${c.id}`, 'aria-labelledby': `grp-${c.id}` },

          ),
          cardGrid(list, [])

      );
    }
  } else {
    main.append(h('h2', { class: 'sr-only' }, q ? 'Search results' : 'Coaching opportunities'), cardGrid(items, search.tokens));
  }
}

  }

function titleForView() {

  return { all: 'All Opportunities', strengths: 'Things Went Well', 'sales-toolkit': 'Sales Toolkit', favorites: 'Favorites', builder: 'Coaching Builder', templates: 'My Templates', settings: 'Settings & Data' }[v] || 'Library';
}

/** Re-render everything that depends on state, keeping focus and scroll where they were. */
let refreshing = false;
let refreshQueued = null;
function refresh(opts = {}) {
  if (refreshing) {
    // A blur/change event fired while the page was being replaced; re-render once the current pass ends.
    refreshQueued = { main: (refreshQueued && refreshQueued.main) || opts.main !== false, panel: true };
    return;
  }
  refreshing = true;
  try {
    refreshNow(opts);
  } finally {
    refreshing = false;
  }
  if (refreshQueued) {
    const next = refreshQueued;
    refreshQueued = null;
    Promise.resolve().then(() => refresh(next));
  }
}

function refreshNow(opts) {
  const { main = true, panel = true } = opts;
  const active = document.activeElement;
  const fk = active && active.getAttribute ? active.getAttribute('data-fk') : null;
  renderSidebar();
  updateTopbar();
  if (main) renderMain();
  if (panel && state.ui.openId) renderPanel({ keepScroll: true });
  if (fk && (!active.isConnected || active !== document.activeElement)) focusByKey(fk);
}

/** Focus the element carrying a focus key; falls back to a sibling input when the button became disabled. */
function focusByKey(fk, root = document) {
  const target = root.querySelector(`[data-fk="${cssEscape(fk)}"]`);
  if (!target) return false;
  if (target.disabled) {
    const alt = target.closest('.stepper') ? target.closest('.stepper').querySelector('input') : null;
    if (alt) alt.focus({ preventScroll: true });
    return !!alt;
  }
  target.focus({ preventScroll: true });
  return true;
}

   06-panel: coaching detail panel (docked on wide screens, overlay elsewhere)
   ========================================================================== */

function openOpp(id) {
  if (!getOpp(id)) return;
  state.ui.returnFocusKey = `open:${id}`;
  navigate(state.ui.view, { cat: state.ui.cat, open: id });
}

function closePanel() {
  navigate(state.ui.view, { cat: state.ui.cat, open: null });
}

function showPanel() {
  els.app.classList.add('panel-open');
  renderPanel();
  syncInert();
  focusSoon($('#panelTitle'));
  $$('.opp-card.is-active').forEach((c) => c.classList.remove('is-active'));
  const card = document.querySelector(`.opp-card[data-id="${cssEscape(state.ui.openId)}"]`);
  if (card) card.classList.add('is-active');
}

function hidePanel() {
  const wasOpen = els.app.classList.contains('panel-open');
  els.app.classList.remove('panel-open');
  $$('.opp-card.is-active').forEach((c) => c.classList.remove('is-active'));
  syncInert();
  setTimeout(() => {
    if (!state.ui.openId) els.panel.replaceChildren();
  }, 280);
  if (wasOpen && state.ui.returnFocusKey) {
    const target = document.querySelector(`[data-fk="${cssEscape(state.ui.returnFocusKey)}"]`);
    if (target) target.focus({ preventScroll: true });
    else els.main.focus({ preventScroll: true });
  }
}

function panelSiblings() {
  const ids = state.ui.visibleIds && state.ui.visibleIds.includes(state.ui.openId) ? state.ui.visibleIds : content.opps.map((o) => o.id);
  const i = ids.indexOf(state.ui.openId);
  return { ids, i };
}

function stepPanel(delta) {
  const { ids, i } = panelSiblings();
  if (i < 0) return;
  const next = ids[i + delta];
  if (next) {
    state.ui.returnFocusKey = `open:${next}`;
    navigate(state.ui.view, { cat: state.ui.cat, open: next, replace: true });
  }
}

/* ---------- Strength selection (shared with the Builder) ---------- */
function isStrengthSelected(id) {
  return state.builder.strengths.some((s) => s.id === id);
}

function toggleStrength(id, version) {
  const s = getStrength(id);
  if (!s) return;
  const list = state.builder.strengths;
  const i = list.findIndex((x) => x.id === id);
  if (i >= 0) {
    list.splice(i, 1);
    announce(`${s.title} removed from observed strengths.`);
  } else {
    const v = typeof version === 'number' ? version : state.ui.sVersion[id] || 0;
    list.push({ id, v: Math.min(v, s.v.length - 1) });
    announce(`${s.title} marked as observed.`);
  }
  persist('builder');
  refresh();
}

function setStrengthVersion(id, v) {
  const s = getStrength(id);
  if (!s) return;
  const vv = Math.max(0, Math.min(v, s.v.length - 1));
  state.ui.sVersion[id] = vv;
  const sel = state.builder.strengths.find((x) => x.id === id);
  if (sel) {
    sel.v = vv;
    persist('builder');
  }
  refresh();
}

function versionSwitch(s, current, fkPrefix) {
  if (!s.v || s.v.length < 2) return null;
  return h(
    'div',
    { class: 'version-switch', role: 'group', 'aria-label': `Wording versions for ${s.title}` },
    s.v.map((_, i) =>
      h(
        'button',
        {
          type: 'button',
          'aria-pressed': String(i === current),
          'aria-label': `Version ${i + 1}`,
          title: `Version ${i + 1}`,
          'data-fk': `${fkPrefix}:${s.id}:${i}`,
          onclick: () => setStrengthVersion(s.id, i),
        },
        String(i + 1)
      )
    )
  );
}

function strengthToggleChip(id, fkPrefix) {
  const s = getStrength(id);
  if (!s) return null;
  const on = isStrengthSelected(id);
  return h(
    'button',
    {
      type: 'button',
      class: 's-chip',
      'aria-pressed': String(on),
      'data-fk': `${fkPrefix}:${id}`,
      title: s.desc || s.title,
      onclick: () => toggleStrength(id),
    },
    icon(on ? 'check' : 'plus'),
    s.title
  );
}

    body.push(
      h(
        'div',

              h('span', { class: 'sel-strength__title' }, s.title),

    letter: 'A',

const SALES = DATA.salesToolkit;
const SALES_TABS = [
  { id: 'review', label: 'Call review', icon: 'clipboard' },
  { id: 'flow', label: 'Sales flow', icon: 'trend' },
  { id: 'offers', label: 'Offer guides', icon: 'tag' },
  { id: 'objections', label: 'Objections', icon: 'chat' },
  { id: 'signals', label: 'Buying signals', icon: 'sparkle' },

const REVIEW_ITEMS = SALES.steps.map((s, i) => ({ ...s, group: 'flow', n: i + 1 })).concat(SALES.skills.map((s) => ({ ...s, group: 'skill' })));
const MARK_LABEL = { met: 'Met', gap: 'Opportunity', na: 'Not applicable' };

function setSalesTab(id) {
  state.prefs.salesTab = id;
  persist('prefs');
  refresh({ panel: false });
}

function salesTabs() {
  const current = state.prefs.salesTab;
  const list = h('div', { class: 'tk-tabs', role: 'tablist', 'aria-label': 'Sales Toolkit sections' });
  SALES_TABS.forEach((t, i) => {
    const btn = h(
      'button',
      {
        type: 'button',
        class: 'tk-tab',
        role: 'tab',
        id: `tk-tab-${t.id}`,
        'aria-selected': String(t.id === current),
        'aria-controls': 'tk-panel',
        tabindex: t.id === current ? '0' : '-1',
        'data-fk': `tk-tab:${t.id}`,
        onclick: () => setSalesTab(t.id),
      },
      icon(t.icon),
      t.label
    );
    btn.addEventListener('keydown', (e) => {
      let next = null;
      if (e.key === 'ArrowRight') next = SALES_TABS[(i + 1) % SALES_TABS.length];
      else if (e.key === 'ArrowLeft') next = SALES_TABS[(i - 1 + SALES_TABS.length) % SALES_TABS.length];
      else if (e.key === 'Home') next = SALES_TABS[0];
      else if (e.key === 'End') next = SALES_TABS[SALES_TABS.length - 1];
      if (next) {
        e.preventDefault();
        setSalesTab(next.id);
        focusByKey(`tk-tab:${next.id}`);
      }
    });

  });
  return list;

/* ---------- Call review ---------- */
function setReviewMark(id, mark) {
  const marks = state.review.marks;
  if (marks[id] === mark) delete marks[id];
  else marks[id] = mark;
  persist('review');
  refresh({ panel: false });
}

function toggleReviewPick(item, oppId, on) {
  const picks = (state.review.picks[item.id] || [item.gaps[0]]).slice();
  const i = picks.indexOf(oppId);
  if (on && i < 0) picks.push(oppId);
  if (!on && i >= 0) picks.splice(i, 1);
  state.review.picks[item.id] = picks;
  persist('review');
}

function reviewGapOpps() {
  const out = [];
  for (const it of REVIEW_ITEMS) {
    if (state.review.marks[it.id] !== 'gap') continue;
    for (const id of state.review.picks[it.id] || [it.gaps[0]]) if (getOpp(id) && !out.includes(id)) out.push(id);
  }
  return out;
}

function reviewMetStrengths() {
  const out = [];
  for (const it of REVIEW_ITEMS) if (state.review.marks[it.id] === 'met' && it.strength && getStrength(it.strength) && !out.includes(it.strength)) out.push(it.strength);
  return out;
}

function reviewSummaryText() {
  const lines = ['Sales Call Review'];
  const add = (it) => {
    const m = state.review.marks[it.id];
    if (m) lines.push(`${it.title}: ${MARK_LABEL[m]}`);
  };
  REVIEW_ITEMS.filter((i) => i.group === 'flow').forEach(add);
  const skills = REVIEW_ITEMS.filter((i) => i.group === 'skill' && state.review.marks[i.id]);
  if (skills.length) {
    lines.push('');
    skills.forEach(add);
  }
  return lines.length > 1 ? lines.join('\n') : '';
}

function addReviewGaps() {
  const ids = reviewGapOpps();
  if (!ids.length) {
    toast('Mark at least one step as an opportunity first.', { type: 'warn' });
    return;
  }
  const added = ids.filter((id) => !state.builder.opps.includes(id));
  state.builder.opps.push(...added);
  persist('builder');
  refresh({ panel: false });
  toast(added.length ? `Added ${plural(added.length, 'opportunity', 'opportunities')} to the Coaching Builder` : 'Those opportunities are already in the Coaching Builder', {
    action: { label: 'Open Builder', fn: () => navigate('builder') },
  });
}

function addReviewStrengths() {
  const ids = reviewMetStrengths();
  if (!ids.length) {
    toast('Mark at least one step as met first.', { type: 'warn' });
    return;
  }
  const have = new Set(state.builder.strengths.map((s) => s.id));
  const added = ids.filter((id) => !have.has(id));
  added.forEach((id) => state.builder.strengths.push({ id, v: 0 }));
  persist('builder');
  refresh({ panel: false });
  toast(added.length ? `Marked ${plural(added.length, 'strength')} as observed` : 'Those strengths are already marked as observed', {
    action: { label: 'Open Builder', fn: () => navigate('builder') },
  });
}

async function clearReview() {
  if (!Object.keys(state.review.marks).length) return;
  if (!(await confirmDialog({ title: 'Clear this call review?', message: 'All marks on this review will be cleared. Anything already added to the Coaching Builder stays there.', confirmLabel: 'Clear review' }))) return;
  state.review = defaultReview();
  persist('review');
  refresh({ panel: false });
}

function reviewRow(it) {
  const mark = state.review.marks[it.id] || '';
  const picks = state.review.picks[it.id] || [it.gaps[0]];
  const titleId = `rv-${it.id}`;
  const btn = (value, label) =>
    h(

let lastGenerated = null;

const OUT_PLACEHOLDER = {
  progress: 'Mark observed strengths or add verified progress notes to fill this section. Nothing is claimed automatically, so it stays empty until you do.',
  challenges: 'Add one or more opportunities to generate this section.',

function builderHasContent() {
  const b = state.builder;
  return b.opps.length > 0 || b.strengths.length > 0 || !!(b.notes.progress || b.notes.evidence || b.notes.private) || Object.values(b.edited).some((v) => typeof v === 'string');
}

function moveItem(kind, from, to) {
  const list = kind === 'opps' ? state.builder.opps : state.builder.strengths;
  if (from === to || from < 0 || to < 0 || from >= list.length || to >= list.length) return;
  const [item] = list.splice(from, 1);
  list.splice(to, 0, item);
  persist('builder');
  refresh();
  const name = kind === 'opps' ? (getOpp(item) || {}).title : (getStrength(item.id) || {}).title;
  announce(`${name || 'Item'} moved to position ${to + 1}.`);
}

function removeItem(kind, index) {
  const list = kind === 'opps' ? state.builder.opps : state.builder.strengths;
  const [item] = list.splice(index, 1);
  persist('builder');
  refresh();
  const name = kind === 'opps' ? (getOpp(item) || {}).title : (getStrength(item.id) || {}).title;
  announce(`${name || 'Item'} removed from the Coaching Builder.`);
  // Keep keyboard focus inside the list after removal.
  const next = document.querySelector(`[data-fk="rm:${kind}:${Math.min(index, list.length - 1)}"]`) || document.querySelector(`[data-fk="combo:combo-${kind}"]`);
  if (next) next.focus({ preventScroll: true });
}

function enableDrag(li, kind, index) {
  li.draggable = true;
  li.addEventListener('dragstart', (e) => {
    dragState = { kind, index };
    e.dataTransfer.effectAllowed = 'move';
    try {
      e.dataTransfer.setData('application/x-cip-reorder', `${kind}:${index}`);
    } catch (err) {
      /* some browsers restrict custom types */
    }
    li.classList.add('is-dragging');
  });
  li.addEventListener('dragend', () => {
    li.classList.remove('is-dragging');
    dragState = null;
  });
  li.addEventListener('dragover', (e) => {
    if (!dragState || dragState.kind !== kind) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    li.classList.add('is-drop-target');
  });
  li.addEventListener('dragleave', () => li.classList.remove('is-drop-target'));
  li.addEventListener('drop', (e) => {
    li.classList.remove('is-drop-target');
    if (!dragState || dragState.kind !== kind) return;
    e.preventDefault();
    const from = dragState.index;
    dragState = null;
    moveItem(kind, from, index);
  });
}

function itemButtons(kind, index, length, name) {
  return h(

    h('button', { type: 'button', class: 'icon-btn icon-btn--sm', 'aria-label': `Move ${name} down`, title: 'Move down', 'data-fk': `down:${kind}:${index}`, disabled: index === length - 1, onclick: () => moveItem(kind, index, index + 1) }, icon('arrow-down')),
    h('button', { type: 'button', class: 'icon-btn icon-btn--sm', 'aria-label': `Remove ${name}`, title: 'Remove', 'data-fk': `rm:${kind}:${index}`, onclick: () => removeItem(kind, index) }, icon('x'))

}

function cloneBuilder() {
  return JSON.parse(JSON.stringify(state.builder));
}

function suggestedName() {
  const titles = builderOpps().map((o) => o.title);
  if (!titles.length) return 'Strengths set';
  const name = titles.slice(0, 2).join(' + ') + (titles.length > 2 ? ` + ${titles.length - 2} more` : '');
  return name.slice(0, 80);
}

async function saveCombination() {
  const name = await promptDialog({ title: 'Save combination', label: 'Name this combination', value: suggestedName(), hint: 'Saves the selected opportunities, strengths, tone, and plan settings so you can reuse them. Do not include agent names or IDs.' });
  if (!name) return;
  const b = state.builder;
  state.combos.unshift({ id: uid('combo'), name, opps: [...b.opps], strengths: b.strengths.map((s) => ({ ...s })), tone: b.tone, scope: b.scope, settings: { ...state.settings }, created: Date.now() });
  persist('combos');
  refresh({ panel: false });
  toast(`Saved combination "${name}"`);
}

async function saveDraft(asNew) {
  const b = state.builder;
  const existing = !asNew && b.draftId ? state.drafts.find((d) => d.id === b.draftId) : null;
  const name = await promptDialog({
    title: existing ? 'Update draft' : 'Save draft',
    label: 'Draft name',
    value: existing ? existing.name : `Draft ${fmtDate(Date.now())}`,
    hint: 'Drafts keep everything, including your edited text and notes. Use a label without agent names or IDs.',
  });
  if (!name) return;
  const id = existing ? existing.id : uid('draft');
  b.draftId = id;
  const record = { id, name, builder: cloneBuilder(), settings: { ...state.settings }, saved: Date.now() };
  if (existing) state.drafts = state.drafts.map((d) => (d.id === id ? record : d));
  else state.drafts.unshift(record);
  persist('drafts', 'builder');
  refresh({ panel: false });
  toast(existing ? `Draft "${name}" updated` : `Draft "${name}" saved`);
}

async function loadCombination(c) {
  if (builderHasContent() && !(await confirmDialog({ title: 'Load combination?', message: `This replaces the current Builder selections, notes, and edited text with "${c.name}".`, confirmLabel: 'Load combination' }))) return;
  const b = defaultBuilder();
  b.opps = c.opps.filter((id) => getOpp(id));
  b.strengths = c.strengths.filter((s) => getStrength(s.id)).map((s) => ({ ...s }));
  b.tone = c.tone;
  b.scope = c.scope;
  state.builder = b;
  state.settings = sanitizeSettings(c.settings);
  persist('builder', 'settings');
  refresh();
  toast(`Loaded "${c.name}"`);
}

async function loadDraft(d) {
  if (builderHasContent() && state.builder.draftId !== d.id && !(await confirmDialog({ title: 'Load draft?', message: `This replaces the current Builder content with the draft "${d.name}".`, confirmLabel: 'Load draft' }))) return;
  state.builder = sanitizeBuilder(JSON.parse(JSON.stringify(d.builder)));
  state.builder.draftId = d.id;
  state.settings = sanitizeSettings(d.settings);
  persist('builder', 'settings');
  refresh();
  toast(`Loaded draft "${d.name}"`);
}

async function deleteSaved(kind, item) {
  const label = kind === 'combo' ? 'combination' : 'draft';
  if (!(await confirmDialog({ title: `Delete ${label}?`, message: `"${item.name}" will be permanently removed from this browser.`, confirmLabel: 'Delete', danger: true }))) return;
  if (kind === 'combo') {
    state.combos = state.combos.filter((c) => c.id !== item.id);
    persist('combos');
  } else {
    state.drafts = state.drafts.filter((d) => d.id !== item.id);
    if (state.builder.draftId === item.id) state.builder.draftId = null;
    persist('drafts', 'builder');
  }
  refresh({ panel: false });
  toast(`Deleted ${label} "${item.name}"`);
}

/* ---------- Output ---------- */
function outSection(field, idx, gen) {
  const key = field.key;
  const titleId = `outt-${key}`;
  const b = state.builder;
  const edited = typeof b.edited[key] === 'string';
  const value = edited ? b.edited[key] : gen[key];
  const ta = h('textarea', {
    class: 'out-sec__text',
    id: `out-${key}`,
    'aria-labelledby': titleId,
    'aria-describedby': `outwc-${key}`,
    placeholder: OUT_PLACEHOLDER[key],
    'data-fk': `out:${key}`,
    spellcheck: 'true',
    value,
  });
  ta.addEventListener('input', () => {
    const generated = (lastGenerated || composeBuilder())[key];
    if (ta.value === generated) {
      b.edited[key] = null;
      b.base[key] = null;
    } else {
      if (typeof b.edited[key] !== 'string') b.base[key] = generated;
      b.edited[key] = ta.value;
    }
    persistBuilderSoon();
    syncOutSection(key);
    autosize(ta);
  });
  const reset = async () => {
    if (!(await confirmDialog({ title: 'Replace your edits?', message: 'This section will be regenerated from your current selections. Your manual edits to this section will be lost.', confirmLabel: 'Regenerate' }))) return;
    b.edited[key] = null;
    b.base[key] = null;
    persist('builder');
    updateBuilderOutputs();
    ta.focus();
  };
  return h(
    'section',
    { class: 'out-sec', 'aria-labelledby': titleId },
    h(
      'div',
      { class: 'out-sec__head' },
      h('span', { class: 'out-sec__num', 'aria-hidden': 'true' }, String(idx + 1)),
      h('h3', { class: 'out-sec__title', id: titleId }, field.title),
      copyButton(() => ta.value, { srLabel: `Copy ${field.title}`, fk: `ocopy:${key}`, emptyMessage: 'This section is empty.' })
    ),
    h(
      'div',
      { class: 'notice', id: `outstale-${key}`, hidden: true },
      icon('info'),
      h(
        'div',
        { class: 'notice__body' },
        'Your selections changed after you edited this section. Your edits were kept.',
        h('div', null, h('button', { type: 'button', class: 'btn btn--sm', 'data-fk': `regen:${key}`, onclick: reset }, icon('refresh'), 'Regenerate this section'))
      )
    ),
    ta,
    h(
      'div',
      { class: 'out-sec__foot' },
      h('span', { id: `outwc-${key}` }, ''),
      h('span', { class: 'badge badge--edited', id: `outbadge-${key}`, hidden: !edited }, 'Edited'),
      h('span', { class: 'spacer' }),
      h('button', { type: 'button', class: 'btn btn--ghost btn--sm', id: `outreset-${key}`, 'data-fk': `reset:${key}`, hidden: !edited, onclick: reset }, icon('refresh'), 'Reset to generated')
    )
  );
}

function syncOutSection(key) {
  const b = state.builder;
  const gen = lastGenerated || composeBuilder();
  const ta = document.getElementById(`out-${key}`);
  if (!ta) return;
  const edited = typeof b.edited[key] === 'string';
  if (!edited && ta.value !== gen[key]) {
    ta.value = gen[key];
    autosize(ta);
  }
  const wc = document.getElementById(`outwc-${key}`);
  if (wc) wc.textContent = ta.value.trim() ? `${plural(wordCount(ta.value), 'word')}` : 'Empty';
  const badge = document.getElementById(`outbadge-${key}`);
  if (badge) badge.hidden = !edited;
  const resetBtn = document.getElementById(`outreset-${key}`);
  if (resetBtn) resetBtn.hidden = !edited;
  const stale = document.getElementById(`outstale-${key}`);
  if (stale) stale.hidden = !(edited && typeof b.base[key] === 'string' && b.base[key] !== gen[key]);
}

function updateBuilderOutputs() {
  lastGenerated = composeBuilder();
  BUILDER_FIELDS.forEach((f) => syncOutSection(f.key));
}

function outputColumn() {
  const gen = lastGenerated;
  const hasAny = builderCount() > 0 || !!state.builder.notes.progress.trim();

          { label: 'Copy each action plan, unmerged', icon: 'copy', onSelect: () => copyText(stackedText('plan'), { label: 'Action plans', emptyMessage: 'Add opportunities first.' }) },
          { label: 'Copy feedback and plans by opportunity', icon: 'copy', onSelect: () => copyText(stackedText('both'), { label: 'Feedback and plans', emptyMessage: 'Add opportunities first.' }) },

      : null,
    h('div', { class: 'out-sections' }, BUILDER_FIELDS.map((f, i) => outSection(f, i, gen)))

async function resetBuilder() {
  if (!builderHasContent()) return;
  if (!(await confirmDialog({ title: 'Reset the Coaching Builder?', message: 'This clears the selected opportunities, strengths, notes, and edited text. Saved combinations and drafts are not affected.', confirmLabel: 'Reset builder', danger: true }))) return;
  state.builder = defaultBuilder();

function renderBuilder(main) {
  lastGenerated = composeBuilder();
  main.append(
    pageHead({
      title: 'Coaching Builder',
      sub: 'Combine several opportunities and the strengths you observed into one cohesive coaching entry, with a single consolidated SMART plan and follow-up. Edit any section before copying; your edits are kept.',
      actions: h('button', { type: 'button', class: 'btn btn--sm btn--danger', 'data-fk': 'breset', disabled: !builderHasContent(), onclick: resetBuilder }, icon('refresh'), 'Reset builder'),
    }),
    h('div', { class: 'builder' }, h('div', { class: 'builder__col' }, oppsCard(), strengthsCard(), settingsCard(), notesCard(), savedCard()), outputColumn())

      const ta = document.getElementById(`out-${f.key}`);
      if (ta) autosize(ta);
      syncOutSection(f.key);
    });
  });
}

const ALLOWED_TOKENS = ['{duration}', '{durationAdj}', '{calls}', '{followup}'];

function splitList(v) {
  return String(v || '')
    .split(/[,\n]/)
    .map((s) => s.trim())
    .filter(Boolean);
}

function unknownTokens(text) {
  return (String(text || '').match(/\{[^}]*\}/g) || []).filter((t) => !ALLOWED_TOKENS.includes(t));
}

function parseExamples(text) {
  return String(text || '')
    .split('\n')
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line) => {
      const bar = line.indexOf(' | ');
      const strip = (s) => s.replace(/^["“]+|["”]+$/g, '').trim();
      if (bar > 0 && bar <= 60) return { label: line.slice(0, bar).trim(), say: strip(line.slice(bar + 3)) };
      return { say: strip(line) };
    })
    .filter((e) => e.say);
}

function examplesToText(list) {
  return (list || []).map((e) => (e.label ? `${e.label} | ${e.say}` : e.say)).join('\n');
}

function formField({ id, label, control, hint, required, span2 = true, count }) {
  const counter = count ? h('span', { class: 'field__hint', style: 'margin-left:auto' }) : null;
  const update = () => {
    if (counter) counter.textContent = `${plural(wordCount(control.value), 'word')}${count.target ? ` (aim for ${count.target})` : ''}`;
  };
  if (counter) {
    control.addEventListener('input', update);
    update();
  }
  const warn = h('div');
  if (control.tagName === 'TEXTAREA' || (control.tagName === 'INPUT' && control.type === 'text')) {
    const sync = () => {
      const n = piiNote(control.value);
      warn.replaceChildren(...(n ? [n] : []));
    };
    control.addEventListener('input', sync);
    sync();
  }
  return h(
    'div',
    { class: `field${span2 ? ' span-2' : ''}` },
    h('label', { class: 'field__label', for: id }, label, required ? h('span', { class: 'field__req', 'aria-hidden': 'true' }, '*') : null, counter),
    control,
    hint ? h('p', { class: 'field__hint' }, hint) : null,
    warn
  );
}

    const data = {
      title: f.title.value.trim(),

      plan: f.plan.value.trim(),
      followup: f.followup.value.trim(),

    };

      f.feedback.classList.add('is-invalid');
    }
    if (!data.plan) {
      errors.push('Add a SMART action plan.');
      f.plan.classList.add('is-invalid');
    }
    const badTokens = dedupe([data.plan, data.followup, data.b.mx, data.feedback, data.impact].flatMap(unknownTokens));
    if (badTokens.length) errors.push(`Unknown placeholder ${joinList(badTokens)}. Use only ${ALLOWED_TOKENS.join(', ')}.`);
    if (data.b.coach && !/^an? /i.test(data.b.coach)) errors.push('The coaching activity phrase should start with "a" or "an".');
    if (errors.length) {

      errorBox.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (data.b.m && data.b.mx) data.b.mx = '';
    const allText = [data.title, data.desc, data.feedback, data.impact, data.plan, data.followup, data.note, ...data.questions, ...data.example.map((e) => e.say)].join('\n');
    const pii = piiWarnings(allText);
    if (pii.length && !(await confirmDialog({ title: 'Possible identifying information', message: `This entry contains ${joinList(pii)}. Coaching templates should never include names or IDs. Save anyway?`, confirmLabel: 'Save anyway' }))) return;
    const now = Date.now();
    let openId = null;
    if (isBuiltin) {
      const clean = sanitizeOppFields(data);
      state.overrides.opps[existing.id] = { ...clean, updated: now };
      persist('overrides');
    } else if (existing) {
      const clean = sanitizeCustomOpp({ ...data, id: existing.id, created: existing.created, updated: now });
      state.custom.opps = state.custom.opps.map((c) => (c.id === existing.id ? clean : c));
      persist('custom');
    } else {
      const clean = sanitizeCustomOpp({ ...data, id: uid('custom'), created: now, updated: now });
      state.custom.opps.push(clean);
      persist('custom');
      openId = clean.id;

    m.close();

    refresh();
    toast(isBuiltin ? `Saved your version of "${data.title}"` : existing ? `Updated "${data.title}"` : `Created "${data.title}"`);

/* ==========================================================================
   10-settings: Settings & Data view, export/import, resets, quick guide
   ========================================================================== */

const EXPORT_APP_ID = 'coaching-intelligence-pro';

function exportPayload() {
  return {
    app: EXPORT_APP_ID,
    format: 1,
    version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    data: {
      settings: state.settings,
      prefs: state.prefs,
      favorites: [...state.favorites],
      custom: state.custom,
      overrides: state.overrides,
      combos: state.combos,
      drafts: state.drafts,
      builder: state.builder,
    },
  };
}

function exportData() {
  const json = JSON.stringify(exportPayload(), null, 2);
  const stamp = new Date().toISOString().slice(0, 10);
  const filename = `coaching-intelligence-pro-backup-${stamp}.json`;
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename, style: 'display:none' });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`Exported ${filename}`);
  } catch (e) {
    // Fallback: show the JSON so it can be copied into a file manually.
    showCopyFallback(json, 'the backup');
  }
}

function importFromFile() {
  const input = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    input.remove();
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      toast('That file is too large to be a backup from this app.', { type: 'error' });
      return;
    }
    const reader = new FileReader();
    reader.onload = () => handleImportText(String(reader.result || ''));
    reader.onerror = () => toast('The file could not be read.', { type: 'error' });
    reader.readAsText(file);
  });
  document.body.appendChild(input);
  input.click();
}

/** Parse and sanitize an import. Only known fields are read; strings are length-limited; nothing is executed. */
function parseImport(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return { error: 'This file is not valid JSON.' };
  }
  if (!parsed || typeof parsed !== 'object' || parsed.app !== EXPORT_APP_ID || !parsed.data || typeof parsed.data !== 'object') {
    return { error: 'This file is not a Coaching Intelligence Pro backup.' };
  }
  const d = parsed.data;
  return {
    pack: {
      settings: d.settings ? sanitizeSettings(d.settings) : null,
      prefs: d.prefs ? sanitizePrefs(d.prefs) : null,
      favorites: strList(d.favorites, 1000, 80).filter(isId),
      custom: sanitizeCustom(d.custom),
      overrides: sanitizeOverrides(d.overrides),
      combos: sanitizeCombos(d.combos),
      drafts: sanitizeDrafts(d.drafts),
      builder: d.builder ? sanitizeBuilder(d.builder) : null,
    },
  };
}

function mergeById(current, incoming) {
  const map = new Map(current.map((x) => [x.id, x]));
  incoming.forEach((x) => map.set(x.id, x));
  return [...map.values()];
}

function applyImport(pack, mode) {
  if (mode === 'replace') {
    state.settings = pack.settings || { ...DEFAULT_SETTINGS };
    state.prefs = pack.prefs || defaultPrefs();
    state.favorites = new Set(pack.favorites);
    state.custom = pack.custom;
    state.overrides = pack.overrides;
    state.combos = pack.combos;
    state.drafts = pack.drafts;
    state.builder = pack.builder || defaultBuilder();
  } else {
    pack.favorites.forEach((id) => state.favorites.add(id));
    state.custom = { opps: mergeById(state.custom.opps, pack.custom.opps), strengths: mergeById(state.custom.strengths, pack.custom.strengths) };
    state.overrides = { opps: { ...state.overrides.opps, ...pack.overrides.opps }, strengths: { ...state.overrides.strengths, ...pack.overrides.strengths } };
    state.combos = mergeById(state.combos, pack.combos);
    state.drafts = mergeById(state.drafts, pack.drafts);
  }
  persist(...STATE_KEYS);
  applyTheme();
  applyBrand();
  rebuildContent();
  refresh();
}

function handleImportText(text) {
  const { pack, error } = parseImport(text);
  if (error) {
    toast(error, { type: 'error', duration: 5000 });
    return;
  }
  const counts = [
    plural(pack.custom.opps.length, 'custom opportunity', 'custom opportunities'),
    plural(pack.custom.strengths.length, 'custom strength'),
    plural(Object.keys(pack.overrides.opps).length + Object.keys(pack.overrides.strengths).length, 'customized built-in entry', 'customized built-in entries'),
    plural(pack.favorites.length, 'favorite'),
    plural(pack.combos.length, 'saved combination'),
    plural(pack.drafts.length, 'draft'),
  ];
  const cancel = h('button', { type: 'button', class: 'btn' }, 'Cancel');
  const replace = h('button', { type: 'button', class: 'btn btn--danger' }, 'Replace everything');
  const merge = h('button', { type: 'button', class: 'btn btn--primary' }, 'Merge into current data');
  const m = openModal({
    title: 'Import backup',
    size: 'md',
    body: [
      h('p', { class: 'prose' }, 'This backup contains:'),
      h('ul', { class: 'bullets', style: 'margin:10px 0 14px' }, counts.map((c) => h('li', null, icon('check'), c))),
      h('p', { class: 'prose' }, h('strong', null, 'Merge'), ' adds these items and replaces any with the same ID. ', h('strong', null, 'Replace everything'), ' swaps all of your current templates, favorites, drafts, Builder content, and settings for the backup.'),
    ],
    footer: [cancel, h('span', { class: 'spacer' }), replace, merge],
    initialFocus: merge,
  });
  cancel.addEventListener('click', () => m.close());
  merge.addEventListener('click', () => {

/* ==========================================================================
   10b-brand: brand colors (for example, your official VXI colors).
   Any two colors produce an accessible theme: text and button colors are
   adjusted automatically to keep WCAG AA contrast in light and dark modes.
   ========================================================================== */

const DEFAULT_BRAND = Object.freeze({ primary: '#0b7a75', sidebar: '#0b1630' });
const C_WHITE = { r: 255, g: 255, b: 255 };
const C_BLACK = { r: 0, g: 0, b: 0 };
const C_INK = { r: 14, g: 23, b: 38 };
const C_DARK_SURFACE = { r: 16, g: 26, b: 44 };
const C_DARK_BG = { r: 10, g: 17, b: 32 };

function parseHex(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function toHex(c) {
  return '#' + [c.r, c.g, c.b].map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
}
function normHex(v) {
  const s = String(v || '').trim().replace(/^#?/, '#');
  return /^#[0-9a-f]{6}$/i.test(s) ? s.toLowerCase() : null;
}
function mixRgb(a, b, t) {
  return { r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t };
}
function rgba(c, a) {
  return `rgba(${Math.round(c.r)}, ${Math.round(c.g)}, ${Math.round(c.b)}, ${a})`;
}
function relLum(c) {
  const f = (v) => {
    const x = v / 255;
    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
}
function contrastRatio(a, b) {
  const l1 = relLum(a);
  const l2 = relLum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
/** Move a color toward black or white just far enough to reach the target contrast against a background. */
function towardContrast(color, bg, target, dir) {
  for (let i = 0; i <= 40; i++) {
    const c = mixRgb(color, dir, i / 40);
    if (contrastRatio(c, bg) >= target) return c;
  }
  return dir;
}

function sidebarScheme(S, P) {
  const lightText = contrastRatio(C_WHITE, S) >= 4.5;
  if (lightText) {
    const text = towardContrast(mixRgb(C_WHITE, S, 0.18), S, 7, C_WHITE);
    const muted = towardContrast(mixRgb(C_WHITE, S, 0.42), S, 4.6, C_WHITE);
    const accent = towardContrast(P, S, 3.2, C_WHITE);
    return {
      bg: S,
      bg2: mixRgb(S, C_WHITE, 0.05),
      text,
      strong: C_WHITE,
      muted,
      hover: 'rgba(255, 255, 255, 0.06)',
      border: 'rgba(255, 255, 255, 0.08)',
      accent,
      accentInk: contrastRatio(C_INK, accent) >= 4.5 ? C_INK : C_WHITE,
      active: rgba(accent, 0.16),
      focus: '#9cc0ff',
    };
  }
  const muted = towardContrast(mixRgb(C_INK, S, 0.42), S, 4.6, C_BLACK);
  const accent = towardContrast(P, S, 3.2, C_BLACK);
  return {
    bg: S,
    bg2: mixRgb(S, C_BLACK, 0.04),
    text: towardContrast(mixRgb(C_INK, S, 0.12), S, 7, C_BLACK),
    strong: C_INK,
    muted,
    hover: 'rgba(0, 0, 0, 0.05)',
    border: 'rgba(0, 0, 0, 0.08)',
    accent,
    accentInk: contrastRatio(C_WHITE, accent) >= 4.5 ? C_WHITE : C_INK,
    active: rgba(accent, 0.14),
    focus: '#1d4fd8',
  };
}

/** Compute every themed value from the two brand colors. */
function brandTokens(brand) {
  const P = parseHex(brand.primary);
  const S = parseHex(brand.sidebar);
  if (!P || !S) return null;
  // Light theme: keep the brand color for buttons whenever readable text exists for it.
  let accent = P;
  let ink = contrastRatio(C_WHITE, P) >= 4.5 ? C_WHITE : contrastRatio(C_INK, P) >= 4.5 ? C_INK : null;
  if (!ink) {
    accent = towardContrast(P, C_WHITE, 4.5, C_BLACK);
    ink = C_WHITE;
  }
  const soft = mixRgb(accent, C_WHITE, 0.88);
  const light = {
    accent,
    ink,
    hover: ink === C_WHITE ? mixRgb(accent, C_BLACK, 0.15) : mixRgb(accent, C_WHITE, 0.2),
    soft,
    text: towardContrast(P, soft, 4.8, C_BLACK),
    side: sidebarScheme(S, P),
  };
  // Dark theme: lighten the brand color until it reads on dark surfaces; darken the sidebar.
  const dAccent = towardContrast(P, C_DARK_SURFACE, 4.8, C_WHITE);
  const dSide = relLum(S) > 0.2 ? mixRgb(S, C_DARK_BG, 0.82) : mixRgb(S, C_BLACK, 0.3);
  const dark = {
    accent: dAccent,
    ink: contrastRatio(C_INK, dAccent) >= 4.5 ? C_INK : C_WHITE,
    hover: mixRgb(dAccent, C_WHITE, 0.15),
    soft: rgba(dAccent, 0.13),
    text: towardContrast(P, C_DARK_SURFACE, 5.5, C_WHITE),
    side: sidebarScheme(dSide, P),
  };
  return {
    light,
    dark,
    report: {
      button: contrastRatio(light.ink, light.accent),
      link: contrastRatio(light.text, C_WHITE),
      nav: contrastRatio(light.side.text, light.side.bg),
      buttonAdjusted: toHex(accent) !== toHex(P),
    },
  };
}

function tokenBlock(t) {
  const s = t.side;
  const c = (v) => (typeof v === 'string' ? v : toHex(v));
  return [
    `--accent:${c(t.accent)}`,
    `--accent-hover:${c(t.hover)}`,
    `--accent-ink:${c(t.ink)}`,
    `--accent-soft:${c(t.soft)}`,
    `--accent-text:${c(t.text)}`,
    `--sidebar-bg:${c(s.bg)}`,
    `--sidebar-bg-2:${c(s.bg2)}`,
    `--sidebar-text:${c(s.text)}`,
    `--sidebar-strong:${c(s.strong)}`,
    `--sidebar-muted:${c(s.muted)}`,
    `--sidebar-hover:${s.hover}`,
    `--sidebar-border:${s.border}`,
    `--sidebar-accent:${c(s.accent)}`,
    `--sidebar-accent-ink:${c(s.accentInk)}`,
    `--sidebar-active:${s.active}`,
    `--sidebar-focus:${s.focus}`,
  ].join(';');
}

function brandCss(brand) {
  const tokens = brandTokens(brand);
  if (!tokens) return '';
  const light = tokenBlock(tokens.light);
  const dark = tokenBlock(tokens.dark);
  // "html:root" outranks the base ":root" rules regardless of stylesheet order.
  return `html:root{${light}}html:root[data-theme="dark"]{${dark}}@media (prefers-color-scheme: dark){html:root:not([data-theme="light"]){${dark}}}`;
}

/** Apply (or remove) the brand theme and cache the CSS so the next load starts with it. */
function applyBrand() {
  let el = document.getElementById('brand-style');
  const brand = state.prefs.brand;
  if (!brand) {
    if (el) el.remove();
    store.remove('brandcss');
    return;
  }
  const css = brandCss(brand);
  if (!el) {
    el = document.createElement('style');
    el.id = 'brand-style';
    document.head.appendChild(el);
  }
  el.textContent = css;
  store.set('brandcss', css);
}

const persistPrefsSoon = debounce(() => persist('prefs'), 300);

function brandCard() {
  const current = state.prefs.brand || DEFAULT_BRAND;
  const report = h('div', { class: 'brand-report', role: 'status', 'aria-live': 'polite' });
  const badge = h('span', { class: `badge ${state.prefs.brand ? 'badge--success' : 'badge--custom'}` }, state.prefs.brand ? 'Custom' : 'Default');
  const resetBtn = h(
    'button',
    {
      type: 'button',
      class: 'btn btn--sm',
      'data-fk': 'brand-reset',
      disabled: !state.prefs.brand,
      onclick: () => {
        state.prefs.brand = null;
        applyBrand();
        persist('prefs');
        refresh();
        toast('Default colors restored');
      },
    },
    icon('refresh'),
    'Reset to default colors'
  );
  const drawReport = () => {
    const t = brandTokens(state.prefs.brand || DEFAULT_BRAND);
    if (!t) return;
    const r = t.report;
    const row = (label, ratio) => h('span', { class: 'brand-report__item' }, h('span', { class: 'brand-report__pass' }, ratio >= 4.5 ? 'AA' : 'Low'), `${label} ${ratio.toFixed(1)}:1`);
    const items = [row('Button text', r.button), row('Link text', r.link), row('Navigation text', r.nav)];
    if (r.buttonAdjusted) items.push(h('span', { class: 'brand-report__note' }, 'Buttons use a slightly deeper shade of your primary color so their text stays readable.'));
    report.replaceChildren(...items);
  };
  const update = (key, value) => {
    const v = normHex(value);
    if (!v) return false;
    state.prefs.brand = { ...(state.prefs.brand || DEFAULT_BRAND), [key]: v };
    applyBrand();
    persistPrefsSoon();
    drawReport();
    resetBtn.disabled = false;
    badge.className = 'badge badge--success';
    badge.textContent = 'Custom';
    return true;
  };
  const row = (key, label, hint) => {
    const id = `brand-${key}`;
    const picker = h('input', { type: 'color', class: 'brand-swatch', id, value: current[key], 'aria-describedby': `${id}-hint`, 'data-fk': id });
    const hex = h('input', { type: 'text', class: 'input brand-hex', value: current[key].toUpperCase(), maxlength: '7', spellcheck: 'false', autocomplete: 'off', 'aria-label': `${label} hex code`, 'data-fk': `${id}-hex` });
    picker.addEventListener('input', () => {
      hex.value = picker.value.toUpperCase();
      hex.classList.remove('is-invalid');
      update(key, picker.value);
    });
    // Save right away when the color picker closes (input events above are debounced).
    picker.addEventListener('change', () => persistPrefsSoon.flush());
    const fromHex = () => {
      const v = normHex(hex.value);
      if (!v) {
        hex.classList.add('is-invalid');
        return;
      }
      hex.classList.remove('is-invalid');
      hex.value = v.toUpperCase();
      picker.value = v;
      update(key, v);
      persistPrefsSoon.flush();
    };
    hex.addEventListener('change', fromHex);
    hex.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        fromHex();
      }
    });
    const pick =
      typeof window.EyeDropper === 'function'
        ? h(
            'button',
            {
              type: 'button',
              class: 'btn btn--sm',
              'aria-label': `Pick the ${label.toLowerCase()} from anywhere on screen`,
              'data-fk': `${id}-pick`,
              onclick: async () => {
                try {
                  const res = await new window.EyeDropper().open();
                  const v = normHex(res && res.sRGBHex);
                  if (v) {
                    picker.value = v;
                    hex.value = v.toUpperCase();
                    update(key, v);
                    persistPrefsSoon.flush();
                  }
                } catch (e) {
                  /* picker cancelled */
                }
              },
            },
            icon('pipette'),
            'Pick from screen'
          )
        : null;
    return h(
      'div',
      { class: 'brand-row' },
      h('label', { class: 'setting__label', for: id }, label),
      h('div', { class: 'brand-row__controls' }, picker, hex, pick),
      h('p', { class: 'field__hint', id: `${id}-hint` }, hint)
    );
  };
  drawReport();
  return h(
    'section',
    { class: 'card', 'aria-label': 'Brand colors' },
    h('div', { class: 'card__head' }, h('h2', { class: 'card__title' }, icon('sparkle'), 'Brand colors'), badge),
    h(
      'div',
      { class: 'card__body' },
      h('p', { class: 'prose' }, 'Set your official VXI colors here (from the VXI brand guide, a VXI presentation template, or the logo). The whole app updates as you choose, and text colors adjust automatically so everything stays readable in light and dark mode.'),
      row('primary', 'Primary color', 'Buttons, highlights, and selected items.'),
      row('sidebar', 'Navigation color', 'The navigation sidebar background.'),
      typeof window.EyeDropper === 'function'
        ? h('p', { class: 'hint' }, icon('info'), 'Tip: open the VXI logo on screen (for example, in your email signature or intranet), then use Pick from screen and click the logo color.')
        : h('p', { class: 'hint' }, icon('info'), 'Tip: in Chrome or Edge, the color picker includes an eyedropper, so you can sample the VXI logo directly from the screen.'),
      report,
      h('div', { class: 'data-row' }, resetBtn)
    )
  );
}

/* ==========================================================================
   11-init: hash routing, global events, startup
   ========================================================================== */

const VIEWS = ['all', 'strengths', 'sales-toolkit', 'favorites', 'builder', 'templates', 'settings'];

function parseHash() {
  const raw = (window.location.hash || '').replace(/^#/, '');
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs || '');
  let view = 'all';
  let cat = null;
  if (parts[0] === 'cat' && CAT_MAP[parts[1]]) {
    view = 'cat';
    cat = parts[1];
  } else if (VIEWS.includes(parts[0])) {
    view = parts[0];
  }
  return { view, cat, open: params.get('open') };
}

function hashFor(view, cat, open) {
  let hash = view === 'cat' && cat ? `#/cat/${cat}` : `#/${view || 'all'}`;
  if (open) hash += `?open=${encodeURIComponent(open)}`;
  return hash;
}

function navigate(view, opts = {}) {
  const { cat = null, open = null, replace = false } = opts;
  const target = hashFor(view, view === 'cat' ? cat || state.ui.cat : null, open);
  if (window.location.hash === target) {
    route();
    return;
  }
  if (replace) window.location.replace(target);
  else window.location.hash = target;
}

function route() {
  const r = parseHash();
  const viewChanged = r.view !== state.ui.view || r.cat !== state.ui.cat;
  state.ui.view = r.view;
  state.ui.cat = r.cat;
  if (viewChanged) {
    renderSidebar();
    updateTopbar();
    renderMain();
    window.scrollTo(0, 0);
    closeNav();
  }
  const openId = r.open && getOpp(r.open) ? r.open : null;
  if (openId !== state.ui.openId) {
    state.ui.openId = openId;
    if (openId) showPanel();
    else hidePanel();
  } else if (viewChanged && openId) {
    renderPanel({ keepScroll: true });
  }
  if (viewChanged && !openId && !initialRoute && document.activeElement !== els.searchInput) {
    // Move focus to the new page heading for screen reader and keyboard users.
    const heading = document.getElementById('pageTitle');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
  }
  initialRoute = false;
}
let initialRoute = true;

/* ---------- Mobile navigation ---------- */
function openNav() {
  els.app.classList.add('nav-open');
  els.menuBtn.setAttribute('aria-expanded', 'true');
  syncInert();
  focusSoon(els.sidebar.querySelector('[aria-current="page"]') || els.sidebar.querySelector('a, button'));
}
function closeNav(restoreFocus) {
  if (!els.app.classList.contains('nav-open')) return;
  els.app.classList.remove('nav-open');
  els.menuBtn.setAttribute('aria-expanded', 'false');
  syncInert();
  if (restoreFocus) els.menuBtn.focus({ preventScroll: true });
}

function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

function onGlobalKeydown(e) {
  if (modalStack.length) return; // dialogs handle their own keys
  const typing = isTypingTarget(e.target);
  if ((e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) || ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K'))) {
    e.preventDefault();
    closeNav();
    els.searchInput.focus();
    els.searchInput.select();
    return;
  }
  if (e.key === 'Escape') {
    if (els.app.classList.contains('nav-open')) {
      e.preventDefault();
      closeNav(true);
      return;
    }
    if (e.target === els.searchInput && els.searchInput.value) {
      e.preventDefault();
      setQuery('');
      return;
    }
    if (state.ui.openId && !(typing && e.target.closest && !e.target.closest('#panel'))) {
      e.preventDefault();
      closePanel();
    }
    return;
  }
  if (!typing && state.ui.openId && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === '[') {
      e.preventDefault();
      stepPanel(-1);
    } else if (e.key === ']') {
      e.preventDefault();
      stepPanel(1);
    }
  }
  if (e.key === 'Tab' && isPanelOverlay() && els.panel.contains(document.activeElement)) trapTab(e, els.panel);
}

/* ---------- Search ---------- */
function setQuery(value) {
  state.ui.query = value;
  els.searchInput.value = value;
  els.search.classList.toggle('has-value', !!value);
  const v = state.ui.view;
  if (value.trim() && !['all', 'cat', 'favorites', 'strengths'].includes(v)) {
    navigate('all');
    return;
  }
  renderMain();
  renderSidebar();
}
const onSearchInput = debounce(() => setQuery(els.searchInput.value), 110);

/* ---------- Startup ---------- */
function bindElements() {
  els.app = $('#app');
  els.sidebar = $('#sidebar');
  els.workspace = $('#workspace');
  els.main = $('#main');
  els.panel = $('#panel');
  els.panelScrim = $('#panelScrim');
  els.navScrim = $('#navScrim');
  els.menuBtn = $('#menuBtn');
  els.search = $('.search');
  els.searchInput = $('#searchInput');
  els.searchClear = $('#searchClear');
  els.builderBtn = $('#builderBtn');
  els.builderCount = $('#builderCount');
  els.themeBtn = $('#themeBtn');
  els.guideBtn = $('#guideBtn');
  els.modalRoot = $('#modalRoot');
  els.toasts = $('#toasts');
  els.announcer = $('#announcer');
}

function bindEvents() {
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', onGlobalKeydown);
  els.searchInput.addEventListener('input', () => {
    els.search.classList.toggle('has-value', !!els.searchInput.value);
    onSearchInput();
  });
  els.searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      onSearchInput.flush();
      const first = els.main.querySelector('.opp-card__open, .observe-btn');
      if (first) first.focus();
    }
  });
  els.searchClear.addEventListener('click', () => {
    setQuery('');
    els.searchInput.focus();
  });
  els.menuBtn.addEventListener('click', () => (els.app.classList.contains('nav-open') ? closeNav(true) : openNav()));
  els.navScrim.addEventListener('click', () => closeNav(true));
  els.panelScrim.addEventListener('click', closePanel);
  els.sidebar.addEventListener('click', (e) => {
    if (e.target.closest('a.nav__item')) closeNav();
  });
  els.guideBtn.addEventListener('click', openGuide);
  els.themeBtn.addEventListener('click', () => {
    const order = ['system', 'light', 'dark'];
    const next = order[(order.indexOf(state.prefs.theme) + 1) % order.length];
    setTheme(next);
    toast(`Theme: ${next}`);
  });
  const onMode = () => {
    syncInert();
    if (!mqNarrow.matches) closeNav();
  };
  if (mqDock.addEventListener) {
    mqDock.addEventListener('change', onMode);
    mqNarrow.addEventListener('change', onMode);
  } else if (mqDock.addListener) {
    mqDock.addListener(onMode);
    mqNarrow.addListener(onMode);
  }
  window.addEventListener(
    'resize',
    debounce(() => {
      $$('.out-sec__text').forEach(autosize);
      updateTopbar();
    }, 150)
  );
  window.addEventListener('pagehide', () => {
    persistBuilderSoon.flush();
    persistPrefsSoon.flush();
  });
  window.addEventListener('storage', (e) => {
    if (!e.key || !e.key.startsWith(STORAGE_PREFIX)) return;
    const key = e.key.slice(STORAGE_PREFIX.length);
    if (!STATE_KEYS.includes(key) || key === 'builder') return;
    loadSlice(key);
    if (key === 'prefs') {
      applyTheme();
      applyBrand();
    }
    rebuildContent();
    refresh();
  });
}

function init() {
  bindElements();
  loadState();
  applyTheme();
  applyBrand();
  rebuildContent();
  bindEvents();
  const r = parseHash();
  state.ui.view = r.view === 'all' && !window.location.hash ? 'all' : r.view;
  state.ui.cat = r.cat;
  renderSidebar();
  updateTopbar();
  renderMain();
  if (r.open && getOpp(r.open)) {
    state.ui.openId = r.open;
    showPanel();
  }
  syncInert();
  initialRoute = false;
  document.documentElement.classList.add('is-ready');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
