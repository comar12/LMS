listen back to this call, how do you think your energy sounded to the customer?","Where in the call could more emphasis or variety in your voice have helped the customer stay engaged?","How would you adjust your tone for a customer dealing with an outage compared with a routine request?"],"strengths":["s-itg","s-troubleshooting","s-clarity","s-resolution"],"b":{"obs":"spoke with a flat, low-energy tone and little variation in pitch or emphasis, which made you sound disengaged from the concern","focus":"vocal energy","commit":"bring steady energy to your voice, emphasize key words, and vary your pitch and pace while matching the seriousness of the situation","m":"engaged, varied vocal delivery that fits the seriousness of each situation","coach":"a recording review comparing flat delivery with engaged pitch and emphasis"},"note":"Assess energy by listening to the recording, not from notes. A calm, measured tone is appropriate for outages, hardship, or bereavement and should not be coached as low energy. Demonstrate the examples aloud, since energy is easier to hear than to read."},{"id":"com-tone-pace","cat":"com","title":"Inappropriate Tone or Pace","desc":"Speaking too fast, too slow, or with an impatient, sharp, or condescending tone that does not fit the customer or the situation.","kw":["tone","pace","rushed","rushing","too fast","talking fast","too slow","impatient","sharp","short with customer","condescending","rude","attitude","abrupt","speed","speaking rate","harsh tone","dismissive","frustrated tone"],"tags":["Soft Skills","Tone","Pace"],"kpi":["QA","aiCR"],"theme":"delivery","feedback":"At several points in the call, your pace and tone did not fit what the customer needed. Key details were delivered quickly, and at moments when the customer needed more time or asked a question, your replies came across as short. The way you sound shapes how the customer interprets your words, so a rushed, sharp, or impatient delivery can feel dismissive even when the information is correct, and the customer may miss steps they need to remember. Instead, slow down for key details, pause to let the customer catch up, and keep a patient, respectful tone, especially when you are asked to repeat or clarify something.","impact":"An inappropriate tone or pace usually comes from time pressure, a busy queue, or moving through a familiar process faster than a customer hearing it for the first time can follow. A rushed or sharp delivery can make the customer feel like an interruption, which may cause them to stop asking questions, miss important steps, or become defensive. That can lead to errors, repeat contacts, escalation requests, and lower quality results.","plan":"For the next {duration}, you will slow your pace whenever you give instructions, dates, or next steps, and pause after each key point so the customer has a chance to respond. When a customer asks you to repeat or clarify something, answer with the same patience you showed at the start of the call, and rephrase it rather than repeating it word for word. Avoid phrases that can sound condescending, such as 'like I said' or 'as I already explained.' Adjust to the customer on the line, slowing down for someone who is confused or under stress and staying direct and efficient for someone short on time. We will review {calls} applicable calls within {followup}, targeting a patient, respectful tone and a pace that fits the customer in all {calls} calls.","followup":"During our session, we will listen side by side to the parts of this call where the pace picked up or the tone became short, and you will practice delivering the same information at a steadier pace. I will review {calls} of your calls within {followup}, paying close attention to the moments when the customer asked questions. We will discuss what you noticed at a midweek check-in and complete the review together at the end of the {durationAdj} plan.","example":[{"label":"Slowing down for key details","say":"I'm going to go through this one step at a time. The first thing I'll need you to do is find the device we talked about. Take your time, and let me know when you're ready."},{"label":"When asked to repeat","say":"Of course. Let me explain that a different way, because it's an important step and I want it to be clear."}],"questions":["How do you think the customer felt when the key details were delivered quickly?","What signals from the customer could tell you that your pace or tone needs to change?","When a customer asks you to repeat something, how do you want your response to sound?"],"strengths":["s-ownership","s-tools","s-diagnosis","s-resolution"],"b":{"obs":"used a pace or tone that did not fit the situation, such as rushing through key details or sounding short when the customer asked questions","focus":"pace and tone","commit":"slow down for key details, pause after important points, and keep a patient, respectful tone when the customer asks questions","m":"a patient, respectful tone and a pace that fits each customer","coach":"a side-by-side listen to the moments where the pace sped up or the tone turned short"},"note":"If the main issue is low energy rather than speed or sharpness, the Flat / Sleepy / Low-Energy Tone entry may be a better fit."},{"id":"com-active-listening","cat":"com","title":"Poor Active Listening","desc":"Missing details the customer shared, responding to a different point than the one raised, or not confirming understanding through paraphrasing.","kw":["active listening","listening","not listening","poor listening","did not listen","missed details","missed information","wrong issue","wrong point","paraphrase","paraphrasing","verbal confirmation","misunderstood","attentive","distracted","listening skills","focus"],"tags":["Soft Skills","Listening","Accuracy"],"kpi":["QA","aiCR","Transfer"],"theme":"listen","feedback":"While the customer was explaining the problem, a few key details did not make it into your response, and you addressed a different point than the one they raised. Active listening lets you work on the right problem the first time. When details are missed, the customer often has to correct you or explain the issue again, which adds effort and can shake their confidence that you understand the situation. Going forward, give the customer your full attention while they speak, note key details as you hear them, and paraphrase before responding, for example, 'So the picture freezes mostly in the evening, and only on the upstairs TV,' so the customer can confirm it.","impact":"Poor active listening often happens when you begin forming a response, or start navigating the account, before the customer has finished explaining. Details missed early can send troubleshooting or account changes in the wrong direction, which may lead to an incorrect resolution, an avoidable transfer, or a repeat contact. It also raises customer effort, because the customer has to repeat or correct information to get the call back on track.","plan":"During the next {duration}, you will keep your attention on the customer while they explain the concern and note the key details, such as when the problem started, which devices or services are affected, and what has changed recently. Before you respond or recommend a step, paraphrase those details back and confirm them with the customer. If the customer adds new information later in the call, acknowledge it and explain how it changes the next step. We will review {calls} applicable calls within {followup}, targeting key details paraphrased and confirmed before each recommendation in all {calls} calls, with every response addressing the point the customer actually raised.","followup":"In our session, I will read three short customer explanations aloud, and you will paraphrase the key details of each one before suggesting a next step. I will then review {calls} of your calls within {followup}, comparing what the customer said with how you responded. We will check in briefly midweek, and at the end of the {duration} we will listen to one of your calls together to see how the paraphrasing is working on live calls.","example":[{"label":"Paraphrasing the details","say":"I want to be sure I caught everything. The picture freezes mostly in the evening, it's only the TV upstairs, and it started after the storm last week. Did I miss anything?"},{"label":"When new details come up","say":"That's helpful to know. If your phone also loses its connection on Wi-Fi, this may be affecting the whole home network, so I'll check that first."}],"questions":["Which details from the customer's explanation would have changed the way you responded?","Where was your attention while the customer was explaining the problem?","How could paraphrasing the details back to the customer have changed the direction of the call?"],"strengths":["s-tone","s-ownership","s-tools","s-itg"],"b":{"obs":"missed key details in the explanation and responded to a different point than the one raised, without paraphrasing to confirm your understanding","focus":"active listening","commit":"note the key details as the customer speaks and paraphrase them back for confirmation before responding or recommending a step","m":"key details paraphrased and confirmed before each recommendation","coach":"a paraphrasing drill using short customer explanations read aloud"},"note":"Compare the customer's own words on the recording with the response that followed to pinpoint which details were missed."},{"id":"com-interrupting","cat":"com","title":"Interrupting the Customer","desc":"Talking over the customer or cutting in before they finish speaking, instead of letting them complete their thought or interjecting respectfully when needed.","kw":["interrupting","interrupt","interrupted","talking over","talked over","speaking over","cutting off","cut off customer","overlapping","overtalk","jumping in","interjecting","let customer finish","not letting customer speak","rude","impatient"],"tags":["Soft Skills","Listening","Courtesy"],"kpi":["QA"],"theme":"listen","feedback":"Several times during the call, you started speaking before the customer had finished, and at points the two of you were talking over each other. Even when you already know where the customer is going, cutting in can make them feel rushed and unimportant, and you may miss a detail that changes the solution. Customers who are interrupted often repeat themselves more forcefully, which can make the call longer and more tense. From here, let the customer finish each thought and pause briefly before responding. If you do need to step in, ask permission and give a reason, such as needing one quick detail to narrow down the issue, then hand the conversation back.","impact":"Interrupting usually comes from wanting to keep the call moving or from recognizing the issue before the customer has finished describing it. From the customer's side, being cut off can feel dismissive, and important details may never be shared. That can lead to the wrong solution, a longer call as the customer works harder to be heard, and lower satisfaction and quality results.","plan":"Starting with your next call and continuing for {duration}, you will let the customer finish speaking before you respond, and allow a brief pause after they stop to be sure they are done. If you need to interject, for example to keep a long explanation on track, ask permission first, give a short reason, and return the conversation to the customer afterward. If you and the customer start speaking at the same time, stop and invite them to continue. We will review {calls} applicable calls within {followup}, targeting zero instances of talking over the customer in all {calls} calls.","followup":"We will roleplay a call in our session where I play a customer who gives long, detailed explanations, so you can practice waiting for natural pauses and interjecting politely when it is needed. I will listen to {calls} of your calls within {followup} and mark any moments of overlap, and we will review those moments together midweek. At the end of the {durationAdj} plan, we will decide whether further practice is needed.","example":[{"label":"Interjecting respectfully","say":"I'm sorry to cut in. May I ask one quick question so I can make sure I'm looking at the right service? Then I'd like to hear the rest."},{"label":"After talking over the customer","say":"I'm sorry, I spoke over you there. Please go ahead and finish."}],"questions":["What was happening for you in the moments when you started speaking before the customer had finished?","What details might the customer have shared if they had been able to finish?","When you need to redirect a customer who is talking at length, how could you do it respectfully?"],"strengths":["s-assurance","s-ownership","s-troubleshooting","s-tools"],"b":{"obs":"jumped in before they had finished and talked over them at several points, leaving some of their details unheard","focus":"letting the customer finish","commit":"let the customer finish each thought before responding, and ask permission with a brief reason when you need to interject","m":"zero instances of talking over the customer","coach":"a roleplay practicing patient listening and respectful ways to interject"},"note":"Before documenting, confirm on the recording that the overlap was an interruption and not line delay or a brief verbal nod such as 'okay' while the customer was speaking."},{"id":"com-repeating-questions","cat":"com","title":"Repeating Questions / Increasing Customer Effort","desc":"Asking for information the customer already provided or that is already available on the account, which adds unnecessary steps and effort for the customer.","kw":["repeating questions","repeat questions","asked again","asking twice","same question","customer repeating","repeat information","made customer repeat","redundant questions","already provided","already on account","customer effort","high effort","low effort","unnecessary steps","account history","notes"],"tags":["Customer Effort","Listening","Efficiency"],"kpi":["QA"],"theme":"listen","feedback":"During the call, you asked the customer for details they had already given earlier in the conversation, along with information that was already available on the account. Each repeated question adds effort and can suggest that what the customer said was not heard or recorded. Customers asked to repeat themselves often grow impatient, and the call can start to feel like it is going in circles. Next time, keep brief notes as the customer speaks and review the account before asking a question. When you need to check a detail you already have, confirm it rather than asking for it from scratch.","impact":"Repeated questions usually come from not capturing details the first time, or from following a set sequence of questions without checking what is already known. Every unnecessary question or step raises customer effort, lengthens the call, and can make the customer feel their time is not being respected. High-effort calls are more likely to end with lower satisfaction and quality results, even when the concern is resolved.","plan":"For the next {duration}, you will note key details as the customer shares them and review the account, recent notes, and contact history before asking a question. When you need a detail you already have, confirm it instead of asking for it again, and do not ask the customer to repeat a step they have told you is already done unless you explain why it is needed. Verification required by the applicable process still applies. We will review {calls} applicable calls within {followup}, targeting no requests for information the customer had already provided or that was available on the account in all {calls} calls.","followup":"During our session, we will walk through the account tools together and identify where details such as equipment, recent changes, and earlier contact notes can be found before you ask the customer. You will also build a short personal checklist of what to review before asking. I will review {calls} of your calls within {followup}, tracking any repeated questions, and we will compare results midweek and again at the end of the {duration}.","example":[{"label":"Confirming instead of asking again","say":"You mentioned earlier that you already restarted the modem this morning, so we can skip that step. I can also see your equipment on the account, so you won't need to look anything up for me."},{"label":"Building on what was shared","say":"Earlier you said the problem started Sunday evening, so I'll use that as our starting point when I check the connection history."}],"questions":["Which of the questions you asked had the customer already answered, or could you have found on the account?","How do you think the customer felt when they were asked for the same information again?","What could you review or note during the call so the details are ready when you need them?"],"strengths":["s-empathy","s-tone","s-troubleshooting","s-resolution"],"b":{"obs":"asked again for details already given or already available on the account, which made the customer repeat information unnecessarily","focus":"reducing customer effort","commit":"review the account and the details already shared before asking a question, and confirm known information instead of requesting it again","m":"no requests for information already provided or available on the account","coach":"a tools walkthrough of where known customer details can be found before asking"},"note":"Verification questions required by the applicable process are not repeat questions. Before the session, confirm which details were visible on the account at the time of the call."},{"id":"com-deescalation","cat":"com","title":"Poor De-escalation","desc":"Responding to an upset or angry customer in a way that adds tension, such as becoming defensive, leading with policy, or matching the customer's intensity.","kw":["de-escalation","deescalation","de-escalate","customer angry","angry","irate","yelling","upset","escalation","escalated","calm","supervisor request","asked for supervisor","frustration","defensive","argumentative","policy first","heated","hostile","complaint"],"tags":["Soft Skills","De-escalation","Escalation Risk"],"kpi":["QA","aiCR","Transfer"],"theme":"connect","feedback":"When the customer became upset, you responded with policy and explanations before they had finished expressing their frustration, and your tone grew more defensive as the conversation went on. An angry customer usually needs to feel heard before they can listen to a solution, and responding with policy first or matching their intensity often raises the tension instead of lowering it. That can lead to a supervisor request or the customer disengaging from the steps you need them to take. Going forward, let the customer finish, acknowledge the specific reason for their frustration, keep your voice calm and steady, and explain what you can do before discussing what you cannot.","impact":"Poor de-escalation often comes from feeling personally targeted by the customer's anger, or from reaching for policy as a way to regain control of the call. A defensive or rule-first response tells the customer they are not being heard, which tends to raise their intensity. That can lead to supervisor requests, transfers, complaints, or cancellation threats, and the customer may call back hoping to reach someone who will listen.","plan":"Over the next {duration}, you will let an upset customer finish speaking without interrupting, then acknowledge the specific cause of their frustration before offering any explanation. Keep your voice calm, steady, and a little slower than the customer's, avoid phrases that sound defensive, and lead with what you can do before explaining any limitation. If the customer asks for a supervisor, acknowledge the request calmly, explain what you can do to help right now, and follow the program's supervisor request process without arguing. We will review {calls} applicable calls within {followup}, and every reviewed call with an upset customer should show these steps.","followup":"In our session, we will roleplay an escalating call in which I play an upset customer who eventually asks for a supervisor, and you will practice staying calm, acknowledging, and redirecting toward a solution. We will also review the supervisor request process together. I will review {calls} of your calls within {followup}, focusing on calls with upset customers, and we will discuss them midweek. At the end of the {durationAdj} plan, we will review the results and agree on next steps.","example":[{"label":"When the customer is angry","say":"You've called about this more than once and it still isn't fixed, so I can see why you're upset. I'm going to look at everything that has happened so far, and I'll tell you exactly what I can do today."},{"label":"Supervisor request","say":"I hear you, and I'll take care of that request. Before I do, may I take one more look at the account? There may be something I can resolve for you right now."}],"questions":["At what point in the call did the customer's frustration start to rise, and what was happening then?","What did the customer need to hear from you before they would be ready to listen to the policy?","How will you keep your own tone steady when a customer raises their voice or asks for a supervisor?"],"strengths":["s-verification","s-billing","s-diagnosis","s-resolution"],"b":{"obs":"met the customer's frustration with policy before they had finished speaking and grew defensive as the tension rose","focus":"calm de-escalation","commit":"let an upset customer finish, acknowledge the specific frustration, keep your voice calm and steady, and lead with what you can do","mx":"Every reviewed call with an upset or angry customer during the next {duration} shows the customer allowed to finish, a specific acknowledgement, and a calm, solution-first response.","coach":"a roleplay with an escalating customer that includes a supervisor request"},"note":"Confirm the program's current supervisor request and escalation process before the session, so the roleplay matches what the agent is expected to do."},{"id":"com-emotional-ownership","cat":"com","title":"Lack of Emotional Ownership","desc":"Distancing language that places responsibility on another department, the system, or others, instead of owning the customer's experience with 'I' and 'we' statements.","kw":["emotional ownership","ownership language","blaming","blame","another department","not my department","the system did it","they did it","distancing","deflecting","excuses","i and we","we language","accountability","pointing fingers","passing the blame"],"tags":["Soft Skills","Ownership","Customer Connection"],"kpi":["QA","Transfer"],"theme":"connect","feedback":"As you explained what had gone wrong, you described the problem as something another department or the system had caused, with phrases such as 'that's a different department' and 'they set it up wrong.' Even when another team was involved, the customer sees one company, and distancing language can sound like you are stepping away from their problem rather than taking it on. That may leave the customer feeling passed between people with no one in charge, which can quickly turn frustration into distrust. The better approach is to talk about the issue as yours to help solve, use 'I' and 'we' instead of 'they', and focus on what you will do next.","impact":"A lack of emotional ownership often comes from wanting to make it clear that you did not cause the problem, or from repeating how other teams describe an issue. The customer is not looking for someone to blame, but for someone to take charge. Distancing language can make them feel handed off before any transfer happens, which may increase supervisor requests, avoidable transfers, and doubts that the issue will be handled.","plan":"Throughout the next {duration}, you will describe every concern and next step using 'I' and 'we' language, such as 'I'm going to take care of this' or 'let's get this corrected together.' When another team needs to be involved, explain what you are doing to connect the customer with them and how you will pass along what they have already told you, instead of describing it as someone else's problem. Avoid blaming the system, other departments, or the customer. We will review {calls} applicable calls within {followup}, targeting ownership language and no blame placed on others in all {calls} calls.","followup":"During our session, we will complete a language swap exercise in which you take a list of common distancing phrases and rewrite each one as an ownership statement you would be comfortable using. I will review {calls} of your calls within {followup} and note each place where ownership language was used or missed. We will talk through examples at a midweek check-in and complete a final review at the end of the {durationAdj} coaching period.","example":[{"label":"Instead of blaming another team","say":"I can see the order wasn't completed the way it should have been, and I'm going to take care of it for you. I'll make the correction now and walk you through what happens next."},{"label":"When another team must help","say":"This part needs a specialist team, so I'm going to set that up for you and pass along everything you've told me so they have the full picture."}],"questions":["When you described what went wrong, how do you think the customer heard the word 'they'?","How can you be honest that another team is involved while still showing that you own the customer's experience?","Which ownership phrases feel natural to you that you could use on your next call?"],"strengths":["s-tone","s-probing","s-billing","s-troubleshooting"],"b":{"obs":"described the problem as something another department or the system had caused, using distancing language instead of owning the customer's experience","focus":"ownership language","commit":"use 'I' and 'we' language when describing the concern and next steps, and avoid placing blame on other teams, systems, or the customer","m":"ownership language throughout, with no blame placed on other teams or systems","coach":"a language swap exercise that rewrites distancing phrases as ownership statements"},"note":"Accurately explaining that another team handles part of a request is not distancing. Coach the wording and the sense of ownership, not the routing itself."},{"id":"com-clarity","cat":"com","title":"Confusing Explanations / Communication Clarity","desc":"Explanations that are long-winded, disorganized, or full of internal terms, making it hard for the customer to follow the main point or the next step.","kw":["clarity","unclear","confusing","confused customer","long-winded","rambling","too much information","over explaining","hard to follow","jargon","internal terms","acronyms","plain language","simple explanation","concise","explanation","communication"],"tags":["Communication","Clarity","Customer Education"],"kpi":["QA","aiCR"],"theme":"delivery","feedback":"When you explained what would happen next, the information came out in a long stream with no clear order, and some of it relied on internal terms the customer was unlikely to know. The main point was buried in extra detail, so the customer had to work to understand what to expect. The customer will act on what you tell them, and a confusing explanation can lead to missed steps, wrong assumptions, or a second call to have it explained again. Next time, lead with the main point, break the rest into short steps in everyday words, and pause to check that the customer is following.","impact":"Unclear explanations often come from knowing a process so well that the steps feel obvious, or from trying to share everything at once to be thorough. When the customer cannot follow, they may agree without understanding, act on the wrong information, or call back to ask again, which can drive repeat contacts and longer calls. Internal terms can also make the customer feel shut out of their own account.","plan":"During the next {duration}, you will organize each explanation by stating the main point first, then giving the supporting details in short, ordered steps. Replace internal terms, abbreviations, and system names with everyday words, and when a specific term is necessary, explain it in a few words. After any explanation with more than one step, ask the customer to tell you what they will do next or check that it makes sense to them. We will review {calls} applicable calls within {followup}, targeting explanations that lead with the main point and use plain language in all {calls} calls.","followup":"In our session, we will take one explanation from this call and rewrite it together so the main point comes first and the internal terms are gone, then you will practice saying it aloud as if to a customer hearing it for the first time. I will review {calls} of your calls within {followup} with a focus on how easy your explanations are to follow, and we will hold a short midweek check-in. We will complete the review at the end of the {durationAdj} plan.","example":[{"label":"Main point first","say":"Here's the short version. Your bill went up because a promotional rate ended this month. I'll walk you through the two changes on the bill, and then we can look at your options."},{"label":"Replacing internal terms","say":"To put it simply, your account still lists your old modem, so the new one isn't recognized yet. I'm going to update that now, and then we'll check that everything connects."}],"questions":["If the customer had to repeat your explanation back to you, what do you think they would have said?","Which terms in your explanation might be familiar to you but new to the customer?","How would you shorten that explanation so the main point comes through in the first sentence?"],"strengths":["s-empathy","s-ownership","s-diagnosis","s-tools"],"b":{"obs":"gave explanations that were long, out of order, or full of internal terms, which made it hard for the customer to follow the main point","focus":"clear explanations","commit":"lead with the main point, explain the details in short steps using everyday words, and check that the customer is following","m":"explanations that lead with the main point and use plain, everyday language","coach":"an exercise rewriting one explanation from the call with the main point first"},"note":"For explanations of technical concepts specifically, the Unclear Technical Explanations entry in the Technical Support category may be a better fit."},{"id":"com-opening","cat":"com","title":"Weak Call Opening","desc":"A rushed or incomplete greeting and introduction, or a slow start in engaging the reason for the call, leaving the conversation without a clear direction.","kw":["call opening","opening","greeting","no greeting","introduction","no introduction","intro","rushed greeting","branded greeting","first impression","start of call","slow start","reason for call","call direction","set the agenda","opening statement"],"tags":["Call Structure","First Impression","Professionalism"],"kpi":["QA"],"theme":"structure","feedback":"At the start of the call, your greeting was rushed, the introduction was incomplete, and the conversation took a while to reach the reason the customer was calling. The opening is the customer's first impression of you and the company, and it sets the tone for the rest of the call. A hurried or unclear start can leave the customer unsure who they are speaking with, and a slow move to the concern can make the call feel long before any work begins. Moving forward, open with a clear, unhurried greeting and introduction, invite the customer to share the reason for the call, and tell them how you will proceed.","impact":"A weak opening often comes from treating the greeting as a formality to get through quickly, especially on a busy queue or right after a difficult call. The first few seconds shape how confident the customer feels in you, and a rushed or unclear start can make them guarded or unsure they reached the right team. A slow move to the concern can also add handle time without adding value.","plan":"Beginning with your next shift and continuing for {duration}, you will open every call with the program's standard greeting at a calm, clear pace, including your name, and invite the customer to share the reason for the call. Once they explain, respond with a short acknowledgement and tell the customer how you will proceed, such as verifying the account and then reviewing the concern together. Have your tools ready before the call connects so your attention is on the customer from the first word. We will review {calls} applicable calls within {followup}, targeting a complete, unhurried greeting and a clear direction set early in all {calls} calls.","followup":"During our session, we will listen to the first minute of this call and then practice the full opening together, from greeting through setting direction, until it feels natural at a steady pace. You will also complete a short self-assessment of the opening on {calls} of your calls within {followup}, and I will review the same calls. We will compare notes midweek and confirm the results together at the end of the {durationAdj} plan.","example":[{"label":"Greeting","say":"Thank you for calling, and thanks for waiting. I'm happy to help you today. What can I take care of for you?"},{"label":"Setting direction","say":"I can help with your bill. First, I'll verify the account, and then we'll go through the changes together so you know exactly what happened."}],"questions":["How do you think the customer felt in the first few seconds of this call?","What would help you start each call at a steady, unhurried pace, even on a busy queue?","After the customer explains why they called, how could you set a clear direction for the rest of the call?"],"strengths":["s-empathy","s-troubleshooting","s-resolution","s-closing"],"b":{"obs":"rushed through the greeting and introduction and took longer than needed to engage the customer's reason for calling","focus":"clear call openings","commit":"open with a clear, unhurried greeting and introduction, invite the reason for the call, and tell the customer how you will proceed","m":"a complete, unhurried greeting and a clear direction set early in the call","coach":"a practice run of the full call opening, from greeting to setting direction"},"note":"Confirm the program's current greeting and branding standard before the session. The example greeting leaves out the agent's name and the brand, so pair it with the standard wording."},{"id":"com-call-flow","cat":"com","title":"Poor Call Flow","desc":"A disorganized call sequence that jumps between topics, backtracks to earlier steps, and moves on without transitions, leaving the customer unsure what is happening.","kw":["call flow","flow","disorganized","jumping around","jumping between topics","backtracking","out of order","transitions","no transitions","signposting","sequence","structure","organized","scattered","all over the place","roadmap","agenda"],"tags":["Call Structure","Organization","Clarity"],"kpi":["QA","aiCR"],"theme":"structure","feedback":"Over the course of the call, the conversation moved between topics without a clear order. You started on one concern, switched to another before finishing, and later returned to steps that had already been covered, often without telling the customer why. When a call follows no visible structure, the customer cannot tell what has been handled and what is still open, and the conversation can feel scattered and longer than necessary. From here, outline a short plan once you understand the concerns, finish one topic before starting the next, and use brief transitions such as 'Now that the bill is sorted, let's look at your internet' so the customer always knows where you are.","impact":"Poor call flow usually comes from reacting to each item as it comes up instead of planning the order of the call, or from switching tasks while waiting on a system. Without a clear sequence, steps can be missed or repeated, the customer may lose track of what was resolved, and handle time can grow. A scattered call can also lower the customer's confidence that every concern was addressed, increasing the chance they call back to check.","plan":"For the next {duration}, you will tell the customer how the call will proceed once you understand the concerns, for example, 'First we'll take care of the billing question, and then we'll look at the internet speed.' Handle one topic at a time and close it out before moving on, and use a short transition sentence whenever you change topics. If you need to go back to an earlier step, explain why before doing so. We will review {calls} applicable calls within {followup}, targeting a stated plan and a clear transition at each change of topic in all {calls} calls.","followup":"In our session, we will map out the sequence of this call together, mark the points where the topic changed without a transition, and then reorder it into the flow it could have followed. I will review {calls} of your calls within {followup} using the same mapping approach, and we will talk through one of them at a midweek check-in. At the end of the {duration}, we will review all the calls together and agree on any next steps.","example":[{"label":"Setting the plan","say":"You've mentioned two things, the higher bill and the slow internet. Let's start with the bill so you have answers there, and then we'll test your connection."},{"label":"Transitioning between topics","say":"That takes care of the billing question. Now let's move on to your internet speed."}],"questions":["Looking back at the call, where did the conversation change direction, and what prompted each change?","What would have helped the customer know which part of the call they were in at each point?","How could you plan the order of a call with several concerns before you start working on them?"],"strengths":["s-empathy","s-rapport","s-opening","s-resolution"],"b":{"obs":"moved between topics without a clear order or transitions and returned to steps already covered, which made the call hard to follow","focus":"organized call flow","commit":"share a short plan for the call, finish one topic before starting the next, and use a brief transition each time you move on","m":"a stated plan for the call and a clear transition at each change of topic","coach":"a call mapping exercise that reorders this call into a clear sequence"},"note":"For steering long tangents and regaining control of the conversation, the Poor Call Control entry in the Hold, Mute & Call Control category may be a better fit."},{"id":"com-closing","cat":"com","title":"Weak Call Closing / No Recap","desc":"Ending the call without recapping what was done and what happens next, checking for other needs, or closing in a professional, branded way.","kw":["call closing","closing","no closing","closing statement","no recap","recap","summary","summarize","final summary","next steps","abrupt ending","abrupt close","ended call abruptly","anything else","branded closing","wrap up","end of call"],"tags":["Call Structure","Next Steps","Professionalism"],"kpi":["QA","aiCR"],"theme":"structure","feedback":"Before the call ended, you moved from the final step straight to goodbye without summarizing what was done or what the customer should expect next, and the close itself felt abrupt. The end of the call is often what the customer remembers most, and a recap is the last chance to confirm you both agree on what happened. Without it, they may leave unsure what was changed, what to watch for, or what to do if the issue returns. Going forward, close each call with a brief recap of the actions taken and the next steps, ask whether there is anything else you can help with, and end with the program's standard branded closing.","impact":"A weak closing often happens when the main issue is resolved and attention shifts to wrapping up quickly or getting ready for the next call. Without a recap, the customer may not remember what changed, what to expect, or what to do if the issue returns, which can lead to repeat contacts and confusion when a bill, appointment, or follow-up arrives. An abrupt close can also undo the goodwill built earlier in the call.","plan":"Over the next {duration}, you will end every call with a recap that covers what you did, what the customer can expect next, and any action or timeframe the customer needs to remember, based on the applicable process. After the recap, ask whether there is anything else you can help with, and give the customer a moment to answer. Close with the program's standard branded closing, at the same unhurried pace you used at the start. We will review {calls} applicable calls within {followup}, targeting a complete recap, a check for other needs, and a branded close in all {calls} calls.","followup":"During our session, we will build a short closing checklist together covering the recap, next steps, the check for other needs, and the branded close, and then roleplay two closings using it. I will review the final minutes of {calls} of your calls within {followup}, and we will look at one of them together at a midweek check-in. At the end of the {durationAdj} coaching period, we will review the full results and decide on next steps.","example":[{"label":"Recap and next steps","say":"Before we wrap up, here's a quick recap. We restarted your equipment, confirmed the connection is stable on your laptop and phone, and I noted everything on your account. If the drops come back, give us a call and we can pick up from where we left off today."},{"label":"Closing","say":"Is there anything else I can help you with today? Thank you for calling, and enjoy the rest of your evening."}],"questions":["If the customer had to explain to a family member what happened on this call, what would they say?","What does the customer need to remember after the call ends, and how could your recap cover it?","What would help you slow down at the end of a call instead of rushing to finish?"],"strengths":["s-opening","s-empathy","s-troubleshooting","s-diagnosis"],"b":{"obs":"wrapped up without recapping what was done or what happens next, and closed without checking for other needs or giving a branded close","focus":"complete call closings","commit":"recap what was done and what happens next, check for any other needs, and end with the program's standard branded closing","m":"a recap of actions and next steps, a check for other needs, and a branded close","coach":"a closing checklist exercise followed by a roleplay of a complete call closing"},"note":"Confirm the program's current closing and branding standard before the session, including any required closing statements."},{"id":"dis-missing-probing","cat":"dis","title":"Missing Probing Questions","desc":"Moving to an assumption or a solution without asking discovery questions to understand what the customer is experiencing.","kw":["probing","no probing","no questions","questions","discovery","no discovery","probe","open-ended","assumptions","assumed","jumped to solution","guessing","did not ask","fact finding","clarifying questions","understand the issue","wrong fix"],"tags":["Discovery","Probing","Issue Analysis"],"kpi":["QA","aiCR","Transfer"],"theme":"discover","feedback":"When the customer described the issue, you moved straight to a solution without asking any questions to understand what they were experiencing. Discovery turns a general complaint into a clear picture, and without it, the step you offered rested on an assumption rather than on the customer's actual situation. If that assumption is wrong, the customer can end up repeating steps that do not apply, being sent to the wrong team, or calling back with the same problem. Next time, ask at least three open-ended questions about what is happening, when it started, and how it is affecting them, then summarize what you heard before deciding what to do.","impact":"Skipping discovery usually happens when a concern sounds familiar and the answer seems obvious from the first sentence. Many issues share the same symptoms, though, so acting on that first impression can send the call in the wrong direction. The customer may receive a fix that does not apply, be transferred to a team that cannot help, or call back with the same problem, which can affect quality results, transfer rates, and repeat contacts.","plan":"For the next {duration}, you will ask at least three open-ended discovery questions before recommending any solution, transfer, or troubleshooting step. Focus the questions on what the customer is experiencing, when it began, and how it affects them, then summarize the concern back in one or two sentences before you act. When an issue sounds familiar, treat that as a reason to confirm the details rather than assume them. We will review {calls} applicable calls within {followup}, targeting at least three open-ended questions and a summary of the concern before any solution in all {calls} calls.","followup":"In our session, we will listen to the first few minutes of this call together, pause at the moment the solution was offered, and rewrite that moment with the questions that could have come first. I will review {calls} of your calls within {followup} and count the open-ended questions asked before each solution. We will compare those counts at the end of the {durationAdj} plan to decide whether more practice is needed.","example":[{"label":"Before offering a fix","say":"Before I suggest a fix, I want to make sure I understand exactly what's happening. Can you walk me through what you see when the problem shows up, and when you first noticed it?"},{"label":"After the answers","say":"Thank you, that helps. So the picture freezes on every channel, and it started last night. Based on that, here is what I'd like to check first."}],"questions":["What made the solution you offered feel right before you had asked the customer any questions?","Which two or three questions would have given you the clearest picture of what the customer was experiencing?","How can you tell, early in a call, that you may be acting on an assumption instead of the facts?"],"strengths":["s-empathy","s-tone","s-ownership","s-tools"],"b":{"obs":"moved to a solution without asking any questions about the issue, so the next step rested on an assumption rather than on the facts","focus":"open-ended discovery questions","commit":"ask at least three open-ended questions about what the customer is experiencing before offering any solution, transfer, or troubleshooting step","m":"at least three open-ended questions and a summary of the concern before any solution is offered","coach":"a listen-back of the call opening, rewriting the moment the solution was offered with stronger questions"},"note":"Use this entry when little or no discovery took place before a solution. If some questions were asked but lacked depth, Insufficient Probing is the better fit."},{"id":"dis-insufficient-probing","cat":"dis","title":"Insufficient Probing","desc":"Asking some discovery questions but stopping too early or relying on yes or no questions, leaving details such as timing, frequency, or recent changes unknown.","kw":["insufficient probing","probing","not enough questions","shallow questions","surface level","closed questions","yes or no questions","open-ended","follow-up questions","probe deeper","depth","when did it start","how often","what changed","more details","stopped too early","incomplete discovery","discovery"],"tags":["Discovery","Probing","Question Depth"],"kpi":["QA","aiCR"],"theme":"discover","feedback":"You asked a few questions, but most could be answered with a yes or no, and discovery ended before the details that shape the fix came out. Key points, such as when the issue started, how often it happens, which devices or services are affected, and whether anything changed recently, were not fully explored. Those answers are what separate one possible cause from another. Without them, troubleshooting can treat the general symptom and miss the actual cause, which can leave the customer needing to call back. On future calls, build on your first question with open-ended follow-ups on timing, frequency, what is affected, and recent changes before choosing a next step.","impact":"Shallow probing often comes from wanting to keep the call moving, or from recognizing a common symptom and treating the first answer as enough. Closed questions tend to confirm what you already suspect, but they rarely reveal what you did not think to ask. When discovery stops early, the customer may go through steps that do not fit the real cause, and the issue is more likely to return, which can lead to repeat contacts and lower quality results.","plan":"Over the next {duration}, you will go beyond your first question on every applicable call by asking open-ended follow-ups about when the issue started, how often it occurs, what is affected, and what changed recently. When a customer gives a short answer, ask one more question to draw out the detail behind it. Before choosing a next step, summarize what you learned in one sentence so the customer can correct anything you missed. Within {followup}, we will review {calls} applicable calls, and the target is for every one of them to show timing, frequency, what is affected, and recent changes explored before a next step.","followup":"During our session, we will build a short probing checklist covering timing, frequency, what is affected, and recent changes, then roleplay a customer who gives brief, one-word answers so you can practice drawing out more detail. Within {followup}, I will score {calls} of your calls against that checklist, and we will meet briefly midweek to talk through any call where discovery felt rushed. At the end of {duration}, we will review the results and decide whether you still need the checklist as a prompt.","example":[{"label":"After a short answer","say":"Okay, so it keeps dropping. When did you first notice that, and does it happen at certain times of day or throughout the day?"},{"label":"Going one level deeper","say":"Has anything changed recently, like a new device, moving the equipment, or a power outage? Those details help me find the cause instead of guessing."}],"questions":["Which of your questions could the customer answer with a single word, and what did that leave you not knowing?","What details about timing, frequency, or recent changes might have changed the step you chose?","When a customer gives a short answer, what follow-up could you ask to get the full story?"],"strengths":["s-acknowledgement","s-tone","s-itg","s-ownership"],"b":{"obs":"asked a few questions but relied mostly on yes or no answers and stopped before learning when the issue started, how often it happens, or what changed","focus":"deeper probing","commit":"build on your first question with open-ended follow-ups about timing, frequency, what is affected, and recent changes before choosing a next step","m":"timing, frequency, what is affected, and recent changes explored before a next step is chosen","coach":"a probing checklist exercise and a roleplay with a customer who gives brief answers"},"note":"If no discovery questions were asked at all, use Missing Probing Questions. On billing calls, adapt the details to the charge, the billing period, and what changed on the account."},{"id":"dis-early-troubleshooting","cat":"dis","title":"Starting Troubleshooting Too Early","desc":"Starting troubleshooting steps before the customer's concern is fully understood, even when a question or two has been asked first.","kw":["troubleshooting too early","jumped into troubleshooting","started too soon","premature troubleshooting","rushed","sequence","order of steps","skipped discovery","restart first","reboot right away","before understanding","discovery first","probing","assumptions","jumped ahead","wrong steps"],"tags":["Discovery","Call Flow","Troubleshooting"],"kpi":["QA","aiCR"],"theme":"discover","feedback":"Before the concern was fully understood, you began walking the customer through troubleshooting steps. You asked a question or two, but the first step came before you had enough information to know which steps would actually apply. Troubleshooting works best as a response to a clear picture of the problem, and starting early can send the customer through restarts and checks that have nothing to do with the cause, lengthening the call and testing their patience. Instead, hold the first step until you have confirmed the symptom, when it started, and what it affects, then explain which step you are starting with and why.","impact":"Starting troubleshooting too early usually comes from a strong desire to fix things quickly, especially when the symptom sounds routine. The order matters, though. Steps chosen before the concern is clear are more likely to miss the cause, repeat work the customer does not need, and add handle time. The customer may also lose confidence in the process, which can lead to pushback on later steps and a higher chance of a repeat contact.","plan":"Starting with your next call and continuing for {duration}, you will complete discovery before the first troubleshooting step. Before recommending any step, confirm three things: the symptom in the customer's words, when it started, and what it affects. Then tell the customer which step you are starting with and why it fits what they described. Success on this plan means those three points are confirmed before the first step on all {calls} troubleshooting calls reviewed within {followup}.","followup":"We will listen to this call side by side and mark two moments on the recording: when troubleshooting began and when the concern was actually clear. Then we will practice a short bridge statement that moves from discovery into the first step. I will review {calls} troubleshooting calls within {followup}, checking the gap between those same two moments, and we will review the full picture once the {durationAdj} plan is complete.","example":[{"label":"Bridging into troubleshooting","say":"So the internet stopped working on every device this morning, and nothing has changed in your home. Thank you, that tells me a lot. Based on that, I'd like to start by checking the signal to your equipment, because that fits what you're describing."}],"questions":["At what point did you feel you understood the concern well enough to start troubleshooting?","What information were you still missing when you recommended the first step?","How could you explain to the customer why you are starting with a particular step?"],"strengths":["s-empathy","s-acknowledgement","s-tools","s-clarity"],"b":{"obs":"began troubleshooting steps before the concern was fully understood, so the first step was chosen before the cause was clear","focus":"discovery before troubleshooting","commit":"confirm the symptom, when it started, and what it affects before the first troubleshooting step, then explain why that step fits","m":"the symptom, start time, and impact confirmed before the first troubleshooting step","coach":"a side-by-side listen marking when troubleshooting began and when the concern became clear"},"note":"Use this when steps started before discovery was complete, even if some questions were asked. If no questions were asked at all, Missing Probing Questions may fit better."},{"id":"dis-main-concern","cat":"dis","title":"Not Identifying the Main Concern","desc":"Missing the customer's actual reason for calling during discovery, so time and effort go to a secondary or assumed issue.","kw":["main concern","primary concern","reason for call","reason for calling","wrong issue","missed the issue","secondary issue","assumed issue","multiple issues","real issue","misunderstood","what the customer wanted","restate the concern","call driver","off track","assumptions","discovery","questions"],"tags":["Discovery","Issue Identification","Call Direction"],"kpi":["QA","aiCR","Transfer"],"theme":"discover","feedback":"Early in the call, your questions did not uncover the customer's actual reason for calling, so the work that followed went toward a secondary or assumed issue. Customers often lead with a symptom or a side comment, and the real concern only comes out when you confirm what they most need from the call. Without that confirmation, the customer can leave with something addressed and still not have what they called about, which is frustrating and often leads to another call. Moving forward, restate what you heard, ask which concern matters most today, and confirm it in the customer's words before you begin working.","impact":"Missing the main concern often comes from anchoring on the first issue mentioned or on the one that is quickest to handle. When several topics come up, the customer's priority can get lost if it is never confirmed. Effort then goes to the wrong problem, the customer may be routed to a department that handles a different issue, and the concern that was never addressed is likely to bring them back. That pattern can show up in quality results, transfers, and repeat contacts.","plan":"During the next {duration}, you will confirm the main reason for every call before you start working on it. After the customer explains, restate the concern in one sentence and ask whether that is the most important thing to address today. When more than one issue comes up, list them back, agree on the order with the customer, and note the secondary items so none are lost. When we review {calls} applicable calls within {followup}, the target is a main concern stated back and confirmed by the customer before any work begins on every call.","followup":"We will listen to a strong call example together where the main concern is confirmed early, followed by a roleplay in which the customer raises three different issues in one breath, so you can practice sorting them and confirming the priority. Over the following {followup}, I will listen to {calls} of your calls for the moment the main concern is confirmed, and we will go over the results together at the close of the {durationAdj} plan.","example":[{"label":"Confirming the priority","say":"I'm hearing two things today, the higher bill this month and the TV box that keeps freezing. Which one is most important to you, so I can make sure we take care of it first?"},{"label":"Restating the concern","say":"So the main reason for your call is that your internet drops every evening during your video calls. Did I get that right?"}],"questions":["What do you think was the customer's main reason for calling, and when did it first come up?","What made the issue you worked on seem like the priority at the time?","How could you confirm the main concern when a customer mentions several problems at once?"],"strengths":["s-rapport","s-tone","s-troubleshooting","s-tools"],"b":{"obs":"did not uncover the customer's main reason for calling, so the effort went toward a secondary or assumed issue","focus":"identifying the main concern","commit":"restate the concern, ask which issue matters most today, and confirm the main reason for the call before starting any work","m":"the main reason for the call confirmed in the customer's words before work begins","coach":"a roleplay sorting several customer concerns and confirming which one comes first"},"note":"If the main concern was identified but not resolved, use Not Resolving the Primary Concern under Ownership instead. This entry covers discovery that missed the concern."},{"id":"dis-customer-needs","cat":"dis","title":"Not Understanding Customer Needs","desc":"Understanding the issue but not the customer's goals, situation, or constraints, so the solution offered does not fit how they actually use the service.","kw":["customer needs","needs","goals","context","situation","constraints","usage","how they use it","working from home","many devices","budget","accessibility","one size fits all","personalize","tailor","solution fit","lifestyle","discovery","questions"],"tags":["Discovery","Customer Needs","Personalization"],"kpi":["QA","aiCR"],"theme":"discover","feedback":"Once the issue was identified, you moved to a solution without learning about the customer's situation, such as how they use the service or what limits they are working within. Your answer may have been accurate, but a solution only helps when it fits the customer's circumstances, whether that means working from home, managing many devices, staying within a budget, or needing an accessible option. When it does not fit, the customer may decline it, struggle to use it, or call back for something different. The expectation is to ask about goals and constraints before recommending a solution and explain how it fits what the customer shared.","impact":"This gap often comes from treating the issue as the whole story. Two customers with the same problem can need very different solutions depending on their schedule, household, budget, or accessibility needs. When a recommendation does not match those circumstances, the customer is more likely to feel processed rather than helped, to reject or misuse the solution, and to reach out again, which can affect satisfaction, quality results, and repeat rates.","plan":"On every call over the next {duration} that leads to a recommendation, you will first ask at least one question about the customer's goals or circumstances, such as how they use the service, who relies on it, or any limits on time, budget, or accessibility. Then connect your recommendation to what they told you, in a sentence that names their situation. Across the {calls} applicable calls we review within {followup}, the target is for every recommendation to connect to at least one need the customer shared.","followup":"We will roleplay three short customer profiles that share the same issue, such as a customer working from home, a household with many devices, and a customer on a tight budget, so you can practice asking about needs and adjusting the recommendation for each. You will complete a brief self-assessment on {calls} applicable calls within {followup}, and I will review the same calls before we discuss them. We will compare your self-assessments with my review at the end of the {durationAdj} period.","example":[{"label":"Asking about needs","say":"Before I recommend anything, can you tell me a little about how you use the internet day to day? For example, is anyone working or studying from home, and about how many devices are usually connected?"},{"label":"Connecting the solution","say":"Since you're on video calls most of the day from your home office, I'd suggest moving the gateway closer to that room. That can give you a stronger connection where you need it most."}],"questions":["What did you learn about how the customer uses the service, and what would you have liked to know?","How might the customer's situation have changed the solution you recommended?","What question could you ask early in the call to learn what the customer needs the service to do for them?"],"strengths":["s-diagnosis","s-troubleshooting","s-clarity","s-acknowledgement"],"b":{"obs":"understood the issue but not the customer's goals or constraints, so the solution did not reflect how they use the service","focus":"understanding customer needs","commit":"ask about the customer's goals, usage, and constraints before recommending a solution, and explain how the recommendation fits their situation","m":"a recommendation tied to at least one goal or constraint the customer shared","coach":"a roleplay of three customer profiles that share an issue but need different solutions"},"note":"Check whether the solution matched the situation the customer described. On sales conversations, Missing Sales Discovery covers needs questions before an offer."},{"id":"dis-contact-history","cat":"dis","title":"Missing Previous Contact History","desc":"Not reviewing notes or prior interactions before working the concern, so the customer re-explains the issue or steps that already failed are repeated.","kw":["contact history","history","notes","account notes","review notes","previous contact","prior contact","interaction history","previous calls","called before","already called","repeat caller","repeat contact","re-explain","explain again","start over","aicr","repeat rate"],"tags":["Discovery","Contact History","Repeat Contacts"],"kpi":["QA","aiCR"],"theme":"discover","feedback":"At the start of the call, you began discovery without reviewing the notes from the customer's previous contacts. As a result, the customer had to explain the history again, and you risked repeating steps that had already been tried. A customer who has called before expects the conversation to pick up where it left off, and starting over can tell them their earlier time did not count. That can turn a solvable issue into a trust problem and add to repeat contacts. Going forward, review recent notes and interactions before or early in discovery, acknowledge the previous contact, and build on what was already done.","impact":"Contact history is often skipped when the focus is on starting the conversation quickly or when the notes take extra effort to find. The customer, however, remembers every previous call. Repeating the same questions and steps can make them feel they are starting over, increase handle time, and lower their confidence that this call will be different, which can raise the chance of another contact or an escalation request.","plan":"Over the next {duration}, you will review the account notes and recent interactions at the start of every call, before asking the customer to describe the issue in full. When there is a recent contact about the same concern, acknowledge it, summarize what was already done, and ask what has happened since. Avoid repeating a step the notes show was completed unless there is a clear reason, and explain that reason to the customer. We will review {calls} calls with a recent prior contact within {followup}, targeting a history acknowledgement and no unexplained repeated steps in each one.","followup":"First, we will walk through where previous notes and interactions can be found in the approved tools and practice turning them into a short summary you can share at the start of the call. I will review {calls} calls with a recent prior contact within {followup}, checking whether the history was acknowledged and built on, and we will look at the results together when the {durationAdj} plan ends.","example":[{"label":"Opening with the history","say":"I can see you called a couple of days ago about the connection dropping, and the equipment was restarted then. Thank you for sticking with this. Can you tell me what's happened since that call?"},{"label":"Building on what was done","say":"Since the restart was already done, I won't ask you to repeat it. Let's look at what else could be causing this."}],"questions":["What could the notes from the earlier contact have told you before the customer started explaining?","How do you think it felt for the customer to describe the history from the beginning again?","Where in your call opening can you build in a quick review of recent notes and interactions?"],"strengths":["s-empathy","s-deescalation","s-tone","s-troubleshooting"],"b":{"obs":"began working the concern without reviewing notes from previous contacts, so the customer had to explain the history again","focus":"contact history review","commit":"review the account notes and recent interactions at the start of each call and acknowledge any prior contact before asking the customer to explain","mx":"Every reviewed call with a recent prior contact during the next {duration} includes an acknowledgement of that history and no unexplained repeated steps.","coach":"a tools walkthrough showing where to find previous notes and interactions"},"note":"Confirm where prior notes and interactions are found in your program's approved tools before the session. Choose calls with a recent prior contact so the behavior can be measured."},{"id":"dis-prior-troubleshooting","cat":"dis","title":"Not Confirming Troubleshooting Already Completed","desc":"Not asking what the customer has already tried before recommending steps, leading to repeated restarts and checks the customer already completed.","kw":["already tried","prior troubleshooting","steps already done","what have you tried","repeated steps","same steps","redundant steps","restart again","reboot again","already restarted","previous steps","self-help","customer effort","frustrated","troubleshooting","discovery","questions"],"tags":["Discovery","Troubleshooting","Customer Effort"],"kpi":["QA","aiCR"],"theme":"discover","feedback":"In this interaction, you began recommending steps without asking what the customer had already tried on their own. Many customers restart their equipment, check connections, or follow online help before they call, so asking first saves time and respects the effort they have already made. When a customer is asked to repeat a step they completed shortly before calling, it can feel like they are not being listened to, and that frustration often carries into the rest of the call. Make it a habit to ask what has already been tried, and when, before recommending anything, and if a step does need to be repeated, explain why.","impact":"This usually happens when the troubleshooting flow is followed from the first step without checking where the customer already is in the process. Repeating steps the customer has completed adds handle time and effort, and it can make them doubt that this call will lead anywhere different. A frustrated customer is less likely to cooperate with the steps that actually matter, and if the issue is not resolved, the customer may need to call again.","plan":"For the next {duration}, you will ask every customer with a technical concern what they have already tried, and when, before recommending the first step. Acknowledge what they have done, and skip completed steps where the applicable ITG flow allows, explaining the reason whenever a step needs to be repeated. We will review {calls} troubleshooting calls within {followup}, with the target of a question about prior steps before the first recommendation, and a clear reason given for any repeated step, in all {calls} calls.","followup":"We will create a personal phrase bank of natural ways to ask what the customer has already tried and to explain when a step needs to be repeated. I will then pull {calls} troubleshooting calls from the next {followup} and point out each place where a completed step was handled well or repeated without explanation. We will review the overall results at the {durationAdj} mark.","example":[{"label":"Before the first step","say":"Before we start, what have you already tried on your end? For example, have you restarted the equipment or checked the cables, and about when was that?"},{"label":"When a step must be repeated","say":"I know you restarted it this morning. I'd like to do one more restart while I watch the connection from here, because that shows me something I can't see otherwise."}],"questions":["What do you think the customer had tried before calling, and how could you have found out?","How might a customer react when asked to repeat a step they already completed earlier that day?","What could you say when a step really does need to be repeated, so the customer understands why?"],"strengths":["s-acknowledgement","s-itg","s-tools","s-empathy"],"b":{"obs":"recommended steps without asking what the customer had already tried, which risked repeating restarts and checks they had completed","focus":"confirming prior troubleshooting","commit":"ask what the customer has already tried, and when, before recommending the first step, and explain why whenever a step must be repeated","mx":"Every troubleshooting call reviewed during the next {duration} includes a question about steps already tried before the first recommendation.","coach":"a phrase bank exercise for asking about steps the customer already completed"},"note":"This entry covers steps the customer took on their own, which may not appear in any notes. If earlier contacts were not reviewed, use Missing Previous Contact History."},{"id":"dis-issue-scope","cat":"dis","title":"Not Isolating the Scope of an Issue","desc":"Not narrowing down how far the issue reaches, such as one device or all devices, Wi-Fi or wired, one line or the whole account, or constant or intermittent.","kw":["scope","isolate","isolation","narrow down","one device","all devices","wifi","wi-fi","wired","ethernet","one room","whole home","one line","multiple services","intermittent","how widespread","pattern","root cause","probing","discovery"],"tags":["Discovery","Troubleshooting","Issue Isolation"],"kpi":["QA","aiCR"],"theme":"discover","feedback":"After the customer reported the problem, you began working on it without narrowing down how far it reached. You did not establish whether it affected one device or all of them, Wi-Fi or wired connections, one room or the whole home, a single line or the entire account, or whether it was constant or intermittent. Each of those answers points to a different cause, so skipping them can lead to steps aimed at the wrong part of the problem, an unnecessary technician visit, or a fix that does not last. Going forward, ask isolating questions early and use the answers to decide where troubleshooting should start.","impact":"Scope gaps often come from assuming the problem is exactly what the customer first noticed, without checking where else it shows up. Scope is one of the quickest ways to separate an equipment issue from a device setting, a Wi-Fi coverage gap from a signal problem, or a single-line issue from an account-level one. Without it, troubleshooting can target the wrong area, add handle time, lead to unnecessary equipment swaps or visits, and leave the real cause in place, which makes a repeat contact more likely.","plan":"Beginning with your next technical call and continuing for {duration}, you will confirm the scope of the issue before the first troubleshooting step. Ask whether the problem affects one device or all devices, Wi-Fi or wired connections, one room or the whole home, one line or service or the whole account, and whether it is constant or comes and goes. Then tell the customer what the scope suggests and where you will start. Within {followup}, {calls} technical calls will be reviewed, and the goal is for every one to show the scope confirmed and explained before troubleshooting begins.","followup":"We will walk through the isolation steps in the applicable ITG flow together, then complete a quick knowledge check using a few short scenarios, such as one laptop that cannot connect or a mobile line that drops calls only at home. I will review {calls} technical calls within {followup}, and we will check in midweek on any call where the scope was hard to pin down. We will close out the {durationAdj} plan with a review of the results.","example":[{"label":"Isolating the issue","say":"That helps. Is this happening on every device in the home, or mainly on one? And if anything is connected with a cable, is that working, or does it drop too?"},{"label":"Explaining the scope","say":"Since only the laptop is affected and everything else connects fine, the home network looks okay. Let's focus on the laptop's connection first."}],"questions":["What did you know about how widespread the issue was when you chose the first step?","Which isolating question would have told you the most about the cause in this call?","How would your troubleshooting change if the issue affected one device rather than every device in the home?"],"strengths":["s-acknowledgement","s-empathy","s-tools","s-expectations"],"b":{"obs":"started troubleshooting without isolating the scope of the issue, such as one device or all devices, Wi-Fi or wired, or constant or intermittent","focus":"isolating issue scope","commit":"confirm the scope of the issue, including one device or all, Wi-Fi or wired, one line or the whole account, and constant or intermittent, before troubleshooting begins","m":"the scope of the issue confirmed and explained before the first troubleshooting step","coach":"a quick knowledge check on isolation questions using short device and coverage scenarios"},"note":"Confirm the isolation steps in the current ITG flow before the session. On Xfinity Mobile calls, scope can mean one line or several, or one location or everywhere."},{"id":"dis-irrelevant-questions","cat":"dis","title":"Asking Irrelevant Questions","desc":"Asking questions that do not relate to the customer's concern, including scripted questions that do not apply, which adds time and signals the customer was not heard.","kw":["irrelevant questions","unnecessary questions","unrelated questions","off topic","scripted questions","script","reading from script","not applicable","wasting time","too many questions","random questions","not listening","relevance","handle time","customer effort","discovery","probing"],"tags":["Discovery","Relevance","Customer Effort"],"kpi":["QA"],"theme":"discover","feedback":"Some of the questions you asked did not connect to the concern the customer described, and a few came from the standard flow even though the customer's earlier answers had already made them unnecessary. Every question asks the customer for time and effort, so each one should move the call closer to a solution. When questions seem unrelated, the customer may wonder whether you heard them, grow impatient, and give shorter answers to the questions that do matter. Instead, before each question, think about how the answer will change your next step, and adapt scripted questions that no longer apply, while keeping any the applicable process requires.","impact":"Irrelevant questions often come from following a script or a habit rather than responding to what the customer has said. Each unnecessary question adds handle time and customer effort, and it can send the message that the conversation is not really about them. Customers who feel unheard may become frustrated, less cooperative, or doubtful that the call is going anywhere, which can lower quality results and make the actual issue harder to resolve.","plan":"During the next {duration}, you will make sure each discovery question connects to the concern the customer described. Before asking a question, consider what you will do with the answer, and if it will not change your next step, leave it out or reword it to fit the situation. Required verification and process questions still apply, so introduce them with a brief reason when they may seem unrelated. The target for the {calls} calls we review within {followup} is zero unrelated questions, with every required question introduced with a brief reason.","followup":"As part of this coaching, you will listen back to this call and mark each question you asked as relevant or not, with a short note on why. We will compare notes and reword the questions that did not fit into ones that would have moved the call forward. I will apply the same relevance check to {calls} applicable calls within {followup}, and we will talk through what the results show when the {durationAdj} coaching period closes.","example":[{"label":"Staying on topic","say":"You mentioned the charge started after you added the new line, so let me look at what changed on the account that month."},{"label":"Explaining a required question","say":"I do need to ask one more question for security before I can make that change. It may not seem related, but it helps protect your account."}],"questions":["Which of your questions could you have left out without changing how you handled the concer
