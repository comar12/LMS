 and in the company.","The solution you provided was complete. You addressed each part of the concern the customer raised, including details that are easy to overlook, so nothing was left open when the call ended. A complete resolution saves the customer time and the frustration of discovering later that something was missed.","Before closing, you confirmed with the customer that the resolution worked and met their needs, instead of assuming the issue was handled. That final check shows the customer you care about the result, not only about finishing the call, and it reduces the chance of a repeat contact."]},{"id":"s-followup","group":"own","title":"Appropriate Customer Follow-Up","desc":"Makes clear follow-up commitments when needed and explains how they will happen.","kw":["follow-up","follow up","callback","call back","follow-up commitment","callback commitment","next contact","check back","commitment","case follow-up"],"v":["You made a clear follow-up commitment and explained how and when it would happen under the applicable process. When a customer knows what is coming next, they can plan around it instead of wondering whether anyone is still working on the issue.","Because the concern needed more time to resolve, you set up the appropriate follow-up and confirmed the best way to reach the customer. That step assures the customer that their concern will not be forgotten and saves them from calling back only to check on its status.","Your follow-up commitment was specific and realistic. Rather than a vague promise to look into it, you explained the next action, who would take it, and how the customer would hear about the outcome. Clear commitments build trust because the customer can see exactly how the concern will be carried forward."]},{"id":"s-itg","group":"tech","title":"Correct ITG Utilization","desc":"Follows the applicable ITG flow accurately and completely.","kw":["itg","itg flow","itg usage","troubleshooting guide","followed itg","itg steps","process adherence","guided troubleshooting","correct steps"],"v":["You followed the applicable ITG flow accurately and completely, working through each step in order rather than skipping ahead to a guess. Using the ITG this way leads to more reliable results and helps avoid unnecessary technician visits or repeat contacts.","Your use of the ITG was thorough and accurate. You selected the flow that matched the symptoms the customer described and completed it fully before drawing a conclusion, which gives the customer the best chance of a lasting fix and keeps the troubleshooting aligned with the program's standard.","While working through the applicable ITG flow, you explained each step to the customer in plain terms, so they could follow what was being checked and why. Pairing accurate ITG use with clear communication keeps the customer involved in the process and makes them more willing to complete the steps on their side."]},{"id":"s-troubleshooting","group":"tech","title":"Good Technical Troubleshooting","desc":"Works through troubleshooting in a logical, thorough sequence.","kw":["troubleshooting","technical troubleshooting","logical troubleshooting","thorough troubleshooting","diagnostics","tech support","step by step","isolate the issue","systematic","basic troubleshooting"],"v":["Your troubleshooting followed a logical sequence, starting with the basics and building toward more advanced steps based on what each result told you. A structured approach like this avoids wasted steps, keeps the customer from redoing actions unnecessarily, and makes it more likely that the real issue is found.","You were thorough in your troubleshooting, checking the relevant equipment, connections, and service status before recommending a next step. Taking the time to rule out the likely causes gives the customer an accurate answer and makes your recommendation much easier to trust.","After each step, you checked the result with the customer before moving on, so you knew exactly what had changed and what had not. Confirming results along the way keeps the troubleshooting accurate and efficient, and it helps the customer see that each action has a purpose."]},{"id":"s-diagnosis","group":"tech","title":"Correct Technical Diagnosis","desc":"Identifies the correct root cause before recommending a solution.","kw":["diagnosis","correct technical diagnosis","root cause","root cause analysis","correct diagnosis","accurate diagnosis","identified cause","pinpointed issue","isolated issue"],"v":["You identified the correct root cause before recommending a solution, relying on what your questions and checks revealed rather than on an assumption. An accurate diagnosis makes it much more likely that the fix you recommend will address the problem on the first contact.","Your diagnosis was accurate and well supported. Before deciding on a solution, you separated what the customer was experiencing from the underlying cause and confirmed it with the appropriate checks. Getting the root cause right makes a lasting resolution more likely, and it gives the customer a clear, honest explanation of what went wrong.","Instead of defaulting to an equipment replacement or a technician visit, you worked to pinpoint where the issue was actually coming from. Identifying the correct cause first protects the customer from unnecessary appointments and leads to a solution that addresses the real problem."]},{"id":"s-tools","group":"tech","title":"Efficient Tools Navigation","desc":"Moves through systems and tools efficiently while staying engaged with the customer.","kw":["tools navigation","tools","systems","navigation","system navigation","efficient","multitasking","quick research","efficiency","resources"],"v":["You moved through the systems and tools efficiently, going straight to the information you needed without long pauses or unnecessary searching. Efficient navigation keeps the call moving, reduces waiting time, and demonstrates that you know your resources well.","Your comfort with the tools came through on this call. You knew where to look for each piece of information, which kept research time short and allowed you to stay focused on the conversation instead of the screen. That balance keeps the customer from feeling ignored while you work.","As you worked through the account and your tools, you stayed engaged with the customer and did not lose track of what they were telling you. Navigating efficiently without letting the conversation go quiet makes the call feel organized and respects the customer's time."]},{"id":"s-verification","group":"tech","title":"Accurate Account Verification","desc":"Completes verification correctly before accessing or changing the account.","kw":["verification","account verification","verified","verify customer","authentication","security","privacy","authorized user","account security"],"v":["You completed account verification correctly before accessing or discussing any account details, following the applicable process without making it feel like a hurdle. Accurate verification protects the customer's privacy and the security of their account, and handling it smoothly sets a professional tone early in the call.","Before going into the account, you confirmed that you were speaking with an authorized person, exactly as the applicable process requires, and you handled it in a friendly, matter-of-fact way. That helps the customer see verification as protection for their account rather than as a delay."]},{"id":"s-billing","group":"bill","title":"Accurate Billing Explanation","desc":"Explains charges, changes, and timelines accurately and in plain language.","kw":["billing explanation","bill explanation","billing","charges","explained bill","bill breakdown","proration","billing accuracy","statement","bill increase"],"v":["You walked the customer through the charges on their bill clearly and accurately, explaining what each one was for and why it appeared. A clear billing explanation removes confusion, helps the customer trust the information, and makes another call about the same statement less likely.","Your billing explanation was accurate and easy to follow. You avoided internal terms, connected each charge or change to something the customer could recognize, and explained when it would appear on their statement. When the details are this clear, the customer can feel in control of their bill and confident about what they are paying.","Before explaining the charges, you reviewed the account carefully so that everything you told the customer was correct. Getting the details right first prevents the frustration of conflicting answers and gives the customer an explanation they can rely on."]},{"id":"s-pricing","group":"bill","title":"Clear Pricing Explanation","desc":"Explains pricing, promotional terms, and what changes afterward, with no surprises.","kw":["pricing","price explanation","pricing disclosure","promotion","promotional pricing","promo end","price after promotion","full disclosure","no surprises","taxes and fees"],"v":["You explained the pricing clearly and completely, including the monthly price, any additional charges that applied, and how the total would appear on the bill. Full disclosure like this prevents surprises on future statements, protects the customer's trust, and lowers the chance of a billing dispute later.","Your pricing explanation left no room for surprises. You were upfront about what the customer could expect to pay, not only the most attractive number, and you made sure they understood what would change and when. Transparent pricing helps the customer make an informed decision and builds trust in what you tell them.","One clear strength was the way you distinguished between the promotional price and the standard rate after the promotional term. Making that difference explicit, rather than leaving it in the fine print, helps the customer budget accurately and keeps an unexpected increase from damaging their trust later."]},{"id":"s-payment-options","group":"bill","title":"Helpful Payment Options Guidance","desc":"Explains the payment options that fit the customer's situation clearly and accurately.","kw":["payment options","payment arrangement","payment assistance","payment methods","past due","pay bill","payment plan","autopay","financial hardship","collections"],"v":["You gave the customer a clear, accurate explanation of the payment options that fit their situation, including how each one works and what they would need to do next. Clear guidance can ease the stress around the bill and make it easier for the customer to keep the account in good standing.","When the customer raised a concern about paying the bill, you listened to their situation first and then explained the options that actually applied, instead of reciting every possibility. That tailored guidance shows respect for the customer's circumstances and helps them choose an option they can realistically manage.","Your guidance on payment options was accurate and free of pressure. You were clear about any requirements or timing under the applicable process, giving the customer the full picture before deciding. Accurate payment information protects the customer from unexpected consequences and builds trust during what can be a stressful conversation."]},{"id":"s-sales-discovery","group":"sales","title":"Effective Sales Discovery","desc":"Asks about needs and usage before recommending a product or service.","kw":["sales discovery","needs discovery","discovery questions","usage questions","needs analysis","customer needs","qualifying questions","household needs","needs assessment"],"v":["Before recommending anything, you asked how the customer uses their services and what matters most to them, and you listened closely to the answers. Discovery like this lets you recommend something that genuinely fits, which makes the conversation feel helpful rather than like a sales pitch.","Your sales discovery was natural and conversational. You asked about the household's needs and usage in a way that came across as genuine interest, not a checklist. Understanding those needs first gives any recommendation a clear purpose and makes the customer more open to hearing it.","Instead of jumping to an offer, you took time to learn about the customer's current setup, who relies on the service, and where it may be falling short for them. Those details turn a generic offer into a personalized recommendation and help the customer recognize why it matters to them."]},{"id":"s-plant-seed","group":"sales","title":"Effective Plant the Seed","desc":"Introduces a relevant idea naturally after the concern is resolved, without pressure.","kw":["plant the seed","plant seed","planting the seed","seed","soft offer","future need","no pressure","sales transition","natural transition"],"v":["After the customer's concern was fully resolved, you introduced a relevant idea in a natural, low-pressure way that connected to something they had mentioned earlier. Planting the seed at the right moment keeps the focus on service first and gives the customer something useful to consider without feeling pushed.","Your transition into planting the seed was smooth and well timed. Because you waited until the main concern was handled, the suggestion came across as helpful advice rather than a push to buy, which keeps the customer's trust intact and leaves the door open for a future conversation.","With the customer's concern taken care of, you briefly mentioned an option tied to what you had learned about them and let them consider it without pressure. Respecting the customer's pace this way builds goodwill and makes it more likely they will be receptive when they are ready to make a change."]},{"id":"s-relevant-offer","group":"sales","title":"Relevant Offer","desc":"Recommends an offer that clearly connects to what the customer shared.","kw":["relevant offer","offer","tailored offer","personalized offer","needs-based offer","recommendation","upgrade","xm offer","mobile lines","sales offer"],"v":["The offer you recommended connected directly to what the customer shared about their needs, which made it a solution to their situation rather than a generic promotion. Relevant offers are easier for customers to accept because they can see how the service would help them.","You tied your recommendation to specific details from the conversation, such as how the customer uses the service and what they wanted to change, and you explained that link clearly. When customers hear their own needs reflected in an offer, they are more likely to trust the recommendation and see its value.","Rather than listing everything available, you focused on the option that best matched what you learned during discovery. A focused, needs-based offer respects the customer's time, makes the decision easier, and lowers the risk of a change the customer later regrets or reverses."]},{"id":"s-value","group":"sales","title":"Clear Offer Value","desc":"Explains the offer in terms of the benefits that matter to the customer.","kw":["offer value","value","benefits","features and benefits","value statement","customer benefits","benefit selling","value proposition","why it matters"],"v":["You explained the offer in terms of what it would mean for the customer, connecting each feature to a benefit that matched what they had told you. Framing value around the customer's own priorities makes the offer easier to understand and helps the customer judge whether it is worth it.","Instead of listing features, you described how the offer would make a difference in the customer's day-to-day use of the service. Benefit-focused explanations help customers picture the value for themselves, which makes the decision feel informed rather than pressured.","The value you described was specific and believable. You explained the concrete ways the offer would help the customer, without exaggerating or promising more than the service can deliver. Clear, honest value statements help the customer make a confident decision and feel comfortable with whatever they decide."]},{"id":"s-objection","group":"sales","title":"Effective Objection Handling","desc":"Acknowledges objections, clarifies the concern, and responds with relevant value.","kw":["objection handling","objections","overcome objection","price objection","hesitation","pushback","rebuttal","not interested","customer concern"],"v":["When the customer raised an objection, you acknowledged it respectfully, asked a question to understand what was behind it, and then responded with value that addressed that specific concern. Handling objections this way shows the customer that their hesitation was heard and keeps the conversation collaborative instead of pushy.","You handled the customer's hesitation with patience and confidence. Instead of repeating the offer or dropping it right away, you clarified the real concern and gave a relevant, honest response. That balance respects the customer's choice while making sure they have the information they need to make it.","You stayed composed when the customer pushed back on the offer, treating the objection as a reasonable question and answering it with information tied to what they had shared. Responding this way builds credibility and helps the customer make a decision based on facts rather than doubt."]},{"id":"s-retention","group":"sales","title":"Effective Retention Handling","desc":"Recognizes cancellation risk and works to understand and address the reason.","kw":["retention","save","save attempt","cancellation","cancel","disconnect","retention offer","churn","cancellation risk","keep customer"],"v":["When the customer mentioned canceling, you recognized the risk right away and focused on understanding the reason behind it before offering anything. Taking the time to address the real cause tells the customer that their business is worth the effort and gives you the best chance of finding a solution that keeps them with the company.","You picked up on signs that the customer might be considering leaving and addressed the underlying concern directly instead of waiting for a cancellation request. Recognizing that risk early and responding with empathy and a relevant solution can protect a customer relationship that might otherwise be lost.","In the retention conversation, you asked what was driving the customer's decision, acknowledged their concerns, and presented an option that addressed their specific reason for wanting to leave, while respecting their right to decide. A save built on the customer's real reason is more likely to last than one based on pressure, and it protects the relationship either way."]},{"id":"s-sales-close","group":"sales","title":"Confident Sales Close","desc":"Asks for the decision confidently and confirms exactly what the customer agreed to.","kw":["sales close","closing the sale","ask for the sale","assumptive close","confirm order","order recap","confident close","customer agreement","confirm purchase"],"v":["As soon as the customer showed interest, you asked for the decision confidently and then confirmed exactly what they were agreeing to, including the service, the price, and any changes to their account. Asking clearly and confirming the details protects the customer from surprises and makes sure the order matches what they expect.","Your close was confident without being pushy. You summarized the offer, asked directly whether the customer wanted to move forward, and recapped the details they agreed to before completing the order. A clear, confirmed close reduces misunderstandings and leaves the customer certain about what they chose.","Once the customer had the information they needed, you moved the conversation to a decision instead of leaving it open-ended, and you confirmed their agreement in clear terms. A confident close saves time and ensures that you and the customer leave with the same understanding of what was agreed."]}],"guides":{"hold":{"title":"Hold, Mute, Dead Air, and Research Time","intro":"Keep these four situations separate when you review a call. Each one has a different coaching conversation.","items":[{"term":"Hold","text":"The customer is placed on hold with the phone system's hold function. They hear hold music or messaging, and the time is recorded as hold time. Correct use: ask permission, explain why, give an estimated time, return on time or check back with an update, and thank the customer."},{"term":"Mute","text":"The microphone is turned off but the line stays open. The customer hears complete silence, which sounds the same as dead air or a dropped call. Mute is not a substitute for hold during research. Follow your program's guidance on when mute may be used."},{"term":"Dead air","text":"Any stretch of silence on an open line where the customer is not told what is happening, whatever the cause: mute, reading, typing, or waiting on a system."},{"term":"Research time","text":"Time spent investigating is expected. It becomes a coaching opportunity when the customer is left uninformed. Brief research can be narrated; longer research belongs on a proper hold."}],"caution":"Zero recorded hold time does not prove the customer was left on mute. Silence can come from reading, navigating tools, or system delays. Confirm mute usage from the recording before documenting it."},"sales":{"title":"Sales Conversation Flow","intro":"Sales coaching follows the customer's needs, not the other way around. An offer only belongs in the call after the concern is resolved and confirmed.","flow":["Understand","Empathize","Assure","Probe","Resolve","Confirm","Plant the Seed","Relevant Offer","Explain Pricing","Confirm Understanding"],"offers":[{"term":"Xfinity Mobile (XM)","text":"New lines, devices, or moving a number over. Relevant when discovery reveals a mobile need, such as another carrier's bill, a family member who needs a line, or a device question."},{"term":"Service upgrades","text":"Changes that improve an existing service, such as faster internet or updated equipment. Relevant when the customer describes slow speeds, many connected devices, or coverage gaps."},{"term":"TV package offers","text":"Adding, changing, or right-sizing TV packages and channels. Relevant when the customer talks about what they watch, missing channels, or paying for content they do not use."},{"term":"Retention offers","text":"Options for a customer who is considering cancelling or downgrading, presented through the retention process after understanding the reason they want to leave."}],"caution":"A payment link, payment arrangement, or other payment assistance helps the customer, but it is not a sales offer. Confirm current offers, eligibility, and disclosure requirements in approved resources before coaching."},"quick":{"steps":["Review the call and note what happened. Leave out names, IDs, and account details.","Search or browse for the behavior you observed, then open it.","Select only the strengths you actually observed. Nothing positive is added to coaching text unless you select it.","Copy the section you need, or use Copy Full Coaching for the whole entry.","For several behaviors, add them to the Coaching Builder to generate one cohesive entry with a single SMART plan.","For sales and retention calls, use the Sales Toolkit call review: mark each step, then send the gaps to the Coaching Builder."],"conversation":["Set the purpose: share what you reviewed and why it matters to the customer.","Start with genuine strengths you observed on the call.","Describe the specific behavior and its impact, using the coaching text as your guide.","Ask the coaching questions and listen. Let the agent identify the gap and the fix.","Agree on the expected behavior and practice it with a short roleplay or demonstration.","Commit to the SMART plan and confirm the follow-up dates before you finish."],"rules":["Never include agent or customer names, BPIDs, HRIDs, Avaya IDs, account numbers, or interaction IDs.","Only document strengths you observed and progress you verified.","Describe impact as what a behavior can cause unless you confirmed what actually happened.","Confirm internal processes (ITG, transfers, credits, porting, verification) before coaching on them."],"smart":[["Specific","Names the exact behavior and when it should happen."],["Measurable","States a target you can check on reviewed calls."],["Achievable","Realistic for one agent within the plan period."],["Relevant","Directly tied to the behavior you coached."],["Time-bound","Has a plan length and a first review date."]]}},"salesToolkit":{"intro":"Everything for coaching sales and retention conversations in one place: a call review that turns gaps into coaching, the sales flow with model language, offer guides, objection handling, and buying signals.","notOffer":"A payment link, payment arrangement, or other payment assistance helps the customer, but it is not a sales offer. Confirm current offers, eligibility, pricing, and disclosure requirements in approved resources before coaching on them.","steps":[{"id":"understand","title":"Understand","good":"Let the customer explain the reason for the call without interruption, then restate it in one sentence and confirm it is right.","say":"So your bill went up this month and you'd like to understand why. Did I get that right?","gaps":["com-missing-acknowledgement","com-active-listening","com-interrupting"],"strength":"s-acknowledgement"},{"id":"empathize","title":"Empathize","good":"Respond to how the situation is affecting the customer, using details they actually shared rather than a general phrase.","say":"I'm sorry the internet keeps dropping while you're working from home. That makes the whole workday harder.","gaps":["com-missing-empathy","com-generic-empathy"],"strength":"s-empathy"},{"id":"assure","title":"Assure","good":"Tell the customer clearly that you will take care of the concern, and preview the first step.","say":"I'm going to take care of this with you today. First, I'll check the connection on your equipment.","gaps":["com-weak-assurance"],"strength":"s-assurance"},{"id":"probe","title":"Probe","good":"Ask open questions about the concern, and listen for needs that matter later, such as devices, household, or other providers.","say":"When did you first notice it, and is it happening on every device or just one?","gaps":["dis-insufficient-probing","dis-missing-probing","sales-missing-discovery"],"strength":"s-probing"},{"id":"resolve","title":"Resolve","good":"Resolve the customer's main concern completely, using the applicable process, before introducing anything else.","say":"I found what was causing the drops, and I've reset the connection from our side. Let's make sure it's working for you.","gaps":["own-incomplete-resolution","own-primary-concern"],"strength":"s-resolution"},{"id":"confirm","title":"Confirm","good":"Have the customer confirm the issue is resolved on their side before the conversation moves on.","say":"Can you check on your end that everything is loading normally now?","gaps":["own-confirm-resolution","own-premature-resolution"],"strength":"s-resolution"},{"id":"seed","title":"Plant the Seed","good":"After the resolution is confirmed, mention one relevant idea tied to something the customer shared, with no pressure to decide.","say":"You mentioned everyone is online in the evenings. Some households like yours find a faster plan helps with that, and I'm happy to share details whenever it's useful.","gaps":["sales-plant-seed","sales-weak-transition"],"strength":"s-plant-seed"},{"id":"offer","title":"Relevant Offer","good":"Present the offer that matches the need you uncovered and say why you chose it. Payment help does not count as an offer.","say":"Based on what you shared about the phone bill with your current carrier, Xfinity Mobile could be worth a look. Would you like me to show you how it could work for your household?","gaps":["sales-missing-offer","sales-irrelevant-pitch","sales-pitch-before-resolve"],"strength":"s-relevant-offer"},{"id":"pricing","title":"Explain Pricing","good":"Explain the full price clearly: the promotional price and term, the standard rate afterward, equipment charges, taxes and fees, and any requirements.","say":"Here's exactly what you'd pay. The promotional price applies for the promotional term, and then the standard rate applies. Taxes and fees are separate, and your first bill may include a partial month.","gaps":["sales-pricing-disclosure"],"strength":"s-pricing"},{"id":"understanding","title":"Confirm Understanding","good":"Ask for the decision, then recap what the customer agreed to, what they will pay now and later, and what happens next.","say":"Before I place the order, let me recap what you're getting, what you'll pay now and after the promotion, and what happens next. Does that all sound right?","gaps":["sales-closing","dis-confirm-understanding"],"strength":"s-sales-close"}],"skills":[{"id":"value","title":"Offer value","good":"Connect each feature to a benefit tied to the customer's own situation before talking about price.","gaps":["sales-offer-value","sales-features-benefits"],"strength":"s-value"},{"id":"objections","title":"Objection handling","good":"Acknowledge the objection, ask one clarifying question, and respond with value tied to that specific concern.","gaps":["sales-weak-objection"],"strength":"s-objection"},{"id":"respect","title":"Respecting a clear no","good":"Accept a clear no the first time, with at most one respectful clarification, and close the call warmly.","gaps":["sales-pitch-after-rejection"],"strength":null},{"id":"signals","title":"Buying signals","good":"Notice cues such as a price question or a contract ending elsewhere, and follow up with a question.","gaps":["sales-buying-signals"],"strength":null},{"id":"retention","title":"Retention","good":"When the customer mentions canceling or switching, ask what is behind it and present the applicable options per the retention process.","gaps":["sales-retention","bill-cancellation-risk"],"strength":"s-retention"}],"offers":[{"id":"xm","title":"Xfinity Mobile (XM)","short":"Xfinity Mobile","summary":"New lines, devices, or moving a number over, for customers whose mobile needs came up in the conversation.","fits":["The customer mentions their phone bill or plan with another carrier.","A family member needs a new line, or someone is getting their first phone.","The customer asks about a new device or keeping their current number.","The customer would like fewer separate bills and providers."],"questions":["Who in your household uses a mobile phone today, and which carrier are you with?","How do you mostly use your phones: calls and texts, streaming, or working on the go?","Are you planning to keep your current phones, or is anyone due for a new device?"],"seed":"Since you mentioned paying a separate phone bill, it may be worth knowing that we also offer mobile service. I'm happy to walk you through it anytime it's useful.","bridge":"Now that your internet is working again, can I share one idea about the phone bill you mentioned earlier?","value":["Explain how it would work for the lines and devices the customer described, not every feature available.","Connect the benefit to what they told you, such as managing services in one place or keeping their current number."],"disclosure":["Eligibility requirements for the offer","The monthly price for the lines discussed, any promotional term, and the standard rate afterward","Device costs, trade-in conditions, or payment terms, if any","Taxes and fees, and when the first bill arrives","What happens with the current carrier and the number transfer"],"objection":{"says":"I'm happy with my current carrier.","acknowledge":"That's good to hear, and switching isn't something to do without a reason.","clarify":"Is there anything about your current plan you'd change if you could, such as the price or the data?","respond":"If cost is the main thing, I can show you how the lines you described would compare, and you can decide whether it's worth a closer look."},"note":"Confirm current Xfinity Mobile offers, eligibility, device programs, and number transfer requirements in approved resources."},{"id":"upgrade","title":"Service Upgrades","short":"Upgrades","summary":"Changes that improve an existing service, such as faster internet or updated equipment, when the household's usage has outgrown the current setup.","fits":["Several people stream, game, or work online at the same time.","Evenings or video calls slow down, and troubleshooting confirms the service itself is working as designed.","Wi-Fi does not reach every room, or the equipment is older.","The household added devices, a home office, or a new member."],"questions":["How many devices are usually connected at the same time in your home?","What do people use the internet for most: streaming, gaming, video calls, or working from home?","Are there rooms where the Wi-Fi is weaker than you'd like?"],"seed":"With everyone online at once in the evenings, you might find a faster plan helps. There's no need to decide anything today, but I'm glad to go over it whenever you like.","bridge":"Since you mentioned the video calls freezing when the kids are streaming, can I share an option that's built for busier households like yours?","value":["Describe what would feel different for this household, such as smoother video calls while others stream, rather than speed numbers alone.","Avoid promising specific speeds or coverage, because results vary by device and home setup."],"disclosure":["The new monthly price, any promotional term, and the standard rate afterward","Any equipment change, equipment charge, or installation step","Taxes and fees, and how the change affects the next bill, including partial months","When the change takes effect"],"objection":{"says":"My internet is fine the way it is.","acknowledge":"That's fair. If it's working for you, there's no reason to change it.","clarify":"Just so I understand, do the evening slowdowns you mentioned still bother you, or have they settled down?","respond":"If they still come up, the upgrade is mainly about keeping things smooth when everyone is online. If not, your current plan may be the right fit."},"note":"Resolve technical issues first. Recommend an upgrade only when the household's usage, not a fault, is the reason for the slowdown. Confirm current plans and pricing in approved resources."},{"id":"tv","title":"TV Package Offers","short":"TV packages","summary":"Adding, changing, or right-sizing TV packages and channels, based on what the household actually watches.","fits":["The customer asks about a channel, sports, or a program they cannot get.","The customer says they pay for channels they never watch.","Viewing habits have changed, such as a new sports season or more streaming.","The customer has questions about TV boxes in other rooms."],"questions":["What do you and your household watch most, and on which TVs?","Are there channels or sports you're missing right now?","How much of your viewing happens through streaming apps versus live TV?"],"seed":"If you ever want to make sure your TV package matches what you actually watch, I'm happy to review it with you. Some customers find a better fit that way.","bridge":"You mentioned paying for channels you don't watch. Would it help if I looked at whether a different package fits your viewing better?","value":["Tie the package to the specific channels, sports, or rooms the customer mentioned.","When a smaller package fits better, recommending it builds trust and is still a relevant offer."],"disclosure":["The package price, any promotional term, and the standard rate afterward","TV box or equipment charges for each TV","Taxes, fees, and any other monthly charges that apply to TV service","When the change takes effect and how the next bill will look"],"objection":{"says":"I already have streaming services.","acknowledge":"That makes sense. A lot of households watch mostly through streaming now.","clarify":"Is there anything you still watch on live TV, like local channels or sports?","respond":"If there is, I can look at whether a package built around those makes sense alongside your streaming. If not, we can leave things as they are."},"note":"Confirm current packages, equipment, and TV-related charges in approved resources before coaching on TV offers."},{"id":"retention","title":"Retention Offers","short":"Retention","summary":"Options for a customer who is considering canceling or downgrading, presented through the retention process after understanding the reason.","fits":["The customer asks to cancel, downgrade, or remove a service.","The customer mentions a competitor's price or offer.","The bill has become hard to afford.","Repeated service problems have frustrated the customer."],"questions":["Can you tell me what's prompting you to think about canceling?","If we could address that, would you want to keep your service?","What matters most to you in your service right now: price, reliability, or something else?"],"seed":"Thank you for telling me, and for being with us. Before we go further, I'd like to understand what's behind the decision so I can see what I can do.","bridge":"I understand price is the main reason. Let me check which options are available on your account, so you can make the best decision for your household.","value":["Address the underlying reason first: fix a service issue, review the bill, or explain options that fit the new budget.","Present only the retention options the process allows, and respect the customer's final decision."],"disclosure":["What changes on the account and when","The new price, any promotional term, and the rate afterward","Any equipment returns or charges that apply if a service is removed","The customer's confirmed decision and the next steps"],"objection":{"says":"Your competitor is cheaper.","acknowledge":"I appreciate you being upfront about that, and I understand price matters.","clarify":"Is price the main reason, or is there anything else about the service that hasn't worked for you?","respond":"Let me check which options are available on your account through our retention process, so you can compare with the full picture before you decide."},"note":"Confirm the current retention process, which options the agent can present, eligibility, and when another team handles the request."}],"objectionPrinciple":"Acknowledge, clarify, respond. A price concern or a request for time is an invitation to clarify. A clear no is respected the first time, with at most one respectful clarification, and the call closes warmly.","objections":[{"id":"price","says":"It's too expensive.","acknowledge":"I understand. Keeping the monthly bill manageable matters.","clarify":"Is it the monthly price itself, or the change from what you pay now?","respond":"Let me make sure you're comparing the full picture, including anything you'd no longer need to pay for elsewhere. If it still doesn't fit your budget, that's completely okay.","close":"That's completely fine. Thank you for considering it. Is there anything else I can help you with today?"},{"id":"think","says":"I need to think about it.","acknowledge":"That's reasonable. It's a decision worth thinking through.","clarify":"Is there a part you're unsure about, such as the price or how it would work for you, that I can clear up while we're on the phone?","respond":"If it helps, I can recap the key details so you have them while you think it over.","close":"Of course. You can reach out whenever you're ready, and we'll pick it up from there."},{"id":"happy","says":"I'm happy with what I have.","acknowledge":"I'm glad it's working well for you.","clarify":"Out of curiosity, is there anything you'd change about your current setup if you could?","respond":"If something comes to mind, that's where this could help. If not, your current setup may be the right fit.","close":"Sounds good. Your service is all set from today's call."},{"id":"locked","says":"I don't want to be locked into anything.","acknowledge":"That's a fair concern. Nobody wants surprises later.","clarify":"Is it a commitment period you're worried about, or the possibility of the price changing?","respond":"Let me check exactly which terms apply to this offer and explain them clearly, so you know what you'd be agreeing to before you decide.","close":"Understood. Thank you for hearing me out, and let me know if anything changes."},{"id":"together","says":"I need to talk it over with someone at home first.","acknowledge":"Of course. It makes sense to decide together.","clarify":"Is there anything I can explain now that would help when you talk it over?","respond":"I can recap the details so you have everything you need for that conversation.","close":"That works. Whenever you're both ready, we can go through it again."},{"id":"nothing-else","says":"I don't need anything else right now.","acknowledge":"Understood, and that's completely fine.","clarify":"Can I ask whether anything has changed recently at home, like more people or devices online?","respond":"If not, you're all set. If that changes, we can look at options then.","close":"You're all set. Thank you for your time today."},{"id":"past-problems","says":"I've had problems with your service before.","acknowledge":"I'm sorry you've had that experience, and I understand why it makes you hesitant.","clarify":"Can you tell me what happened, so I can make sure it's addressed?","respond":"Let's make sure the issue itself is taken care of first. Once it is, I'm happy to revisit options, but only if they would genuinely help.","close":"That's fair. My priority today is making sure the service works the way it should."},{"id":"not-interested","says":"I'm not interested.","acknowledge":"No problem at all, and thank you for letting me know.","clarify":"","respond":"","close":"Your service is all set from today's call. Is there anything else I can help you with?","guidance":"This is a clear no. Respect it the first time and close warmly, with no further attempt."}],"signals":[{"signal":"Asks about price","example":"How much would something like that cost?","next":"Happy to go through it. So I quote the right option, how would you mainly use it?"},{"signal":"Asks what is included","example":"Does that come with anything else?","next":"Good question. Which part matters most to you, so I can focus on that?"},{"signal":"A contract is ending elsewhere","example":"My phone contract is up next month.","next":"When does it wrap up? That could be a good time to compare your options."},{"signal":"More people or devices at home","example":"My son just moved back home.","next":"How many devices are usually online at the same time now?"},{"signal":"Unhappy with another provider","example":"My cell phone bill keeps going up.","next":"What would you most like to change about your current plan?"},{"signal":"A new routine or need","example":"I'm working from home a few days a week now.","next":"How are video calls holding up when others are online?"},{"signal":"Moving or a life change","example":"We're moving in a few weeks.","next":"Congratulations. Have you set a move date? I can make sure your service is ready at the new address."},{"signal":"Asks for something better","example":"Is there anything better than what I have?","next":"Let's find out. Tell me what you'd want to be better, and I'll look at what fits."}]}};

function deepFreeze(obj) {
  if (obj && typeof obj === 'object' && !Object.isFrozen(obj)) {
    Object.freeze(obj);
    Object.values(obj).forEach(deepFreeze);

  return obj;
}

const SVGNS = 'http://www.w3.org/2000/svg';
const XLINK = 'http://www.w3.org/1999/xlink';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function append(el, kids) {
  for (const kid of kids) {
    if (kid == null || kid === false || kid === true) continue;
    if (Array.isArray(kid)) append(el, kid);
    else if (kid instanceof Node) el.appendChild(kid);
    else el.appendChild(document.createTextNode(String(kid)));
  }
  return el;
}

/** Create an element. Strings are always inserted as text, never parsed as HTML. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let value;
  if (props) {
    for (const key of Object.keys(props)) {
      const v = props[key];
      if (v == null || v === false) continue;
      if (key === 'class') el.className = v;
      else if (key === 'text') el.textContent = v;
      else if (key === 'value') value = v;
      else if (key === 'checked') el.checked = !!v;
      else if (key === 'dataset') Object.assign(el.dataset, v);
      else if (key.startsWith('on') && typeof v === 'function') el.addEventListener(key.slice(2), v);
      else if (v === true) el.setAttribute(key, '');
      else el.setAttribute(key, String(v));
    }
  }
  append(el, kids);
  if (value !== undefined) el.value = value;
  return el;
}

function icon(name, cls) {
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');

/* ---------- Text ---------- */
const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const numWord = (n) => (Number.isInteger(n) && n >= 0 && n <= 10 ? NUM_WORDS[n] : String(n));
const capFirst = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');

function durationPhrase(days) {
  if (days % 7 === 0) {
    const weeks = days / 7;
    return weeks === 1 ? 'one week' : numWord(weeks) + ' weeks';
  }
  return numWord(days) + ' days';
}
function durationAdj(days) {
  return days % 7 === 0 ? numWord(days / 7) + '-week' : numWord(days) + '-day';
}
function durationTitle(days) {
  return durationAdj(days).split('-').map(capFirst).join('-');
}
function followupPhrase(days) {
  return days === 1 ? 'one day' : numWord(days) + ' days';
}
function durationOptionLabel(days) {
  return days % 7 === 0 ? `${days} days (${durationPhrase(days)})` : `${days} days`;
}

function tokenValues(settings) {
  const s = settings || state.settings;
  return {
    duration: durationPhrase(s.duration),
    durationAdj: durationAdj(s.duration),
    calls: numWord(s.calls),
    followup: followupPhrase(s.followup),
  };
}

/** Replace {duration}, {durationAdj}, {calls}, {followup}; capitalize when a token starts a sentence. */
function fillTokens(text, settings) {
  const tv = tokenValues(settings);
  return String(text || '').replace(/\{(duration|durationAdj|calls|followup)\}/g, (m, key, offset, whole) => {
    const before = whole.slice(0, offset);
    const startsSentence = offset === 0 || /[.?!]\s+$/.test(before) || /\n\s*$/.test(before);
    return startsSentence ? capFirst(tv[key]) : tv[key];

}

/** Oxford-comma list; switches to semicolons when items already contain commas. */
function joinList(items, conj = 'and') {
  const list = items.filter(Boolean).map((s) => String(s).trim());
  if (list.length === 0) return '';

  if (list.length === 2) return list[0].includes(',') ? `${list[0]}, ${conj} ${list[1]}` : `${list[0]} ${conj} ${list[1]}`;

  return list.slice(0, -1).join(sep) + sep + conj + ' ' + list[list.length - 1];
}

function tidySentence(s) {

    .replace(/\s+/g, ' ')
    .replace(/\s+([,.;:?!])/g, '$1')
    .replace(/([.?!])\.+$/, '$1')

  out = capFirst(out);
  if (!/[.?!]$/.test(out)) out += '.';

function dedupe(list) {
  const seen = new Set();
  const out = [];
  for (const item of list) {
    if (!item) continue;
    const key = String(item).trim().toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(String(item).trim());
  }
  return out;
}

function chunk(list, size) {
  const out = [];
  for (let i = 0; i < list.length; i += size) out.push(list.slice(i, i + size));
  return out;
}

const PROPER_WORDS = new Set(['Xfinity', 'Comcast', 'Wi-Fi', 'VXI']);

const wordCount = (s) => (String(s || '').trim().match(/\S+/g) || []).length;

function normalizeText(s) {

    .toLowerCase()
    .normalize('NFKD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')

/** Debounce; `flush()` runs a pending call immediately and does nothing when no call is pending. */
function debounce(fn, ms) {
  let t = null;
  let pending = false;
  let lastArgs = [];
  const wrapped = (...args) => {
    lastArgs = args;
    pending = true;
    clearTimeout(t);
    t = setTimeout(() => {
      pending = false;
      fn(...lastArgs);
    }, ms);
  };
  wrapped.flush = () => {
    if (!pending) return;
    clearTimeout(t);
    pending = false;

}

const STORAGE_PREFIX = 'cip.v1.';
const STATE_KEYS = ['settings', 'prefs', 'favorites', 'custom', 'overrides', 'builder', 'combos', 'drafts', 'review'];

const store = (() => {
  let ok = false;
  const memory = new Map();
  try {
    const probe = STORAGE_PREFIX + '__probe';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    ok = true;
  } catch (e) {
    ok = false;
  }
  let warned = false;
  return {
    get ok() {
      return ok;
    },
    get(key, fallback) {
      try {
        const raw = ok ? window.localStorage.getItem(STORAGE_PREFIX + key) : memory.get(key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      const raw = JSON.stringify(value);
      memory.set(key, raw);
      if (!ok) return false;
      try {
        window.localStorage.setItem(STORAGE_PREFIX + key, raw);
        return true;
      } catch (e) {
        if (!warned) {
          warned = true;
          setTimeout(() => toast('Browser storage is full or blocked. Export a backup from Settings & Data.', { type: 'error', duration: 6000 }), 0);
        }
        return false;
      }
    },
    remove(key) {
      memory.delete(key);
      if (!ok) return;
      try {
        window.localStorage.removeItem(STORAGE_PREFIX + key);
      } catch (e) {
        /* ignore */
      }
    },
    usage() {
      if (!ok) return 0;
      let chars = 0;
      try {
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.startsWith(STORAGE_PREFIX)) chars += k.length + (window.localStorage.getItem(k) || '').length;
        }
      } catch (e) {
        return 0;
      }
      return chars * 2;
    },
  };
})();

  const strengths = [];

    const clean = sanitizeCustomStrength(s);
    if (clean && !seen.has(clean.id)) {
      seen.add(clean.id);
      strengths.push(clean);
    }
  }
  return { opps, strengths };
}

/* ---------- Load & persist ---------- */

function persist(...keys) {

   02-content: merged content model (built-in + overrides + custom) and search
   ========================================================================== */

const content = { opps: [], strengths: [], oppMap: new Map(), strengthMap: new Map() };

function rebuildContent() {
  const opps = [];
  for (const o of DATA.opps) {
    const ov = state.overrides.opps[o.id];

    else opps.push({ ...o, builtin: true, customized: false, custom: false });
  }

  const strengths = [];

    else strengths.push({ ...s, builtin: true, customized: false, custom: false });
  }
  for (const c of state.custom.strengths) strengths.push({ ...c, builtin: false, customized: false, custom: true });
  content.strengths = strengths;
  content.strengthMap = new Map(strengths.map((s) => [s.id, s]));

  opps.forEach(indexOpp);

const getOpp = (id) => content.oppMap.get(id) || null;
const getStrength = (id) => content.strengthMap.get(id) || null;

/* ---------- Search index ---------- */
function wordsOf(text) {
  return [...new Set(normalizeText(text).split(' ').filter(Boolean))];
}

// Category names a supervisor might type; matching one boosts every entry in that category.
const CAT_BOOST_WORDS = { com: ['communication'], dis: ['probing', 'discovery'], hold: ['hold', 'mute'], own: ['ownership', 'resolution'], tech: ['technical'], bill: ['billing'], sales: ['sales', 'retention'] };
const GROUP_BOOST_WORDS = { com: ['communication'], dis: ['discovery', 'probing'], hold: ['hold', 'control'], own: ['ownership'], tech: ['technical'], bill: ['billing'], sales: ['sales', 'retention'] };

function indexOpp(o) {
  const kw = (o.kw || []).map(normalizeText).filter(Boolean);
  const exampleText = (o.example || []).map((e) => e.say).join(' ');
  o._title = normalizeText(o.title);
  o._kw = kw;
  o._desc = normalizeText(o.desc);
  o._boost = CAT_BOOST_WORDS[o.cat] || [];
  o._idx = [
    { w: 12, words: wordsOf(o.title) },
    { w: 8, words: wordsOf(kw.join(' ')), text: ' ' + kw.join(' | ') + ' ' },
    { w: 5, words: wordsOf((o.tags || []).join(' ')) },
    { w: 4, words: wordsOf(o.desc), text: ' ' + o._desc + ' ' },
    { w: 3, words: wordsOf(((CAT_MAP[o.cat] || {}).label || '') + ' ' + ((THEMES[o.theme] || {}).label || '')) },
    { w: 1, words: wordsOf([o.feedback, o.impact, o.plan, (o.questions || []).join(' '), exampleText].join(' ')) },
  ];
}

function indexStrength(s) {
  const kw = (s.kw || []).map(normalizeText).filter(Boolean);
  s._title = normalizeText(s.title);
  s._kw = kw;
  s._desc = normalizeText(s.desc);
  s._boost = GROUP_BOOST_WORDS[s.group] || [];
  s._idx = [
    { w: 12, words: wordsOf(s.title) },
    { w: 8, words: wordsOf(kw.join(' ')), text: ' ' + kw.join(' | ') + ' ' },
    { w: 4, words: wordsOf(s.desc) },
    { w: 3, words: wordsOf((S_GROUP_MAP[s.group] || {}).label || '') },
    { w: 1, words: wordsOf((s.v || []).join(' ')) },
  ];
}

const STOP_WORDS = new Set(['a', 'an', 'the', 'to', 'of', 'and', 'or', 'for', 'with', 'in', 'on', 'at', 'is', 'was', 'be', 'by', 'my', 'i', 'it', 'not', 'no', 'did', 'does', 'do', 'when', 'how', 'what', 'me', 'your', 'you', 'agent', 'agents']);

// Query expansion: what supervisors type -> words used in the library.
const SYNONYMS = {
  angry: ['frustrat', 'upset', 'irate', 'escalat'],
  mad: ['angry', 'frustrat', 'upset'],
  irate: ['angry', 'escalat', 'upset'],
  upset: ['frustrat', 'angry'],
  yelling: ['angry', 'escalat'],
  sleepy: ['energy', 'flat', 'monotone'],
  tired: ['energy', 'flat'],
  monotone: ['flat', 'energy'],
  boring: ['flat', 'energy', 'monotone'],
  bored: ['flat', 'energy'],
  robotic: ['generic', 'scripted', 'flat'],
  scripted: ['generic', 'robotic'],
  silent: ['silence', 'dead', 'quiet'],
  silence: ['silent', 'dead', 'quiet'],
  quiet: ['silence', 'silent'],
  muted: ['mute'],
  pause: ['silence', 'dead'],
  questions: ['probing', 'discovery'],
  question: ['probing', 'discovery'],
  probe: ['probing'],
  ask: ['probing', 'questions'],
  rude: ['tone', 'condescending'],
  attitude: ['tone'],
  fast: ['pace', 'rushed'],
  rushed: ['pace', 'rush'],
  rush: ['pace', 'rushed'],
  slow: ['pace', 'delay'],
  sorry: ['empathy', 'apology'],
  apology: ['empathy'],
  care: ['empathy'],
  feelings: ['empathy'],
  callback: ['call back', 'follow'],
  dropped: ['disconnect'],
  disconnected: ['dropped', 'disconnect'],
  upsell: ['sales', 'offer'],
  sell: ['sales', 'offer'],
  selling: ['sales', 'offer'],
  pitch: ['offer', 'sales'],
  promo: ['promotion'],
  cancel: ['cancellation', 'retention'],
  cancelling: ['cancellation', 'retention'],
  canceling: ['cancellation', 'retention'],
  tech: ['technical', 'technician'],
  truck: ['technician', 'dispatch'],
  fix: ['resolution', 'resolve'],
  fixed: ['resolution', 'resolve'],
  bill: ['billing'],
  money: ['billing', 'payment'],
};

function queryParts(q) {
  const phrase = normalizeText(q);
  const all = phrase.split(' ').filter(Boolean);
  const tokens = all.filter((t) => !STOP_WORDS.has(t));
  return { phrase, tokens: tokens.length ? tokens : all };
}

function wordMatch(t, w) {
  if (t === w) return 1;
  if (t.length <= 2) return 0;
  if (w.startsWith(t)) return 0.85;
  if (t.length >= 5 && w.length >= 5) {
    const m = Math.min(t.length, w.length);
    let i = 0;
    while (i < m && t[i] === w[i]) i++;
    if (i >= Math.max(5, m - 2)) return 0.65;
  }
  return 0;
}

function fieldScore(field, alt) {
  if (alt.includes(' ')) {
    const text = field.text || ' ' + field.words.join(' ') + ' ';
    return text.includes(alt) ? 1 : 0;
  }
  let best = 0;
  for (const w of field.words) {
    const s = wordMatch(alt, w);
    if (s > best) {
      best = s;
      if (s === 1) break;
    }
  }
  return best;
}

function scoreItem(item, tokens, mode) {
  const idx = item._idx;
  let total = 0;
  let matched = 0;
  for (const tok of tokens) {
    if (item._boost && item._boost.includes(tok)) total += 6;
    const alts = [tok].concat(SYNONYMS[tok] || []);
    let best = 0;
    for (const field of idx) {
      for (let i = 0; i < alts.length; i++) {
        const s = fieldScore(field, alts[i]);
        if (s) {
          const v = field.w * s * (i === 0 ? 1 : 0.7);
          if (v > best) best = v;
        }
      }
    }
    if (best > 0) {
      total += best;
      matched++;
    } else if (mode === 'and') return 0;
  }
  return mode === 'or' ? total * (matched / tokens.length) : total;
}

function phraseBonus(item, phrase) {
  if (!phrase) return 0;
  let bonus = 0;
  if (item._title === phrase) return 40;
  if (!phrase.includes(' ')) return item._kw.includes(phrase) ? 4 : 0;
  if (item._title.includes(phrase)) bonus += 24;
  if (item._kw.includes(phrase)) bonus += 18;
  else if (item._kw.some((k) => k.includes(phrase))) bonus += 10;
  if (item._desc.includes(phrase)) bonus += 5;
  return bonus;
}

/** Ranked search over opportunities or strengths. AND across terms, falling back to partial matches. */
function searchList(list, q) {
  const { phrase, tokens } = queryParts(q);
  if (!tokens.length) return { results: list.map((item) => ({ item, score: 0 })), partial: false, tokens: [] };
  let results = [];
  for (const item of list) {
    const s = scoreItem(item, tokens, 'and');
    if (s > 0) results.push({ item, score: s + phraseBonus(item, phrase) });
  }
  let partial = false;
  if (!results.length && tokens.length > 1) {
    partial = true;
    for (const item of list) {
      const s = scoreItem(item, tokens, 'or');
      if (s > 0) results.push({ item, score: s + phraseBonus(item, phrase) });
    }
  }
  results.sort((a, b) => b.score - a.score || a.item.title.localeCompare(b.item.title));
  const hl = new Set();
  tokens.forEach((t) => {
    hl.add(t);
    (SYNONYMS[t] || []).forEach((s) => s.split(' ').forEach((p) => hl.add(p)));
  });
  return { results, partial, tokens: [...hl].filter((t) => t.length > 2) };
}

/** Wrap matching words in <mark>, built with DOM nodes (no HTML parsing). */
function highlight(text, tokens) {
  const frag = document.createDocumentFragment();
  if (!tokens || !tokens.length) {
    frag.appendChild(document.createTextNode(text));
    return frag;
  }
  const re = /[A-Za-z0-9']+|[^A-Za-z0-9']+/g;
  let m;
  let buffer = '';
  while ((m = re.exec(text))) {
    const part = m[0];
    const isWord = /[A-Za-z0-9]/.test(part[0]);
    const norm = isWord ? normalizeText(part).split(' ')[0] : '';
    if (isWord && norm && tokens.some((t) => wordMatch(t, norm) >= 0.65)) {
      if (buffer) frag.appendChild(document.createTextNode(buffer));
      buffer = '';
      frag.appendChild(h('mark', null, part));
    } else {
      buffer += part;
    }
  }
  if (buffer) frag.appendChild(document.createTextNode(buffer));
  return frag;
}

function catOrder(id) {
  const i = CATS.findIndex((c) => c.id === id);
  return i === -1 ? 99 : i;
}

/* ==========================================================================
   03-compose: plain-text composition for copying and the Coaching Builder.
   Deterministic: the same selections always produce the same text.
   ========================================================================== */

const SECTION = {
  strengths: 'Things Went Well',
  feedback: 'Things Can Be Better',
  impact: 'Root Cause & Customer Impact',
  followup: 'Supervisor Follow-Up Plan',
  example: 'Correct Behavior / Example Statement',
  questions: 'Coaching Questions',
};
const planHeading = (settings) => `${durationTitle((settings || state.settings).duration)} SMART Action Plan`;

/* ---------- Single opportunity ---------- */
const oppFeedback = (o) => String(o.feedback || '').trim();
const oppImpact = (o) => String(o.impact || '').trim();
const oppPlan = (o, s) => fillTokens(o.plan, s).trim();
const oppFollowup = (o, s) => fillTokens(o.followup, s).trim();

function exampleLines(o) {
  return (o.example || []).filter((e) => e && e.say);
}
function exampleText(o) {
  return exampleLines(o)
    .map((e) => (e.label ? `${e.label}: "${e.say}"` : `"${e.say}"`))
    .join('\n');
}
function questionsText(o) {
  return (o.questions || []).filter(Boolean).join('\n');
}

/* ---------- Strengths ---------- */
function strengthText(sel) {
  const s = getStrength(sel.id);
  if (!s || !s.v || !s.v.length) return '';
  return s.v[Math.min(sel.v || 0, s.v.length - 1)] || s.v[0];
}
function selectedStrengths() {
  return state.builder.strengths.filter((sel) => getStrength(sel.id));
}
function selectedStrengthsText() {
  return selectedStrengths().map(strengthText).filter(Boolean).join('\n\n');
}

/** Full coaching document for one opportunity, honoring the "Copy Full Coaching includes" settings. */
function fullCoachingText(o) {
  const fc = state.prefs.fullCopy;
  const parts = [`Coaching Focus: ${o.title}`];
  const add = (title, body) => {
    if (body && body.trim()) parts.push(`${title}\n${body.trim()}`);
  };
  if (fc.strengths) add(SECTION.strengths, selectedStrengthsText());
  if (fc.feedback) add(SECTION.feedback, oppFeedback(o));
  if (fc.impact) add(SECTION.impact, oppImpact(o));
  if (fc.plan) add(planHeading(), oppPlan(o));
  if (fc.followup) add(SECTION.followup, oppFollowup(o));
  if (fc.example) add(SECTION.example, exampleText(o));
  if (fc.questions) add(SECTION.questions, questionsText(o));
  return parts.join('\n\n');
}

/* ---------- Builder composition ---------- */
function builderOpps(b) {
  return (b || state.builder).opps.map(getOpp).filter(Boolean);
}

function groupByTheme(opps) {
  const groups = [];
  const index = new Map();
  for (const o of opps) {
    const key = THEMES[o.theme] ? o.theme : '_other';
    if (!index.has(key)) {
      index.set(key, groups.length);
      groups.push({ theme: key, items: [] });
    }
    groups[index.get(key)].items.push(o);
  }
  return groups;
}
const themeOf = (key) => THEMES[key] || FALLBACK_THEME;

function quantity(n) {
  if (n === 1) return 'one';
  if (n === 2) return 'two';
  if (n <= 4) return 'a few';
  return 'several';
}

function challengeOpener(tone, scope, n) {
  const where = scope === 'multiple' ? 'Across the interactions reviewed' : 'During the interaction';
  const q = quantity(n);
  if (tone === 'supportive') {
    const area = n === 1 ? 'is one area' : `are ${q} areas`;
    return scope === 'multiple'
      ? `Across the interactions reviewed, there ${area} we will work on together.`
      : `There ${area} from this interaction that we will work on together.`;
  }
  if (tone === 'direct') {
    return n === 1
      ? `${where}, one behavior did not meet the expected standard.`
      : `${where}, ${q === 'a few' ? 'a few' : q} behaviors did not meet the expected standard.`;
  }
  return n === 1
    ? `${where}, one behavior affected the overall customer experience.`
    : `${where}, ${q} behaviors affected the overall customer experience.`;
}

function challengeCloser(tone, n) {
  if (tone === 'supportive') {
    return n === 1
      ? 'This can be strengthened with focused practice, and the action plan breaks that practice into specific, measurable steps.'
      : 'Each of these can be strengthened with focused practice, and the action plan breaks that practice into specific, measurable steps.';
  }
  if (tone === 'direct') {
    return n === 1
      ? 'Meeting the expected standard in this area is required on every applicable call, and the action plan defines how progress will be measured.'
      : 'Meeting the expected standard in these areas is required on every applicable call, and the action plan defines how progress will be measured.';
  }
  return n === 1
    ? 'The action plan outlines the specific steps and measures for improving in this area.'
    : 'The action plan outlines the specific steps and measures for improving in these areas.';
}

const isShortClause = (s) => wordCount(s) <= 16 && !s.includes(',');

/**
 * Turn clauses into readable sentences: the first uses the lead-in, short neighbours are paired,
 * long clauses get their own sentence, and follow-on sentences rotate their connectors.
 */
function clauseSentences(lead, clauses, followForms) {
  const out = [];
  let i = 0;
  let follow = 0;
  while (i < clauses.length) {
    const a = clauses[i];
    const b = clauses[i + 1];
    const part = b && isShortClause(a) && isShortClause(b) ? [a, b] : [a];
    i += part.length;
    const list = joinList(part);
    if (!out.length) out.push(lead.replace('{list}', list));
    else out.push(followForms[follow++ % followForms.length].replace('{list}', list));
  }
  return out;
}

function composeProgress(b) {
  const paras = [];
  const note = b.notes.progress.trim();
  if (note) paras.push(note);
  for (const sel of b.strengths) {
    if (!getStrength(sel.id)) continue;
    const t = strengthText(sel);
    if (t) paras.push(t);
  }
  return paras.join('\n\n');
}

function composeChallenges(b, opps) {
  if (!opps.length) return '';
  const n = opps.length;
  const sentences = [challengeOpener(b.tone, b.scope, n)];
  const groups = groupByTheme(opps);
  for (const g of groups) {
    const theme = themeOf(g.theme);
    const obs = dedupe(g.items.filter((o) => o.b && o.b.obs).map((o) => o.b.obs));
    sentences.push(...clauseSentences(theme.lead, obs, ['You also {list}.', 'In addition, you {list}.']));
    g.items
      .filter((o) => !(o.b && o.b.obs))
      .forEach((o) => sentences.push(`There was also an opportunity related to ${lowerTitle(o.title)}.`));
  }
  const impacts = dedupe(groups.map((g) => themeOf(g.theme).impact)).slice(0, 4);
  sentences.push(n === 1 ? `This can ${impacts[0]}.` : `Together, these behaviors can ${joinList(impacts)}.`);
  sentences.push(challengeCloser(b.tone, n));
  let text = sentences.map(tidySentence).join(' ');
  const evidence = b.notes.evidence.trim();
  if (evidence && b.notes.includeEvidence) text += '\n\n' + evidence;
  return text;
}

function composePlan(b, opps, s) {
  if (!opps.length) return '';
  const direct = b.tone === 'direct';
  const will = direct ? 'you are expected to' : 'you will';
  const alsoWill = direct ? 'You are also expected to' : 'You will also';
  const focus = dedupe(opps.map((o) => (o.b && o.b.focus) || lowerTitle(o.title)));
  const dur = durationPhrase(s.duration);
  const intro = [];
  if (b.tone === 'supportive') intro.push(`Over the next ${dur}, we will work together on ${joinList(focus)}.`);
  else if (direct) intro.push(`Over the next ${dur}, you are expected to meet the standard for ${joinList(focus)} on every applicable call.`);
  else intro.push(`Over the next ${dur}, you will focus on ${joinList(focus)}.`);

  for (const g of groupByTheme(opps)) {
    const theme = themeOf(g.theme);
    const commits = dedupe(g.items.map((o) => o.b && o.b.commit).filter(Boolean));
    const follow = direct ? ['You are also expected to {list}.', 'In addition, you are expected to {list}.'] : ['You will also {list}.', 'In addition, you will {list}.'];
    intro.push(...clauseSentences(theme.plan.replace('you will', will), commits, follow));
    g.items
      .filter((o) => !(o.b && o.b.commit))
      .forEach((o) => intro.push(`${alsoWill} apply the expected behavior for ${lowerTitle(o.title)} on every applicable call.`));
  }

  const calls = numWord(s.calls);
  const measure = [`We will review ${calls} applicable calls within the next ${followupPhrase(s.followup)} to measure progress.`];
  const std = dedupe(opps.map((o) => o.b && o.b.m).filter(Boolean));
  if (std.length && std.length <= 2) measure.push(`The target is for all ${calls} reviewed calls to show ${joinList(std)}.`);
  else if (std.length) measure.push(`The targets for all ${calls} reviewed calls are: ${std.slice(0, -1).join('; ')}; and ${std[std.length - 1]}.`);
  dedupe(opps.map((o) => o.b && o.b.mx).filter(Boolean)).forEach((mx) => measure.push(fillTokens(mx, s)));
  if (!std.length && !opps.some((o) => o.b && o.b.mx)) {
    measure.push(`The target is for all ${calls} reviewed calls to show the expected behaviors in this plan.`);
  }
  return intro.map(tidySentence).join(' ') + '\n\n' + measure.map(tidySentence).join(' ');
}

function composeFollowup(b, opps, s) {
  if (!opps.length) return '';
  const allCoach = dedupe(opps.map((o) => o.b && o.b.coach).filter(Boolean));
  const coach = allCoach.slice(0, 2);
  const parts = [];
  if (!coach.length) parts.push('During this coaching session, we will walk through the expected behaviors together using examples from the call.');
  else if (coach.length === 1) parts.push(`During this coaching session, we will complete ${coach[0]}.`);
  else parts.push(`During this coaching session, we will complete ${coach[0]}.`, `We will also complete ${coach[1]}.`);
  if (opps.length > coach.length && coach.length) parts.push('We will cover the remaining focus areas with short examples from the call.');
  const checkin = s.followup >= 5 ? 'a brief midweek check-in' : 'a brief check-in';
  parts.push(`I will review ${numWord(s.calls)} of your applicable calls within the next ${followupPhrase(s.followup)} and share what I find, and we will have ${checkin} to discuss what is working and any recurring gaps.`);
  parts.push(`At the end of the ${durationAdj(s.duration)} coaching period, we will review the results together and decide whether the plan is complete or needs to be extended or adjusted.`);
  if (b.tone === 'supportive') parts.push('If anything in this plan feels unclear, or you would like more practice before then, let me know and we will set up time.');
  if (b.tone === 'direct') parts.push('If the targets are not met by the end of the plan, we will discuss next steps, which may include an extended plan.');
  return parts.map(tidySentence).join(' ');
}

/** Generate all four builder sections from the current selections. */
function composeBuilder(b, settings) {
  const builder = b || state.builder;
  const s = settings || state.settings;
  const opps = builderOpps(builder);
  return {
    progress: composeProgress(builder),
    challenges: composeChallenges(builder, opps),
    plan: composePlan(builder, opps, s),
    followup: composeFollowup(builder, opps, s),
  };
}

/** Current text of a builder section: the supervisor's edit if any, otherwise the generated text. */
function builderSectionText(key, generated) {
  const edited = state.builder.edited[key];
  if (typeof edited === 'string') return edited;
  return (generated || composeBuilder())[key] || '';
}

function builderAllText() {
  const gen = composeBuilder();
  return BUILDER_FIELDS.map((f) => `${f.title}\n${builderSectionText(f.key, gen).trim()}`).join('\n\n');
}

/* Original per-opportunity paragraphs, for supervisors who prefer them stacked. */
function stackedText(kind) {
  const opps = builderOpps();
  if (!opps.length) return '';
  if (kind === 'feedback') return opps.map((o) => oppFeedback(o)).join('\n\n');
  if (kind === 'plan') return opps.map((o) => oppPlan(o)).join('\n\n');
  return opps.map((o) => `${o.title}\n${oppFeedback(o)}\n\n${planHeading()}\n${oppPlan(o)}`).join('\n\n');
}

/* Strength vs opportunity conflicts (e.g. Personalized Empathy alongside Missing Empathy). */
function conflictsFor(strengthId, oppIds) {
  return oppIds.filter((oid) => (OPPOSITES[oid] || []).includes(strengthId)).map(getOpp).filter(Boolean);
}
