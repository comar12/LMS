ly identified. If it was not, the Discovery entry for not identifying the main concern is the better fit."},{"id":"own-missing-followup","cat":"own","title":"Missing Follow-Up / Callback Commitment","desc":"Ending a call that required follow-up without setting, explaining, and documenting a clear follow-up commitment per the applicable process.","kw":["follow-up","follow up","callback","call back","no follow-up","no callback","pending ticket","open ticket","work order","credit review","pending request","follow-up commitment","documentation","status update","left hanging","next steps","pending case"],"tags":["Follow-Up","Ownership","Documentation"],"kpi":["QA","aiCR"],"theme":"own","feedback":"Because the resolution depended on a pending action, such as an open ticket or a credit review, the customer needed to know what would happen after the call. You ended the call without setting a follow-up commitment, explaining how the customer would hear back, or noting what was pending on the account. Pending work needs a clear owner and a clear next step, and the customer needs to know both. Without that, the customer is left guessing and may call back only to check the status. Moving forward, whenever a request remains open, explain what happens next, set the follow-up the applicable process provides, and document it clearly.","impact":"Missing follow-up commitments usually happen when the work done during the call feels complete, even though part of the outcome depends on another team or a later action. If the customer does not know how or when they will hear back, uncertainty fills the gap. This often leads to status calls that add to repeat contacts, and if the pending item is not documented, it can be missed entirely, increasing the risk of escalation.","plan":"During the next {duration}, every call that ends with a pending action, such as an open ticket, a work order, or a credit review, will include a clear follow-up commitment before you close. You will explain what is pending, how the customer will hear back or check the status, and what to do if they do not, using only the timeframes and follow-up options the applicable process supports. You will also document the commitment in the account notes before the call ends. We will review {calls} calls within {followup}, focusing on those with pending actions, and the goal is a follow-up commitment that is both explained and documented on each one.","followup":"Together, we will review the follow-up options in the applicable process and build a short checklist for any request that stays open: what is pending, how follow-up happens, and what the customer should do if it does not. I will select {calls} of your calls with pending actions from the next {followup} and compare what you told the customer with what was documented. We will discuss progress midweek and look at the full results at the end of {duration}.","example":[{"label":"Setting the follow-up","say":"Your credit request has been submitted for review, and that review happens after our call. I've documented the details on your account, so anyone you speak with will see what was requested. If the credit is approved, you'll see it on your account within the timeframe I mentioned. If you haven't seen an update by then, call us and mention this request so we can check the status right away."}],"questions":["What part of the customer's request was still pending when the call ended?","How would the customer know what to expect next, and what to do if nothing happens?","What would someone reading your account notes understand about the follow-up from this call?"],"strengths":["s-empathy","s-probing","s-troubleshooting","s-tools","s-clarity"],"b":{"obs":"ended the call with an action still pending but without a clear follow-up commitment that was explained and documented","focus":"follow-up commitments","commit":"set a clear follow-up commitment per the applicable process and document it before ending any call with an open action","mx":"Every call with a pending action during the next {duration} ends with a follow-up commitment that is explained to the customer and documented per the applicable process.","coach":"a review of the follow-up options in the applicable process with a pending-action checklist"},"note":"Confirm the program's current follow-up and callback options before the session, including which requests allow an agent callback and what must be documented. For callbacks after a dropped call, use the Hold entry instead."},{"id":"own-repeat-contacts","cat":"own","title":"Failure to Take Ownership of Repeat Contacts","desc":"Treating a repeat contact as a new issue, without acknowledging prior attempts or changing the approach from what already failed.","kw":["repeat contact","repeat caller","called before","called again","multiple calls","second call","third call","same issue","aicr","repeat rate","contact history","prior attempts","same steps again","repeated troubleshooting","not acknowledged","frustrated repeat caller","ownership"],"tags":["Repeat Contacts","Ownership","Contact History"],"kpi":["QA","aiCR"],"theme":"own","feedback":"Although this was not the customer's first contact about the issue, the call was handled as if it were new. You did not acknowledge the earlier attempts or review the contact history, and you repeated steps the customer had already completed. A customer calling back about an unresolved issue is often already doubting that it can be fixed, and hearing the same steps again can deepen that doubt. When a customer has called before, acknowledge it directly, review the history and notes, and take ownership of a different approach, escalating through the correct path when needed, so the customer hears a new plan rather than a repeat of the last one.","impact":"Repeat contacts are often handled as new when the standard flow is started from the beginning without checking what happened on earlier contacts, or when the cues that the customer has called before are missed. A repeat contact handled like a first call increases the chance of yet another one, which can raise the aiCR repeat rate. It can also turn a patient customer into a frustrated one and increase the risk of escalations, complaints, and cancellation.","plan":"For the next {duration}, whenever a customer says they have called before, or the account shows a recent contact about the same issue, you will acknowledge the earlier attempts within the first minute and review the contact history and notes before recommending any step. You will avoid repeating completed steps unless there is a specific reason, which you will explain to the customer. If the earlier approach did not work, you will choose a different resolution path or escalate through the correct path per the applicable process. In the {calls} calls we review within {followup}, every repeat contact should show an acknowledgement, a history review, and a changed or escalated approach.","followup":"We will listen to the first few minutes of this call side by side to identify the cues that it was a repeat contact, then practice an opening that acknowledges the history and sets a new plan. I will review {calls} of your calls within {followup}, giving extra attention to any repeat contacts, and we will look at the contact history together for one of them. After a midweek check-in, we will meet at the end of the {durationAdj} coaching period to review how each repeat contact was handled.","example":[{"label":"Acknowledging the history","say":"I can see you've already called about this, and you've restarted the equipment more than once. I'm sorry it's still happening. I won't ask you to repeat what's already been done. I'm going to look at what was tried last time and take a different approach today."},{"label":"Changing the approach","say":"Since the restart didn't hold last time, I'm going to check the signal on the line itself, and if it points to something we can't fix by phone, I'll set up the right next step before we finish."}],"questions":["What signs in the call or on the account showed that the customer had contacted us before?","How might the customer have felt hearing the same steps they had already tried?","What would you do differently from the previous contact to give this customer a better chance of resolution?"],"strengths":["s-empathy","s-tone","s-verification","s-clarity","s-tools"],"b":{"obs":"handled a repeat contact as a new issue without acknowledging earlier attempts and repeated steps the customer had already completed","focus":"repeat contact ownership","commit":"acknowledge earlier contacts on a repeat issue and change or escalate the approach instead of repeating steps that did not work","mx":"Every repeat contact in the reviewed calls during the next {duration} includes an acknowledgement of earlier attempts, a contact history review, and a different or escalated approach.","coach":"a side-by-side listen to the call opening to spot repeat contact cues"},"note":"Review the account's contact history for this issue before the session so the coaching can reference what was tried on earlier contacts, and confirm the program's current process for escalating repeat or unresolved issues."},{"id":"own-incomplete-education","cat":"own","title":"Incomplete Customer Education","desc":"Closing without explaining what was done, why, what to expect next, how to prevent the issue, and which self-service options can help.","kw":["customer education","education","educate","explain what was done","self-service","self service","app","prevent recurrence","how to prevent","teach the customer","what to expect","no explanation","did not explain","why it happened","tips","prevention"],"tags":["Customer Education","Resolution","Prevention"],"kpi":["QA","aiCR"],"theme":"own","feedback":"After the issue was resolved, you moved toward closing without explaining what you had changed, why it worked, or what the customer could do if it happened again. A short explanation is what helps a fix last beyond the call, because it gives the customer the context to recognize and handle a recurrence. Without it, a minor repeat of the problem may feel like the original issue all over again, and the customer is likely to call rather than try a quick self-service step. Going forward, explain what you did and why, what to expect next, how to prevent a recurrence, and which approved self-service options fit.","impact":"Incomplete education often comes from treating the fix as the finish line, especially when the call has already run long. Customers who do not understand what was changed or how to handle a recurrence are more likely to call back about issues they could have resolved on their own. This can add to repeat contacts and handle time, and it misses a chance to build the customer's confidence in managing their services.","plan":"Beginning today and continuing for {duration}, before closing any call where you made a change or resolved an issue, you will explain in plain language what you did, why it worked, and what the customer should expect next. You will share at least one practical tip for preventing or handling a recurrence and, when it fits the concern, point the customer to an approved self-service option and how to use it. You will invite questions to confirm the customer understood before you close. We will measure this across {calls} calls reviewed within {followup}, looking for an explanation of the fix, clear expectations, and a prevention or self-service tip on each.","followup":"In our session, we will build a short education checklist together, covering what was done, why it worked, what to expect, and how to prevent a recurrence, and then practice it on two common issues. I will then score {calls} of your calls against that checklist within {followup}, and we will discuss your examples at a midweek check-in. We will review the full plan, including your checklist results, at the end of {duration}.","example":[{"label":"Explaining the fix","say":"Here's what happened. Your gateway was holding onto an old setting, so the restart cleared it and reconnected you to the network. That's why everything is working again."},{"label":"Preventing a repeat","say":"If the connection slows down again, restarting the gateway is a quick first step, and you can do that from the app. If that doesn't help, give us a call and mention today's fix so we can pick up where we left off."}],"questions":["What did the customer understand about the cause and the fix by the time the call ended?","Which self-service option would have helped this customer most, and how could you have introduced it?","How could a short explanation at the end of the call reduce the chance of another contact?"],"strengths":["s-resolution","s-troubleshooting","s-ownership","s-tone","s-diagnosis"],"b":{"obs":"resolved the issue without explaining what was done or how the customer could prevent and handle a recurrence on their own","focus":"customer education","commit":"explain what you did and how the customer can prevent or handle a recurrence, including any relevant self-service option","m":"an explanation of what was done and why, what to expect, and a prevention or self-service tip","coach":"an education checklist exercise practiced on two common issue types"},"note":"Confirm which self-service options are approved for the agent's program and line of business before recommending them in the session. For billing-specific education, use the Billing entry instead."},{"id":"own-unsupported-guarantees","cat":"own","title":"Unsupported Guarantees","desc":"Promising outcomes that cannot be controlled or confirmed on the call, such as a guaranteed fix, an approved credit, or an exact arrival time.","kw":["guarantee","guaranteed","promised","promise","overpromise","overpromising","definitely fix","for sure","will definitely","credit promise","technician arrival time","exact time","false promise","unrealistic promise","certainty","misleading"],"tags":["Expectations","Accuracy","Customer Trust"],"kpi":["QA","aiCR"],"theme":"own","feedback":"While explaining the next steps, you promised an outcome that was not within your control, such as telling the customer the fix would definitely work or that a credit would be approved. Promises like these are usually meant to reassure, but they turn a possibility into a commitment. If the result turns out differently, the customer may feel misled and can carry that mistrust into future contacts. The expectation is to describe outcomes accurately, with language such as \"this is the step most likely to fix it\" or \"I've submitted the request for review,\" and to explain what happens if the result is not what the customer hoped for.","impact":"Unsupported guarantees often come from a genuine wish to calm a frustrated customer or end the call on a positive note. When the promised outcome does not happen, the customer measures the company against what they were told, not what was realistic. This can lead to repeat contacts, escalations, and complaints, and it may put pressure on the next representative to honor a commitment that was never available.","plan":"Throughout the next {duration}, you will describe any outcome that depends on a system, a review, a technician, or another team as an expected result rather than a promise. You will replace words like \"definitely,\" \"guaranteed,\" and \"for sure\" with accurate language about what you have done and what is likely to happen next. When a customer asks for certainty you cannot give, you will explain what you can commit to, such as the action you completed, and what the next step will be if the outcome changes. The standard is zero unsupported guarantees across {calls} calls reviewed within {followup}.","followup":"We will start by building a personal phrase bank of accurate alternatives to guarantee language, covering fixes, credits, and appointments. Over the next {followup}, I will listen to {calls} of your calls for any statement that promises an outcome, and we will compare what was said with a more accurate version. We will check in midweek, and the plan will close with a review of your calls at the end of {duration}.","example":[{"label":"Instead of a guarantee","say":"Based on what we're seeing, replacing the equipment is the step most likely to fix this. I can't promise it will solve everything, but if it doesn't, the next step would be a closer look at the line, and today's notes will be on your account so you won't start over."},{"label":"For a credit request","say":"I've submitted your credit request with all the details from today. I'm not able to approve it myself, but the review will have everything it needs to make a decision."}],"questions":["What were you hoping the customer would feel when you said the outcome was certain?","Which parts of that outcome were actually within your control at that moment?","How could you reassure the customer next time while still describing the result accurately?"],"strengths":["s-empathy","s-ownership","s-rapport","s-troubleshooting"],"b":{"obs":"guaranteed outcomes that were outside your control rather than describing the expected result accurately","focus":"accurate commitments","commit":"describe uncertain outcomes as expected results and commit only to the actions within your control","mx":"Zero unsupported guarantees appear in the reviewed calls during the next {duration}, and every uncertain outcome is described with accurate, conditional language.","coach":"a phrase bank exercise replacing guarantee language with accurate alternatives"},"note":"Confirm what agents are permitted to commit to for credits, appointments, and equipment under the program's current process, so the coaching separates real commitments from unsupported promises."},{"id":"own-expectation-setting","cat":"own","title":"Weak Expectation Setting","desc":"Leaving expectations vague or incomplete about timeframes, next steps, and what the customer should do if the issue continues.","kw":["expectations","expectation setting","set expectations","weak expectations","vague","timeframe","time frame","next steps","what to expect","unclear next steps","if it doesn't work","how long","no timeline","customer confused","managing expectations","backup plan"],"tags":["Expectations","Next Steps","Call Closing"],"kpi":["QA","aiCR"],"theme":"own","feedback":"As the call wrapped up, you described what would happen next in general terms, such as \"it should update soon,\" without a timeframe or a plan if the issue continued. Clear expectations give the customer something concrete to follow and check against. When the timing, the next step, and the backup plan are left open, the customer has to guess, and that uncertainty often turns into frustration or an early call to ask for a status. Next time, give the timeframe from approved resources, describe exactly what will happen next, and tell the customer what to do if the result is not what you both expect.","impact":"Weak expectation setting usually happens when the next steps feel obvious to you or the exact timeframe is not known, so the explanation stays general. Customers fill that gap with their own assumptions, which are often shorter or more optimistic than the real timeline. When those assumptions are not met, the result can be status calls, repeat contacts, and lower satisfaction, even when the work itself was handled correctly.","plan":"Over the next {duration}, you will end each call by stating three things clearly: the timeframe for any change or pending action, taken from approved resources, the specific next step and who completes it, and what the customer should do if the issue continues or the timeframe passes. When an exact timeframe is not available, you will say so and explain how the customer can check progress rather than offering a guess. You will confirm the customer understands the plan before ending the call. We will review {calls} calls within {followup}, and each one should include a stated timeframe, a defined next step, and a backup plan.","followup":"During our session, we will practice turning vague statements into specific expectations using three common scenarios from your line of business, and you will complete a self-assessment of this call against the timeframe, next step, and backup plan standard. I will review {calls} of your calls within {followup}, and we will meet midweek to discuss one example from those calls. At the close of the {durationAdj} plan, we will go through your expectation statements from the reviewed calls together.","example":[{"label":"Setting clear expectations","say":"Here's what to expect. Your box is restarting now, and that usually takes about five minutes. Once it finishes, your channels should be back. If they're still missing after that, unplug the box for about thirty seconds and plug it back in. If that doesn't work, call us and mention today's restart so we can go straight to the next step."}],"questions":["If the customer repeated your next steps back to you, what would they have said?","Which timeframe or next step could you have confirmed in approved resources before closing?","What should the customer do if the issue continues, and how could you have told them?"],"strengths":["s-ownership","s-empathy","s-troubleshooting","s-diagnosis","s-tone"],"b":{"obs":"described the next steps in general terms without a clear timeframe or guidance on what to do if the issue continued","focus":"clear expectation setting","commit":"give a specific timeframe and next step before closing and explain what to do if the issue continues","m":"a specific timeframe, a defined next step, and a clear plan if the issue continues","coach":"a self-assessment of this call against the timeframe, next step, and backup plan standard"},"note":"Confirm the current timeframes in approved resources for the changes this agent commonly handles, so the coaching references accurate expectations rather than estimates."},{"id":"own-escalation-path","cat":"own","title":"Incorrect Escalation Path","desc":"Escalating to the wrong team or channel, escalating when it was not needed, or not escalating when the situation required it.","kw":["escalation","escalate","escalated","wrong escalation","escalation path","unnecessary escalation","missed escalation","should have escalated","wrong team","tier 2","higher level support","escalation criteria","escalation process","supervisor request","sup call","manager request"],"tags":["Escalation","Process","Ownership"],"kpi":["QA","Transfer","aiCR"],"theme":"own","feedback":"When the concern reached the point of a possible escalation, your decision about whether and where to escalate did not match the situation. Escalation criteria exist so each issue reaches the team that can resolve it when it is needed. Escalating too early or to the wrong place adds handoffs, and holding on to an issue that meets the criteria delays the help it needs. Either way, the customer may wait longer, repeat their story, and lose confidence that the issue is moving. Going forward, check the situation against the escalation criteria in approved resources, use the correct path when they apply, and explain to the customer what happens next.","impact":"Escalation errors often come from uncertainty about the criteria for each path. Some issues are escalated quickly because the call feels difficult, while others stay with the first contact too long out of a wish to solve everything personally. A misdirected or missed escalation can add transfers and handle time, delay the resolution, and lead the customer to call back for an update, while unnecessary escalations add load to teams that should be handling more complex issues.","plan":"During the next {duration}, before any escalation you will review the escalation criteria in approved resources, confirm the issue meets them, and identify the correct path for the situation. When the issue is within your scope, you will resolve it using your own resources and support channel, and when the criteria are met, you will escalate promptly rather than continuing on your own. Every escalation will include a clear explanation to the customer and documented notes per the applicable process. Within {followup}, we will review {calls} calls, including each escalation and each concern that may have needed one, with the target of a correct decision and path every time.","followup":"We will walk through the escalation criteria and paths in the process documentation together, then complete a quick knowledge check with four short scenarios where you decide whether to escalate and where. I will review {calls} of your calls within {followup}, focusing on any call where an escalation was made or could have been. We will talk through the results midweek and confirm readiness at the end of the {durationAdj} coaching period.","example":[{"label":"Escalating correctly","say":"I've checked everything I can from here, and this needs a team with specialized access to your line. I'm escalating it through the correct process now and documenting what we've already tried, so no one asks you to repeat it."},{"label":"Resolving within scope","say":"This is something I can take care of myself, so there's no need to send it anywhere else. I'll make the change now, and we'll confirm it together."}],"questions":["What told you this concern did or did not need to be escalated at that point?","Where in approved resources could you have confirmed the correct escalation path?","How might the customer's experience have changed if the right team had been involved at the right time?"],"strengths":["s-ownership","s-empathy","s-probing","s-verification","s-tone"],"b":{"obs":"made an escalation decision that did not match the criteria, either in whether to escalate or where to send the concern","focus":"correct escalation decisions","commit":"check the escalation criteria in approved resources and escalate through the correct path whenever they apply","mx":"Every escalation decision in the reviewed calls during the next {duration} matches the escalation criteria, uses the correct path, and is explained to the customer.","coach":"a scenario-based knowledge check on escalation criteria and the correct path for each"},"note":"Confirm the program's current escalation criteria and paths before the session. Note from the recording whether the gap was the wrong destination, an unnecessary escalation, or a missed one, so the coaching targets the right decision."},{"id":"own-objections","cat":"own","title":"Not Addressing Customer Objections or Concerns","desc":"Moving past the customer's doubts or concerns about cost, time, a recommended step, or a past experience without addressing them.","kw":["objections","customer concerns","concerns","doubts","hesitation","pushback","brushed off","ignored concern","dismissive","customer worried","cost concern","time concern","skeptical","past bad experience","won't work","reassurance","not addressing concerns"],"tags":["Customer Concerns","Customer Trust","Soft Skills"],"kpi":["QA","aiCR"],"theme":"own","feedback":"After the customer expressed doubt about the recommended step, such as questioning whether it would work after a past bad experience or worrying about the time or cost involved, you continued with the process without responding to it. An unanswered concern does not go away; it stays with the customer and shapes how they hear everything that follows. A customer who still has doubts may hesitate, skip the step after the call, or decline a solution that would have helped. Moving forward, pause when a concern comes up, acknowledge it, ask a question to understand it, and answer it honestly before continuing.","impact":"Concerns tend to get passed over when the focus is on completing the process and a question sounds like an interruption rather than part of the conversation. Left unanswered, a doubt often resurfaces later as resistance, a declined solution, or a step the customer never completes. That can extend the call, lead to repeat contacts when the issue is not fully resolved, and leave the customer feeling that their input did not matter.","plan":"Starting with your next call and continuing for {duration}, you will treat every concern or doubt the customer raises as part of the resolution rather than an interruption. You will acknowledge the concern in your own words, ask one clarifying question to understand what is behind it, and respond with accurate information, such as why the step is needed, what it involves, or what will be different from a past experience. You will then check whether the customer is comfortable continuing before moving to the next step. Across the {calls} calls we review within {followup}, the target is a direct, accurate response to every concern the customer raises.","followup":"In our session, we will roleplay three concerns customers often raise on service calls, such as doubt that a step will work, worry about the time involved, and frustration from a past experience, practicing an acknowledge, clarify, and respond sequence for each. As I review {calls} of your calls within {followup}, I will note each concern the customer raised and how it was answered. We will check progress midweek and wrap up with a full review when the {durationAdj} plan ends.","example":[{"label":"Responding to a doubt","say":"That's a fair concern, especially if a restart didn't help last time. Can I ask what happened after that one? This time I'm also updating the settings on your equipment first, which is a different step, and we'll check the result together before we finish."}],"questions":["What concern did the customer raise, and what do you think was behind it?","How might the customer have felt when the call continued without a response to their concern?","What question could you have asked to understand the concern before answering it?"],"strengths":["s-troubleshooting","s-ownership","s-verification","s-tone","s-itg"],"b":{"obs":"continued with the process after the customer raised a doubt or concern without acknowledging or answering it","focus":"addressing customer concerns","commit":"acknowledge and answer every concern the customer raises before moving on to the next step","mx":"Every concern or doubt the customer raises in the reviewed calls during the next {duration} is acknowledged, clarified, and answered before the call moves on.","coach":"a roleplay of common service concerns using an acknowledge, clarify, and respond sequence"},"note":"This entry covers concerns raised in a service context. For objections to an offer or a sale, use the Sales entry for objection handling instead."},{"id":"own-confirm-resolution","cat":"own","title":"Not Confirming Resolution Before Closing","desc":"Ending the call without confirming with the customer that the issue is resolved, services are working, and nothing else is needed.","kw":["confirm resolution","confirmation","no confirmation","did not confirm","closing","call closing","anything else","is it working","services working","check services","abrupt ending","ended call","no final check","resolution check","verify with customer","rushed ending"],"tags":["Resolution","Call Closing","Verification"],"kpi":["QA","aiCR"],"theme":"own","feedback":"Before ending the call, you moved straight to the closing without checking with the customer that the issue was resolved from their side, that their other services were working normally, or whether anything else was needed. Your work may have been correct, but the customer is the one who can confirm it. Without that final check, a remaining problem or a second question can go unmentioned until the customer has to call again. Before closing future calls, ask the customer to confirm the issue is resolved, verify that related services are working, and ask whether there is anything else you can help with.","impact":"Skipping the final confirmation usually happens when the fix looks complete on your screen or when there is pressure to keep handle time down. The customer's experience on their own devices is the real measure of resolution, and a short check often reveals a remaining gap while it is still easy to address. Without it, unresolved issues and unasked questions can turn into repeat contacts and lower quality results.","plan":"For the next {duration}, before closing every call, you will ask the customer to confirm in their own words that the issue is resolved, check that any related services, such as internet, TV, or mobile, are working normally, and ask whether there is anything else you can help with. If the customer cannot confirm right away, you will explain how they can check and what to do if something is still not working. We will review {calls} calls within {followup}, targeting a customer confirmation of resolution, a related services check, and an offer of further help on all {calls} calls.","followup":"We will listen together to the closing minutes of a strong call example and note how the resolution was confirmed, then you will practice the same three-part close using this call. Within {followup}, I will review the final minute of {calls} of your calls, and we will discuss what we found at a midweek check-in. At the end of the {durationAdj} coaching period, we will decide whether the three-part close has become part of your routine.","example":[{"label":"Confirming the fix","say":"Before we wrap up, could you check the internet on the devices you use most and let me know how it's working? I'd also like to make sure your TV service is still working normally."},{"label":"Before closing","say":"I'm glad everything is working. Is there anything else I can help you with today?"}],"questions":["How did you know the issue was resolved from the customer's side when the call ended?","What other services could have been affected, and how could you have checked them?","Which closing question would make sure nothing is left unresolved before the customer hangs up?"],"strengths":["s-troubleshooting","s-ownership","s-empathy","s-itg","s-tone"],"b":{"obs":"closed the call without confirming with the customer that the issue was resolved and that nothing else was needed","focus":"resolution confirmation","commit":"confirm with the customer that the issue is resolved and nothing else is needed before closing the call","m":"a customer confirmation of resolution, a related services check, and an offer of further help before closing","coach":"a strong call example review focused on confirming resolution before the close"},"note":"Listen to the final minute of the call to confirm whether resolution was checked with the customer. A recap alone does not meet this behavior if the customer was never asked to confirm."},{"id":"tech-knowledge-gap","cat":"tech","title":"Technical Knowledge Gap","desc":"Hesitating or sharing incorrect technical information because a product or technology concept was not fully understood.","kw":["knowledge gap","product knowledge","technical knowledge","wrong information","incorrect information","misinformation","hesitation","hesitant","unsure","guessing","did not know","how it works","wi-fi","gateway","training","knowledge check","approved resources","study"],"tags":["Product Knowledge","Technical Accuracy","Learning"],"kpi":["QA","aiCR","Transfer"],"theme":"tech","feedback":"When the customer asked a technical question about how the service or equipment works, you hesitated and gave an explanation that was not fully accurate. Questions like this are a chance to build the customer's confidence, and an answer that sounds unsure or turns out to be wrong can make them doubt your other recommendations. The customer may act on that information, try steps that cannot help, or contact us again when the answer does not hold up. Moving forward, when a concept is unclear, take a moment to confirm it in an approved resource before you answer, and keep building your knowledge of the products you support most often.","impact":"A knowledge gap like this usually comes from limited exposure to a product or technology, combined with pressure to answer quickly instead of pausing to confirm. When the customer receives inaccurate technical information, they may make decisions based on it, spend time on steps that will not help, or lose confidence in the support they received. This can lead to repeat contacts, avoidable transfers, longer handle time, and lower quality results.","plan":"Over the next {duration}, you will complete a focused review of the approved resources that cover the product or technology concept from this call, along with any related topics you identify as uncertain. Within {followup}, you will complete a knowledge check with me on those concepts and spend time in side-by-side learning with a peer who handles these questions confidently. On every call, when a technical detail is unclear, you will confirm it in an approved resource before sharing it rather than answering from assumption. We will review {calls} calls that include technical questions, targeting accurate information and no unverified answers in all {calls} calls.","followup":"During our session, we will identify the exact concept behind the hesitation and find it together in the approved resources, so you know where to look the next time it comes up. I will run a short knowledge check within {followup} and arrange a side-by-side session with an experienced peer. I will also review {calls} calls with technical questions during the plan, and at the end of the {durationAdj} period we will decide whether any other topics need attention.","example":[{"label":"Before answering","say":"I want to make sure I give you the right answer on that, so let me confirm how it works in our reference material. It will take about a minute."},{"label":"After confirming","say":"Thanks for waiting. Wi-Fi speeds can be lower than the speed coming into your home, because walls and distance weaken the signal. That's why devices closer to the gateway usually get faster speeds."}],"questions":["Which part of the customer's question were you unsure about, and where in the approved resources could you have confirmed it?","How might the customer use the information you shared if it turned out to be inaccurate?","Which products or topics would you like to study first to feel more confident on these calls?"],"strengths":["s-empathy","s-ownership","s-hold","s-verification"],"b":{"obs":"hesitated and gave inaccurate information about how the service or equipment works, instead of confirming the concept in an approved resource first","focus":"product and technical knowledge","commit":"confirm any technical concept you are unsure of in an approved resource before answering, and complete targeted study of the products you support most","m":"accurate technical information, with any uncertain detail confirmed in an approved resource before it is shared","coach":"a quick knowledge check on the product concepts behind this call"},"note":"Before the session, identify the specific product or technology concept behind the gap and the approved resource that covers it. Confirm which learning paths or knowledge checks are currently available to the agent."},{"id":"tech-itg-incorrect","cat":"tech","title":"Incorrect / Incomplete ITG Usage","desc":"Using the ITG but skipping steps, following a flow that does not match the issue, or stopping before the flow is complete.","kw":["itg","troubleshooting guide","skipped steps","incomplete itg","wrong flow","wrong itg","missed steps","steps out of order","partial troubleshooting","itg compliance","process adherence","did not finish","incomplete troubleshooting","itg flow"],"tags":["ITG","Process","Troubleshooting"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"You opened the ITG during this call, but some steps in the flow were skipped, and the troubleshooting moved to a resolution before the flow was complete. The ITG is built to rule out possible causes in a set order, so when steps are skipped or the selected flow does not match the reported symptom, the real cause can be missed. The customer may leave believing the issue is fixed, only to have it return and need to troubleshoot again on another call. Next time, confirm that the flow you select matches the symptom the customer described, and complete each step in order before recommending a fix or next step.","impact":"Incomplete ITG usage often comes from familiarity with common issues, which makes it tempting to jump ahead to the step that usually works, or from choosing a flow based on the first symptom mentioned. When steps are skipped, the actual cause may go untested, so the fix may not hold and the customer may need to call again and repeat steps they already completed. This can affect quality results and repeat contact rates.","plan":"For the next {duration}, you will confirm the reported symptom before selecting an ITG flow and check that the flow you choose matches it. You will complete every step in the order the flow presents it, and if a step cannot be completed, you will document why according to the current process before moving on. Before offering a resolution, you will confirm that the flow has reached its conclusion. Within {followup}, we will review {calls} technical calls, and the target is the correct flow with every applicable step completed in all {calls} calls.","followup":"In our session, we will walk through the ITG flow that applied to this call step by step, marking the steps that were skipped and what each one would have ruled out. I will review {calls} of your technical calls within {followup} and compare each one against the applicable flow. We will meet midweek to talk through any steps that feel unclear, and we will review the results together at the end of the {durationAdj} plan.","example":[{"say":"We're almost through the troubleshooting for this issue, and there are two more checks I want to complete before we decide on the next step. That way, we know we haven't skipped anything that could be causing the connection to drop. The next check takes about a minute, and I'll tell you what it shows."}],"questions":["Which steps in the flow did you move past, and what was each of those steps designed to rule out?","How did you decide which ITG flow to use, and how well did it match what the customer described?","What would help you stay with the flow when you feel confident you already know the fix?"],"strengths":["s-acknowledgement","s-ownership","s-research-updates","s-verification"],"b":{"obs":"used the ITG but skipped steps or followed a flow that did not match the reported symptom, and moved to a resolution before the flow was complete","focus":"full ITG adherence","commit":"select the ITG flow that matches the reported symptom and complete each step in order before recommending a resolution","m":"the correct ITG flow for the symptom, with every step completed in order before a resolution is offered","coach":"a step-by-step walkthrough of the ITG flow that applied to this call, marking each skipped step"},"note":"Confirm the current ITG version and the flow that applied to the reported symptom before the session. Mark on the recording where steps were skipped or the flow changed, so the walkthrough covers the exact steps involved."},{"id":"tech-itg-missing","cat":"tech","title":"Missing ITG","desc":"Troubleshooting from memory without opening the ITG when the issue called for it, leaving required steps and checks out.","kw":["missing itg","no itg","itg not used","did not use itg","itg","troubleshooting guide","from memory","freelancing","winging it","own steps","process not followed","guide not used","no process","itg flow"],"tags":["ITG","Process","Compliance"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"Throughout the troubleshooting, you worked from memory instead of opening the applicable ITG flow, even though the concern required it. Experience with common issues is valuable, but the ITG keeps troubleshooting consistent and makes sure checks that are easy to forget, such as confirming scope or equipment status, are not left out. Without it, the customer may go through steps that do not apply, miss the step that could resolve the issue, or hear a different approach from the next person they speak with. Instead, open the applicable flow as soon as the technical concern is clear and let it guide each step, even on issues you see often.","impact":"Skipping the ITG usually happens when an issue feels familiar and working from memory seems faster. Memory makes it easy to drop less common checks and does not reflect recent updates to the guide, so the fix may not address the actual cause. This can lead to repeat contacts, unnecessary technician visits, inconsistent experiences from one contact to the next, and process findings on the quality evaluation.","plan":"Starting with your next call and continuing for {duration}, you will open the applicable ITG flow as soon as a technical concern is identified, before giving any troubleshooting instruction. You will follow the flow from its first step, even when the issue seems familiar, and use it to decide each next action rather than relying on steps you remember. If you cannot locate the correct flow, you will ask for support through the approved channel instead of continuing from memory. We will review {calls} calls with technical concerns within {followup}, targeting the applicable flow opened and followed in all {calls} calls.","followup":"We will start with a practice run in which you open and follow the applicable ITG flow for a common connection concern while I play the customer. I will then review {calls} of your technical calls within {followup} to confirm the flow was used from the first step, and we will check in midweek on any flows that are hard to find. At the end of the {duration}, we will review whether opening the ITG has become part of how you start every technical call.","example":[{"say":"Let me bring up the troubleshooting steps for this exact issue, so we go through everything in the right order and don't miss anything. The first step is a quick check of your equipment status, and I'll walk you through each step as we go."}],"questions":["What led you to troubleshoot from memory on this call instead of opening the ITG flow?","Which checks in the applicable flow might have changed the outcome for this customer?","What could you do at the start of each technical call to make opening the ITG automatic?"],"strengths":["s-empathy","s-tone","s-rapport","s-ownership"],"b":{"obs":"troubleshot from memory without opening the applicable ITG flow, even though the concern required it","focus":"consistent ITG use","commit":"open the applicable ITG flow as soon as a technical concern is identified and follow it from the first step, even on familiar issues","m":"the applicable ITG flow opened and followed for every concern that requires troubleshooting","coach":"a practice run that opens and follows the applicable ITG flow for a common connection concern"},"note":"Confirm which ITG flow applied to this call and when the program requires ITG use. Verify from the recording or account notes that the flow was not used at all; if it was used but steps were skipped, Incorrect / Incomplete ITG Usage is the better fit."},{"id":"tech-tools-navigation","cat":"tech","title":"Poor Tools Navigation","desc":"Slow or inefficient movement through systems and tools, such as searching in the wrong places or opening unneeded screens, creating silence and longer calls.","kw":["tools","navigation","systems","slow navigation","screens","clicking around","searching","cannot find","tool proficiency","too many screens","efficiency","handle time","aht","long call","dead air","lost in tools","system knowledge"],"tags":["Tools","Efficiency","Handle Time"],"kpi":["QA"],"theme":"tech","feedback":"While you were looking for account and equipment details, you moved through several screens and searched in areas that did not hold the information you needed. Finding information quickly matters because each extra screen can add silence to the call, and the customer cannot see the work happening on your side. Long gaps can make the customer wonder whether the issue is being handled and can turn a straightforward concern into a longer call. On future calls, go directly to the screens each call type requires, use a short navigation reference for the tasks you handle most, and tell the customer what you are pulling up while the systems load.","impact":"Most navigation delays come from limited practice with where information lives in the tools, or from searching instead of following a known path. Each extra screen adds time and silence, which can increase handle time, prompt the customer to ask whether you are still there, and reduce their confidence in the support. Across many calls, the added time can also reduce availability for other customers who are waiting.","plan":"Each day for the next {duration}, you will spend a few minutes practicing the navigation path for the call types you handle most often, using a short reference we build together that lists the screens each one requires. On live calls, you will go directly to those screens instead of searching, and when a system is slow to load, you will tell the customer what you are opening. You will also note any screen that took longer to find than expected and bring it to our midweek check-in. Success means direct navigation and no extended silences caused by searching across all {calls} calls we review within {followup}.","followup":"Today, we will complete a timed tools navigation practice for the call types from this interaction, so we can see exactly where the delays come from. I will listen to {calls} of your calls within {followup}, focusing on the stretches where you are navigating, and we will repeat the timed practice at the end of the {durationAdj} plan to compare.","example":[{"label":"While the tools load","say":"I'm opening your equipment details now, and the page can take a few seconds to load. While it does, can you tell me whether the slowdown happens on every device or only one?"},{"label":"Once the details load","say":"Okay, I have your equipment status in front of me. Next, I'm checking the connection history so we can see when the problem started."}],"questions":["Which screens did you open on this call that did not have the information you needed?","If you mapped the path for this call type, which screens would be on it and in what order?","Which tasks take you the longest to find in the tools, and what would help you reach them faster?"],"strengths":["s-itg","s-diagnosis","s-empathy","s-resolution"],"b":{"obs":"moved through several screens and searched in the wrong areas of the tools to find needed details, which created silence and lengthened the call","focus":"efficient tools navigation","commit":"go directly to the screens each call type requires, using a short navigation reference, and tell the customer what you are opening while systems load","m":"direct navigation to the needed information with no extended silence caused by searching","coach":"a timed tools navigation practice for the call types you handle most often"},"note":"Confirm the current systems and screens used for this call type before the session, so practice reflects the tools as they are today. On the recording, separate navigation delays from system slowness before documenting this behavior."},{"id":"tech-root-cause","cat":"tech","title":"Incorrect Root Cause Identification","desc":"Concluding the wrong cause of a technical issue, such as treating Wi-Fi coverage as an outage or a device issue as a network issue, which leads to the wrong fix.","kw":["root cause","wrong diagnosis","misdiagnosis","diagnosis","wrong fix","wrong cause","wi-fi coverage","wifi","assumed outage","device issue","network issue","wrong conclusion","symptoms","signal","incorrect troubleshooting"],"tags":["Diagnosis","Troubleshooting","Technical Accuracy"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"Once the customer described the symptoms, you settled on a cause the evidence did not support, and the fix you recommended targeted a different problem. The right fix depends on the right cause, and similar symptoms can have different sources: weak Wi-Fi in one room usually points to coverage, not an outage, and one device that will not connect often points to the device, not the network. With the wrong cause, the customer may complete steps that cannot help and still have the issue. From here, compare the customer's description with your check results, rule out other likely causes, and confirm the root cause before recommending a fix.","impact":"Settling on the wrong cause often comes from anchoring on the first explanation that fits, especially when a symptom resembles a common issue. A fix aimed at the wrong cause can use up the customer's time, lead to unnecessary steps, visits, or equipment changes, and leave the real issue in place, which increases the likelihood of a repeat contact and makes the next recommendation harder to trust.","plan":"During the next {duration}, you will confirm the likely root cause with the results of your checks before recommending any fix, including at least one check that rules out the most common alternative cause. Using the applicable ITG flow, you will separate Wi-Fi coverage, single-device, equipment, and outage causes before deciding on a next step. When the results do not clearly point to one cause, you will continue troubleshooting or follow the applicable escalation path instead of choosing the closest fit. We will review {calls} technical calls within {followup}, targeting a root cause that is supported by completed checks and explained to the customer in all {calls} calls.","followup":"We will listen to this call side by side and pause at the point where the cause was decided, so we can trace which checks would have pointed to the actual root cause. I will review {calls} technical calls within {followup}, noting the evidence behind each conclusion you reach, and we will check in midweek on any symptoms that were difficult to separate. We will close the plan with a review at the end of the {durationAdj} period.","example":[{"say":"Since the connection is strong when you're near the gateway but drops in the back bedroom, this looks like a Wi-Fi coverage issue rather than a service problem. Let me confirm there's no outage in your area first, and then we'll look at where the gateway is placed and what can help the signal reach that room."}],"questions":["What did the customer describe that pointed you toward the cause you chose?","Which check could have confirmed or ruled out that cause before you recommended the fix?","When two causes seem possible, how will you decide which one the evidence supports?"],"strengths":["s-acknowledgement","s-empathy","s-ownership","s-research-updates"],"b":{"obs":"settled on a root cause the available evidence did not support, which led to a fix aimed at a different problem than the one the customer had","focus":"root cause accuracy","commit":"confirm the root cause with check results that rule out other likely causes, such as Wi-Fi coverage, a single device, or an outage, before recommending a fix","m":"a root cause supported by completed checks before any fix is recommended","coach":"a side-by-side review of this call that traces which checks would have revealed the root cause"},"note":"Confirm the applicable ITG guidance for separating Wi-Fi coverage, device, equipment, and outage causes before the session. Identify on the recording the moment the cause was decided and what evidence was available at that point."},{"id":"tech-diagnostics","cat":"tech","title":"Insufficient Technical Diagnostics","desc":"Concluding the cause or recommending a fix before running enough checks on symptoms, scope, equipment status, signal, and outages.","kw":["diagnostics","diagnosis","not enough checks","insufficient troubleshooting","signal","signal check","equipment status","outage check","scope","symptoms","jumped to fix","quick fix","rushed troubleshooting","assumption","incomplete diagnostics","troubleshooting"],"tags":["Troubleshooting","Diagnostics","Technical Accuracy"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"Before recommending a fix, you ran only a few checks, so the recommendation rested on limited information about what was happening with the service. Checks such as confirming the symptoms and when they started, how many devices are affected, the equipment status, the signal, and whether there is an outage are what turn an assumption into an informed decision. Without them, the customer may be asked to restart, reset, or replace things that were never the problem, while the actual issue remains. The expectation is to complete the relevant checks in the applicable flow and share what each result shows before you recommend the next step.","impact":"Insufficient diagnostics usually happen when the first symptom suggests a familiar fix, or when there is pressure to move the call along quickly. Skipping checks saves a little time in the moment but can lead to a fix that misses the cause, unnecessary equipment changes or technician visits, and a repeat contact when the issue returns. It can also leave little in the account notes for the next person who helps the customer.","plan":"Over the next {duration}, you will complete the diagnostic checks in the applicable ITG flow before recommending any fix, including the symptoms and when they started, scope across devices and services, equipment status, signal, and outage status. You will briefly tell the customer what each check shows, so your recommendation is clearly connected to the results. When a check cannot be run, such as when the customer is away from the equipment, you will note it and plan how it will be completed. The target for the {calls} technical calls we review within {followup} is a complete set of relevant checks before the first fix is recommended on every call.","followup":"To start, you will complete a short self-assessment of this call against a diagnostic checklist built from the applicable ITG flow, and we will compare which checks were completed and which were missed. Within {followup}, I will review {calls} technical calls using the same checklist, and we will discuss the results midweek. At the end of the {durationAdj} plan, we will decide whether you still need the checklist or whether the checks have become routine.","example":[{"say":"Before I recommend anything, I'd like to run a few checks so we're working from the full picture. I'm going to confirm there's no outage in your area, look at the signal reaching your gateway, and see how your devices are connecting. Then I'll walk you through what we found and the best next step."}],"questions":["Which checks did you complete before recommending the fix, and which ones did you skip?","What could the remaining checks have told you about the cause?","How can you keep the call moving while still completing the checks the flow requires?"],"strengths":["s-empathy","s-rapport","s-ownership","s-verification"],"b":{"obs":"recommended a fix before running enough checks to confirm the symptoms, scope, equipment status, signal, and outage status","focus":"thorough diagnostics","commit":"complete the diagnostic checks in the applicable flow, including symptoms, scope, equipment, signal, and outage status, before concluding the cause or recommending any fix","m":"symptom, scope, equipment, signal, and outage checks completed before a fix is recommended","coach":"a self-assessment of this call against a diagnostic checklist built from the applicable ITG flow"},"note":"Confirm the diagnostic checks the current ITG flow requires for this issue type before the session, so the checklist reflects current steps. If the checks were completed but the conclusion was wrong, Incorrect Root Cause Identification may be the better fit."},{"id":"tech-equipment-replacement","cat":"tech","title":"Inappropriate Equipment Replacement","desc":"Replacing or swapping equipment without diagnostic evidence that the device is the cause, or before troubleshooting is complete under the applicable criteria.","kw":["equipment swap","replacement","equipment replacement","swap","new modem","new gateway","replace router","unnecessary swap","device exchange","no fault found","equipment","tv box","remote","replacement criteria","premature replacement"],"tags":["Equipment","Process","Cost Awareness"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"In this interaction, you offered to replace the equipment before troubleshooting was complete and without results showing that the device was causing the issue. A replacement can feel like the fastest answer, but if the equipment is not the cause, the customer may go through the effort of exchanging it and still have the same problem. That can mean another round of troubleshooting, more time without reliable service, and less confidence in the next recommendation. Going forward, complete the applicable troubleshooting first, review the results against the current replacement criteria, and recommend a replacement only when the evidence points to the equipment.","impact":"Unnecessary replacements often come from wanting to give the customer a definite solution, or from treating a swap as a shortcut when troubleshooting feels slow. When the equipment is not the cause, the replacement adds effort and waiting for the customer, leaves the issue unresolved, and creates avoidable equipment and handling costs, while also increasing the likelihood of a repeat contact.","plan":"For the next {duration}, you will complete the applicable ITG troubleshooting before discussing a replacement, including signal, connection, and equipment status checks. Before offering a swap, you will compare the results with the current replacement criteria and explain to the customer which result points to the equipment. If the criteria are not met, you will continue with the next step in the flow or the applicable escalation path instead. We will review {calls} calls within {followup}, including every call where a replacement was discussed, targeting zero replacements offered before troubleshooting is complete.","followup":"We will review the current equipment replacement criteria together and apply them to the troubleshooting results from this call, so you can see where the decision should have been made. I will audit every replacement you offer over the {duration}, along with {calls} other technical calls within {followup}, and we will meet at the midpoint to discuss any borderline cases. At the end of the plan, we will confirm that each replacement met the criteria.","example":[{"say":"I know a new gateway sounds like the quickest fix, and if the equipment turns out to be the problem, we'll look at replacing it. First, let me run a couple of checks on the signal and the connection, so a replacement is only recommended if the results point to the equipment and you don't go through an exchange that leaves the same issue in place."}],"questions":["What results did you have that pointed to the equipment before you offered the replacement?","Which troubleshooting steps were still open when the replacement came up?","How could you respond when a customer asks for new equipment before the checks are complete?"],"strengths":["s-empathy","s-ownership","s-verification","s-tone"],"b":{"obs":"offered to replace the equipment before troubleshooting was complete and without diagnostic results showing the device was the cause","focus":"evidence-based equipment decisions","commit":"complete the applicable troubleshooting and confirm the results meet the current replacement criteria before offering to replace or swap any equipment","mx":"Every equipment replacement offered during the next {duration} follows completed troubleshooting and is supported by results that meet the applicable replacement criteria.","coach":"a review of the current equipment replacement criteria applied to the results from this call"},"note":"Confirm the current equipment replacement criteria and the diagnostic results required before a swap ahead of the session. Do not quote replacement fees, shipping methods, or timeframes in the coaching unless they are confirmed in the current process."},{"id":"tech-scheduling","cat":"tech","title":"Incorrect Technician Scheduling","desc":"Scheduling a technician visit that was not needed, the wrong type of visit, or a visit before the required troubleshooting was complete.","kw":["truck roll","dispatch","technician","tech visit","unnecessary visit","wrong visit type","scheduling","service call","appointment","premature dispatch","dispatch criteria","avoidable dispatch","repeat visit","cost","field tech"],"tags":["Dispatch","Process","Cost Awareness"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"During the interaction, you scheduled a technician visit before the required troubleshooting was complete, without confirming that a visit, or that type of visit, matched what the issue needed. A visit asks a lot of the customer, who may need to arrange time at home, and if the issue could have been resolved on the call or needed a different kind of visit, that time may be spent without fixing the problem. This can lead to a second appointment and a repeat contact. Going forward, finish the troubleshooting the flow requires, confirm the applicable dispatch criteria and visit type, and schedule only when the results support it.","impact":"Unneeded or mismatched visits are often booked when a visit feels like the safest option, or when troubleshooting is taking longer than expected. A visit that was not needed can cost the customer time at home, delay the actual fix, and create avoidable operational cost, and an issue that remains after the visit raises the chance of another appointment and a repeat contact.","plan":"Starting today and continuing for {duration}, you will complete the troubleshooting the applicable ITG flow requires before discussing a technician visit. Before scheduling, you will confirm that the results meet the current dispatch criteria and that the visit type matches the issue, and you will document the reason for the visit according to the current process. When the results do not support a visit, you will explain the next troubleshooting step or escalation path to the customer instead. Our review of {calls} calls within {followup} will include every visit you schedule, with a target of zero visits booked before the required troubleshooting is complete.","followup":"Together, we will walk through the applicable dispatch criteria using the troubleshooting from this call, and you will decide at each step whether the results supported a visit at that point. Within {followup}, I will review {calls} of your calls, along with every visit scheduled during that time, to confirm the criteria and visit type were met. At the end of the {durationAdj} plan, we will look at the visits you scheduled and whether any could have been avoided.","example":[{"say":"I want to make sure a technician visit is the right next step, so let's finish two more checks first. If the results show the issue is with the signal coming into your home or the wiring, I'll schedule the right type of visit and explain exactly what to expect. If not, we may be able to fix this today without you having to wait at home for a visit."}],"questions":["What results did you have when you decided to schedule the visit, and did they meet the dispatch criteria?","Which remaining steps in the flow might have resolved the issue without a visit?","How would you explain to a customer why you want to finish troubleshooting before booking a visit?"],"strengths":["s-acknowledgement","s-empathy","s-verification","s-closing"],"b":{"obs":"scheduled a technician visit before the required troubleshooting was complete and without confirming the visit was needed or the visit type matched the issue","focus":"accurate dispatch decisions","commit":"finish the required troubleshooting and confirm the applicable dispatch criteria and visit type before scheduling any technician visit","mx":"Every technician visit scheduled during the next {duration} follows completed troubleshooting and matches the applicable dispatch criteria and visit type.","coach":"a walkthrough of the applicable dispatch criteria using the troubleshooting results from this call"},"note":"Confirm the current dispatch criteria, available visit types, and the troubleshooting required before scheduling, ahead of the session. Check whether the visit on this call met those criteria, and do not quote visit fees unless they are confirmed in the current process."},{"id":"tech-appointment-expectations","cat":"tech","title":"Incorrect Appointment Expectations","desc":"Giving wrong or incomplete information about a technician appointment, such as the window, the visit purpose, who must be present, preparation, or rescheduling.","kw":["appointment","appointment window","arrival window","technician","tech visit","expectations","who must be home","preparation","reschedule","cancel appointment","missed appointment","no show","visit details","what to expect","appointment confirmation"],"tags":["Expectations","Dispatch","Customer Education"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"After setting up the technician appointment, you gave the customer incomplete or inaccurate details about what to expect from the visit. Customers plan their day around an appointment, so the window, the purpose of the visit, who needs to be present, and how to prepare all shape whether the visit goes smoothly. Without those details, the customer may miss part of the window, leave the equipment hard to reach, or call back to confirm information that belonged on this call. Next time, before closing, confirm the window, what the technician will focus on, who should be present, any preparation, and how to reschedule, using only details from the current process.","impact":"When the focus is on getting the visit booked, the appointment details are often the part of the close that gets rushed. A customer who does not know the window, the purpose of the visit, or how to prepare and reschedule is more likely to miss the appointment or have an unproductive visit, which can delay the repair, lead to a second appointment, and create a repeat contact to clarify details.","plan":"Throughout the next {duration}, whenever you set a technician appointment, you will confirm the appointment window, what the technician will focus on, who should be present, how to prepare the area around the equipment, and how to reschedule if plans change. You will share only details confirmed in the current process and avoid estimating anything the process does not support. Before closing, you will check that the customer has noted the window and any preparation steps. We will review {calls} calls within {followup}, including every appointment you set in that period, targeting a complete appointment confirmation on each one.","followup":"We will roleplay an appointment confirmation from the moment the visit is booked to the end of the call, covering each detail the customer needs. I will review {calls} of your calls within {followup}, including every technician appointment you set, and check each one against a short appointment checklist. We will discuss what the checklist shows midweek and again at the end of the {durationAdj} coaching period.","example":[{"label":"Confirming the visit","say":"Your appointment is booked for the window we confirmed together. The technician will look at the connection issue we worked on today, including the signal coming into your home."},{"label":"Preparing the customer","say":"Please have someone there for the whole window who can let the technician in and answer questions about the service, and keep the area around your equipment clear. If your plans change, contact us before the appointment so we can reschedule it."}],"questions":["Which appointment details did the customer leave the call without?","How might the visit go if the customer is not ready when the technician arrives?","What short checklist could you use before closing to cover every appointment detail?"],"strengths":["s-troubleshooting","s-diagnosis","s-itg","s-empathy"],"b":{"obs":"gave incomplete or inaccurate details about the technician appointment, such as the window, the purpose of the visit, preparation, or how to reschedule","focus":"appointment expectation setting","commit":"confirm the appointment window, the purpose of the visit, who should be present, how to prepare, and how to reschedule before closing the call","mx":"Every technician appointment set during the next {duration} includes the window, visit purpose, who should be present, preparation, and how to reschedule.","coach":"a roleplay of a full appointment confirmation, from booking the visit to closing the call"},"note":"Confirm the current appointment window options, who must be present, preparation guidance, and the reschedule and cancel steps before the session. Do not quote fees or timeframes that are not in the current process."},{"id":"tech-outage-expectations","cat":"tech","title":"Incorrect Outage Expectations","desc":"Not checking for an outage, stating an outage that is not confirmed, or promising restoration times the available information does not support.","kw":["outage","outage check","service down","area outage","restoration time","eta","estimated restoration","outage updates","no outage check","wrong outage","promised time","service interruption","network issue","outage notification","expectations"],"tags":["Outage","Expectations","Technical Accuracy"],"kpi":["QA","aiCR"],"theme":"tech","feedback":"When the customer reported that the service was down, you set expectations about the cause or when service would return without first confirming the outage status through the available information. Outage details shape the customer's next decision, whether that is troubleshooting, waiting, or making other plans for work or school. If the information turns out to be wrong, or a restoration time passes without service returning, the customer may lose trust and contact us again. Instead, check for an outage on every service concern, share only what is confirmed, be clear when no restoration time is available, and explain how the customer can get updates.","impact":"Outage errors often start with an assumption, such as expecting an outage because similar calls are coming in, or with the urge to give a worried customer a definite time. An unconfirmed outage can stop troubleshooting that could have found an issue in the home, and a missed restoration time can turn one call into several, increasing repeat contacts, escalation risk, and frustration.","plan":"Over the next {duration}, you will check for an outage at the start of every connectivity or service concern, following the current process. When an outage is confirmed, you will share only the details available, including a restoration estimate only if one is provided, and explain how the customer can receive updates. When no outage is found, you will continue troubleshooting the home connection instead of assuming one. Within {followup}, we will review {calls} service-related calls, targeting an outage check on every call and zero unsupported restoration times.","followup":"First, we will review the current outage process together, including where outage status is checked and how customers receive updates, and then roleplay a call where no restoration time is available yet. Within {followup}, I will listen to {calls} of your service-related calls to confirm the outage check and the expectations you set, and we will go over the full set of calls at the end of the {duration}.","example":[{"say":"I checked, and there is a confirmed outage affecting service in your area. I don't have a confirmed restoration time to share yet, and I don't want to give you a time I can't stand behind. You can check for updates in the Xfinity app, and if your service isn't back once the outage is resolved, please reach out so we can look at your equipment."}],"questions":["What information did you have about an outage before you described the situation to the customer?","How might the customer plan their day around the restoration time you gave?","How would you explain an outage to a customer when no restoration time is available yet?"],"strengths":["s-acknowledgement","s-empathy","s-deescalation","s-verification"],"b":{"obs":"shared outage status or restoration timing that was not confirmed, or moved into troubleshooting without first checking for an outage","focus":"accurate outage communication","commit":"check for an outage on every service concern and share only confirmed outage details, including how the customer can get updates","m":"an outage check on every service concern and no restoration times beyond confirmed information","coach":"a roleplay of an outage call where no restoration time is available yet"},"note":"Confirm how outages are checked and how customers receive outage updates under the current process before the session. Restoration estimates should be shared only when they come from approved sources."},{"id":"tech-verification","cat":"tech","title":"Missing Account Verification","desc":"Discussing, reviewing, or changing account information before completing the required verification, which creates privacy and security risk.","kw":["verification","verify","account verification","not verified","skipped verification","security","privacy","security risk","authentication","authorized user","unverified caller","account security","data privacy","compliance","caller identity","fraud"],"tags":["Security","Compliance","Privacy"],"kpi":["QA"],"theme":"tech","feedback":"At the start of the call, you began discussing account details before completing the required verification. Verification protects the customer's personal and account information, and it confirms that the person on the line is authorized to hear details or request changes. When it is skipped, information may be shared with someone who should not have it, or a change may be made without the account holder's consent, which can put the customer at real risk and create compliance concerns. On every call, complete the required verification before you review, discuss, or change anything on the account, even when the caller seems to know the details.","impact":"Verification is most often missed when the caller sounds confident, already knows account details, or when the concern feels urgent and the call moves straight to the issue. Sharing or changing information without verification can expose the customer to privacy violations, unauthorized changes, or fraud, and it creates compliance risk that can affect quality results no matter how well the rest of the call goes.","plan":"Beginning with your next call and continuing for {duration}, you will complete the required verification before discussing, reviewing, or changing any account information, even when the caller already knows account details or the concern feels urgent. If a caller cannot complete verification, you will explain what can and cannot be discussed and offer the options the current process allows. You will introduce verification with a brief reason, such as protecting the account, so the step feels natural to the customer. We will review {calls} calls within {followup}, targeting required verification completed before any account information is discussed in all {calls} calls.","followup":"Before anything else, we will go over the current verification steps and practice the first minute of the call in a short roleplay, including how to respond when a caller pushes back on verification. I will review {calls} of your call
