.","They say no."],"scenario":"sp-where-it-needs-to-work","scenarioTitle":"Where it needs to work"},{"id":"concern-another-bill","family":"MOBILE","said":"I can't take on another bill. The bill's high enough already.","clarify":"Whether it is their budget in general, a particular figure, or taking on anything new at all. It comes up about Mobile and about Internet and TV alike.","ask":"Is it the monthly cost, or taking on anything new at all?","option":"Only figures verified in the approved source: never an \"as low as\" figure, and never a saving worked out on the call.","conditions":"If they want the details, give each money figure and each fee on its own, then the final understanding checks.","decision":"Any no ends it. Do not raise it again later in the call.","verify":["Price, fees and any promotion, from the approved source.","Restrictions on the account, before anything is mentioned."],"avoid":["Savings arithmetic of any kind.","\"As low as\" figures.","A credit offered to make the cost go away.","Presenting a new line or service as a way to lower the bill."],"stop":["They say no, in any words.","The concern is about the current bill: resolve that and leave the offer.","A restriction on the account rules an offer out: say nothing about one, and never suggest another account or another person's name."],"scenario":"sp-the-line-that-cannot-be-offered","scenarioTitle":"The line that cannot be offered"},{"id":"concern-when-the-promotion-ends","family":"MOBILE","said":"What happens when the promotion ends?","clarify":"Which charges they mean. The answer is a required part of any Mobile order, not an optional extra.","ask":"Shall I read you exactly what changes, and when?","option":"Read the terms from the approved source. Do not paraphrase or round them.","conditions":"Make sure they understand the charges that apply after the promotion, and ask them to describe those charges back in their own words.","decision":"If they cannot describe the later charges back, or decide against it once they understand them, nothing is ordered.","verify":["How long the promotion lasts and what is charged after it, from the approved source."],"avoid":["\"It's still cheap.\"","\"You can cancel anytime.\"","Summarising the later charges from memory."],"stop":["They cannot describe the later charges back.","They decide against it once they understand the later charges."],"scenario":"sp-when-the-promotion-ends","scenarioTitle":"When the promotion ends"},{"id":"concern-switching-and-the-number","family":"MOBILE","said":"Switching is a hassle, and I'm keeping my number.","clarify":"Which part worries them: the number, the phone, a contract, or being without service.","ask":"Is it the number, the phone, a contract, or being without service that worries you?","option":"Describe only the approved steps, with the porting process exactly as the approved source states it.","conditions":"Give the porting disclosure in the gate's own words - it is among the controls below - and add no timing of your own to it.","decision":"If the details needed from their current carrier are missing, pause: nothing is ordered until they have them.","verify":["Porting requirements and timing, from the approved source.","That their number can be moved, through the approved system."],"avoid":["A promise about how quickly the switch happens.","Any transfer time the approved source does not give.","Asking for carrier details the approved process does not ask for."],"stop":["Details from their current carrier are missing: pause.","They say no."],"scenario":"sp-keeping-the-number","scenarioTitle":"Keeping the number"},{"id":"concern-will-my-phone-work","family":"MOBILE","said":"Will my phone work?","clarify":"Whether it is a phone they own and want to keep using.","ask":"Is it a phone you own and want to keep using?","option":"Give the result of the device check and nothing more: it works, it does not, or it is not yet known.","conditions":"If it passes and they go ahead, the device checks and every disclosure apply in full.","decision":"If the device is already on an active or pending line elsewhere, the bring-your-own-device order stops there, whatever the reason.","verify":["Compatibility, lock status and eSIM support, through the approved device check."],"avoid":["\"It should be fine.\"","Saying the phone can be kept before the check is done.","Looking for a way round a device that is already on another line."],"stop":["The device is on another active or pending line: stop.","The check shows it will not work and they want no verified alternative."],"scenario":"sp-will-my-phone-work","scenarioTitle":"Will my phone work?"},{"id":"concern-why-my-details","family":"MOBILE","said":"Why do you need my SSN? I've already verified.","clarify":"Whether it is sharing the details at all that worries them, or sharing them over the phone.","ask":"Is it sharing it at all, or sharing it by phone, that worries you?","option":"Explain that the account holder enters their own details, so you never hear or type them, and why the account role matters.","conditions":"Explain why a card number is needed, including autopay and future Mobile payments, and confirm the caller holds the role the line needs.","decision":"If they will not enter the details themselves, nothing goes further. That is a no sale, not a problem to work around.","verify":["The approved privacy wording for this step."],"avoid":["Asking them to say, hum, whisper or encode the details.","Offering to enter the details for them.","Coaching them past the self-entry step."],"stop":["They will not enter the details themselves: no sale.","The caller does not hold the account role: pause until the person who does can take part.","All three iGuard attempts fail: escalate to a Supervisor."],"scenario":"sp-not-the-one-who-can-add-it","scenarioTitle":"Not the one who can add it"},{"id":"concern-last-time-it-was-free","family":"MOBILE","said":"Last time I was told it was free, and I was charged.","clarify":"What they were told before, and whether that charge is still open.","ask":"What were you told at the time?","option":"Deal with the earlier charge first. Only once it is settled, and only if they want to, describe a verified option.","conditions":"If they choose to go on, every disclosure applies, including exactly what is still charged.","decision":"If the earlier charge is still disputed, escalate it and leave the offer.","verify":["The account record of the earlier charge.","The approved route for a disputed promise."],"avoid":["\"It won't happen this time.\"","Blaming the agent who handled the earlier call.","Saying \"free\" without saying what is still charged."],"stop":["The earlier charge is still in dispute: escalate first.","They say no."],"scenario":"sp-last-time-it-was-free","scenarioTitle":"Last time it was free"},{"id":"concern-watch-or-tablet-on-the-bill","family":"MOBILE","said":"Would a watch or a tablet add to my bill?","clarify":"Whether they mean the line, the device or both, and whether they already have the device.","ask":"Do you already have the device, or would you need one?","option":"Give the verified line and device charges from the approved source, and any payment plan as that source states it.","conditions":"Give the amount to pay today and the estimated monthly charge as two separate figures, then any one-time fee.","decision":"If they do not want the cost, or want to ask someone first, leave it there.","verify":["Line and device charges, which watches and tablets qualify, and any payment plan, from the approved source.","Whether a watch needs a paired phone or a particular plan, through the approved process."],"avoid":["\"It's only a few dollars.\"","\"On us\" or \"free\" without saying what is still charged.","Suggesting a health benefit."],"stop":["They do not want the cost.","They want to consult someone first: pause."],"scenario":"sp-the-watch-he-keeps-asking-about","scenarioTitle":"The watch he keeps asking about"},{"id":"concern-only-called-about-the-internet","family":"MOBILE","said":"I only called about the internet.","clarify":"Nothing to clarify: it is a no, and it ends the conversation about anything else.","ask":"Is there anything else about today's issue I can help with before we finish?","option":"Nothing. The checkpoint is over.","conditions":"Nothing is offered, so there is nothing to disclose.","decision":"Close warmly, with a recap of what was fixed.","verify":[],"avoid":["\"It'll only take a minute.\"","Rewording the offer or bringing it back at the close.","Offering a watch or a tablet instead."],"stop":["Immediately."],"scenario":"sp-only-called-about-the-internet","scenarioTitle":"I only called about the internet"},{"id":"concern-fine-as-we-are","family":"INTERNET_TV","said":"We're fine as we are.","clarify":"Whether they are genuinely fine, or tired of the call.","ask":"Since the fix, is it doing what you need?","option":"Nothing, unless a gap appears in what they say.","conditions":"Nothing is offered, so there is nothing to disclose.","decision":"If it is doing what they need, close the call warmly.","verify":["That the repair is confirmed and nothing is still open."],"avoid":["\"Most homes need more now.\"","Asking a second time.","Reading tiredness as interest."],"stop":["They confirm it does what they need: close."],"scenario":"sp-loves-the-package","scenarioTitle":"Loves the package"},{"id":"concern-would-we-notice","family":"INTERNET_TV","said":"Would we even notice the difference?","clarify":"Whether there is a real need behind it, or a question about the product.","ask":"When does it feel slow, and for whom?","option":"Describe an upgrade only for a capacity need that remains after the fix, and let them try the repaired service first.","conditions":"If they choose a change, offer the broadband facts label and give the terms, the one-time fees and any Next Gen disclosure that applies.","decision":"With no capacity need, tell them what they have fits, and leave it.","verify":["Current plans, speeds and equipment requirements, from the approved source.","Which Sales Integrity controls govern an Internet order, through TSX compliance."],"avoid":["\"You'll feel the difference.\"","An upgrade offered for a problem that belongs to one device.","Naming a speed from a training deck."],"stop":["There is no capacity need.","The slowness is one device or one room."],"scenario":"sp-busy-evenings-after-the-fix","scenarioTitle":"Busy evenings, after the fix"},{"id":"concern-no-technician-no-new-box","family":"INTERNET_TV","said":"I don't want a technician out, or another box.","clarify":"Whether it is the visit, the equipment or the cost.","ask":"Is it the visit, or the cost?","option":"Describe installation and equipment only as the approved source states them for this order.","conditions":"Name every one-time fee that applies, installation included, in full: never half of a conditional charge.","decision":"Any no ends it.","verify":["Installation, equipment and fees for this order, from the approved source."],"avoid":["Giving only half of a conditional charge.","Promising no visit or no equipment before it is checked.","A credit offered to take away the installation cost."],"stop":["They say no."],"scenario":"sp-a-phone-line-only","scenarioTitle":"A phone line only"},{"id":"concern-contract-lock-in","family":"INTERNET_TV","said":"I'm in a contract. Will this lock me in?","clarify":"Whose contract they mean: the one they have now, or a new one.","ask":"Is that your current contract, or a new one with us?","option":"Their current contract is theirs to check. State ours only as the approved source gives it.","conditions":"Tell them about contracts and term agreements, and any early termination fee that applies.","decision":"If they need to check their current contract first, pause and order nothing.","verify":["The offer's term, from the approved source."],"avoid":["\"There's no contract\", unless the approved source confirms it.","Guessing when their current contract ends or what leaving it costs.","Offering to cover a fee to win the sale."],"stop":["They need to check their current contract: pause.","They say no."],"scenario":"sp-their-internet-our-tv","scenarioTitle":"Their internet, our TV"},{"id":"concern-my-channel-or-sport","family":"INTERNET_TV","said":"Will I get my channel, or my team's games?","clarify":"Which channel or games matter most to them.","ask":"Which channel or games matter most to you?","option":"Answer from the approved lineup only. If it is not carried, say so.","conditions":"If they go ahead, give the terms, fees and equipment that apply.","decision":"If what they want is not carried, there is no change to offer.","verify":["The lineup, and any rights for that content, from the approved source.","Which Sales Integrity controls govern a TV order, through TSX compliance."],"avoid":["Promising a channel or games from memory.","A package offered in the hope it includes what they want."],"stop":["It is not carried: no change."],"scenario":"sp-the-league-they-cannot-watch","scenarioTitle":"The league they cannot watch"},{"id":"concern-why-pay-more","family":"INTERNET_TV","said":"Why would I pay more when it keeps dropping?","clarify":"Whether it is still happening, or it was the fault fixed today.","ask":"Is it still dropping, or was that what we fixed today?","option":"If it is still happening, it is a repair, not an offer.","conditions":"Nothing is offered while a fault is open.","decision":"If the fix holds and the service fits, tell them so and leave it.","verify":["The repair history, and whether the fault is still open."],"avoid":["An upgrade presented as the fix.","Offering anything while a fault is open."],"stop":["A fault is still open: repair only."],"scenario":"sp-the-fault-not-the-plan","scenarioTitle":"It was the fault, not the plan"}];

function build(){
  root=document.createElement("main"); root.id="my-shift"; root.className="sl-main mx-auto w-full max-w-[86rem] flex-1 px-4 py-6 [overflow-wrap:anywhere] sm:px-6 sm:py-8"; root.setAttribute("aria-label",LABEL);

   '<div class="space-y-8" id="ms-view-shift">'+shiftMarkup()+'</div><div class="space-y-8" id="ms-view-board" hidden>'+boardMarkup()+'</div>';
  // events: the call log

  root.querySelectorAll("#ms-view-shift [data-multi]").forEach(function(g){ g.addEventListener("change",function(e){ var f=g.getAttribute("data-multi"), v=e.target.value, a=(form[f]||[]).filter(function(x){ return x!==v; }); if(e.target.checked) a.push(v); form[f]=a; }); });
  q("ms-acct").addEventListener("input",function(){ var v=this.value.replace(/\D/g,""); if(v!==this.value) this.value=v; this.classList.remove("err"); renderRepeat(); });
  q("ms-save").addEventListener("click",saveCall); q("ms-cancel").addEventListener("click",function(){ resetForm(); setMsg(""); renderList(); });
  q("ms-same").addEventListener("click",sameAsLast);
  q("ms-acnote").addEventListener("click",function(){ if(!form.callType||!form.resolved){ setMsg("Pick the call type and whether the issue was resolved first, then copy the note."); return; } var cur=editId&&st.calls.find(function(c){ return c.id===editId; }), t=noteText(formRec(),cur?cur.ts:Date.now());
    copy(t,this,"Copy account note"); setMsg("Account note copied. Paste it into the account"+(t.indexOf(BLANK)>=0?" and fill in the blanks ("+BLANK+").":"."),true); });
  q("ms-msg").addEventListener("click",function(e){ var b=e.target.closest("[data-acnote]"); if(!b) return; var c=st.calls.find(function(x){ return x.id===b.getAttribute("data-acnote"); }); if(!c) return; var t=noteText(c,c.ts); copy(t,b,"Copy its account note"); say("Account note copied."+(t.indexOf(BLANK)>=0?" Fill in the blanks.":"")); });
  q("ms-hold-btn").addEventListener("click",function(){ startHold(); var b=q("ms-hold").querySelector('[data-hold="end"]'); if(b) b.focus(); });
  q("ms-hold").addEventListener("click",function(e){ var b=e.target.closest("[data-hold]"); if(!b) return; var a=b.getAttribute("data-hold");
    if(a==="end"){ endHold(); q("ms-hold-btn").focus(); }
    else if(a==="notify"){ try{ var pr=Notification.requestPermission(); if(pr&&pr.then) pr.then(function(){ q("ms-hold").removeAttribute("data-key"); renderHold(); }); }catch(err){} } });
  q("ms-del").addEventListener("click",function(){ if(!editId) return; if(this.textContent!=="Really delete?"){ this.textContent="Really delete?"; return; } st.calls=st.calls.filter(function(c){ return c.id!==editId; }); save(); resetForm(); setMsg("Call deleted.",true); tick=true; renderList(); renderBar(); tick=false; });
